<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UrbainAR - Vidéos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
    }

    /* Infos en haut */
    #video-info {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /* Contrôles en bas */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 15px;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }

    #video-nav button:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.08);
    }

    #video-nav button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<!-- Infos vidéo -->
<div id="video-info">
  <div id="video-title">Chargement...</div>
  <div>Vidéo <span id="current">1</span>/<span id="total">0</span></div>
</div>

<!-- Navigation vidéos -->
<div id="video-nav">
  <button id="btn-prev" onclick="previousVideo()" title="Vidéo précédente">⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante">➡️</button>
</div>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false">

  <a-assets>
    <video
      id="video"
      preload="auto"
      loop
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <!-- Marker Hiro avec vidéo verticale centrée -->
  <a-marker preset="hiro" id="marker" emitevents="true">
    <a-video
      src="#video"
      width="1.1"
      height="1.95"
      position="0 0 0"
      rotation="-90 0 0">
    </a-video>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let allVideos = [];
  let currentIndex = 0;
  let videoElement = null;
  let soundEnabled = true;

  async function loadAllVideos() {
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
          },
        }
      );

      allVideos = await response.json();
      console.log('✅ vidéos chargées:', allVideos.length);

      document.getElementById('total').textContent = allVideos.length;

      if (allVideos.length > 0) {
        loadVideo(0);
      } else {
        document.getElementById('video-title').textContent = 'Aucune vidéo';
      }
    } catch (error) {
      console.error('❌ Erreur chargement liste vidéos :', error);
    }
  }

  function loadVideo(index) {
    if (index < 0 || index >= allVideos.length) return;

    currentIndex = index;
    const video = allVideos[index];

    videoElement = document.querySelector('#video');
    videoElement.src = video.video_url;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    // UI
    document.getElementById('video-title').textContent = video.title || 'Vidéo UrbainAR';
    document.getElementById('current').textContent = index + 1;

    document.getElementById('btn-prev').disabled = index === 0;
    document.getElementById('btn-next').disabled = index === allVideos.length - 1;

    console.log(`▶️ Vidéo ${index + 1}/${allVideos.length}`);
  }

  function nextVideo() {
    if (currentIndex < allVideos.length - 1) {
      loadVideo(currentIndex + 1);
    }
  }

  function previousVideo() {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  }

  window.addEventListener('load', () => {
    loadAllVideos();

    const marker = document.querySelector('#marker');

    marker.addEventListener('markerFound', () => {
      console.log('🎯 Marker trouvé');
      if (videoElement) {
        videoElement
          .play()
          .then(() => console.log('▶️ Lecture vidéo'))
          .catch((e) => {
            console.log('⚠️ Autoplay bloqué, mute forcé.');
            soundEnabled = false;
            videoElement.muted = true;
            videoElement.play();
            document.getElementById('btn-sound').textContent = '🔇';
          });
      }
    });

    marker.addEventListener('markerLost', () => {
      console.log('❌ Marker perdu');
      if (videoElement) {
        videoElement.pause();
      }
    });
  });
</script>

</body>
</html>
