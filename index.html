<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR Supabase (géolocalisé)</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js A-Frame build avec location-based -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body, html {
        margin: 0;
        overflow: hidden;
      }
      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 20px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 12px;
        max-width: 80%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Autorise caméra, géolocalisation et orientation pour voir la vidéo au bon endroit.
    </div>

<!-- Vidéo HTML5 (texture uniquement, jamais en plein écran) -->
<video
  id="video-texture"
  src=""
  loop="true"
  muted
  playsinline
  webkit-playsinline
  x-webkit-airplay="allow"
  controls="false"
  style="display:none;"
  crossorigin="anonymous"
></video>


    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
      <!-- Caméra géolocalisée -->
      <a-camera
        id="urbainar-camera"
        gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 100"
        arjs-device-orientation-controls="smoothingFactor: 0.1"
        look-controls="enabled: false"
      ></a-camera>

      <!-- Panneau vidéo géolocalisé (taille réduite) -->
      <a-video
        id="video-plane"
        src="#video-texture"
        gps-new-entity-place="latitude: 0; longitude: 0"
        position="0 3 0"
        rotation="-90 0 0"
        width="0.8"
        height="0.8"
        scale="0.3 0.3 0.3"
      ></a-video>
    </a-scene>

    <button id="playWithSound">Activer le son</button>

    <script>
      const vid   = document.getElementById("video-texture");
      const btn   = document.getElementById("playWithSound");
      const plane = document.getElementById("video-plane");
      const info  = document.getElementById("info");

      // 1) Lire ?video=...&lat=...&lng=... dans l'URL
      let lat = null;
      let lng = null;

      try {
        const params = new URLSearchParams(window.location.search);
        const videoParam = params.get("video");
        lat = params.get("lat");
        lng = params.get("lng");

        if (videoParam) {
          vid.src = decodeURIComponent(videoParam);
        }

        if (!lat || !lng) {
          info.textContent = "Paramètres lat / lng manquants dans l'URL.";
        }
      } catch (e) {
        console.log("Erreur lecture paramètres URL:", e);
        info.textContent = "Erreur de lecture des paramètres d'URL.";
      }

      // 2) Quand les métadonnées sont chargées, ajuster le ratio du plan (en gardant une base petite)
      vid.addEventListener("loadedmetadata", () => {
        const vw = vid.videoWidth;
        const vh = vid.videoHeight;
        if (!vw || !vh || !plane) return;

        const baseWidth = 0.8; // plus petit qu'avant
        const aspect = vh / vw;
        const finalWidth = baseWidth;
        const finalHeight = baseWidth * aspect;

        plane.setAttribute("width", finalWidth);
        plane.setAttribute("height", finalHeight);
      });

      // 3) Démarrage auto en muet
      vid.muted = true;
      vid.play().catch(() => {});

      // 4) Au clic, activer le son
      btn.addEventListener("click", () => {
        vid.muted = false;
        vid.play().catch(err => console.log("Erreur lecture:", err));
        btn.style.display = "none";
      });

      // 5) Positionner le panneau vidéo aux bonnes coordonnées GPS
      window.addEventListener("load", () => {
        if (lat && lng && plane) {
          plane.setAttribute(
            "gps-new-entity-place",
            `latitude: ${lat}; longitude: ${lng}`
          );
          info.textContent =
            "Mets-toi à quelques mètres du lieu et oriente ton téléphone pour voir la vidéo.";
        }
      });

      // 6) (Optionnel) debug des updates GPS
      const camera = document.getElementById("urbainar-camera");
      camera.addEventListener("gps-camera-update-position", e => {
        console.log("GPS update:", e.detail.position);
      });
    </script>
  </body>
</html>
