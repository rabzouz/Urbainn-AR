<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #start-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 20px;
      background: linear-gradient(135deg, #00ffff, #ff00ff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 999;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,255,255,0.5);
    }
    #start-button:hover {
      box-shadow: 0 6px 20px rgba(255,0,255,0.7);
    }
  </style>
</head>
<body>

<!-- Bouton pour démarrer (requis pour autoplay) -->
<button id="start-button">▶ Démarrer l'AR</button>

<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
  
  <a-assets>
    <video id="video" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
  </a-assets>

  <a-marker preset='hiro' id="marker" emitevents="true" smooth="true">
    
    <!-- Cadre néon extérieur cyan - avec look-at pour faire face à la caméra -->
    <a-ring 
      position="0 0 0.01" 
      radius-inner="1.8" 
      radius-outer="2" 
      color="#00ffff"
      material="shader: flat; emissive: #00ffff; emissiveIntensity: 2; side: double"
      look-at="[camera]"
      animation="property: rotation; to: 0 0 360; loop: true; dur: 4000; easing: linear">
    </a-ring>

    <!-- Cadre néon intérieur magenta -->
    <a-ring 
      position="0 0 0.02" 
      radius-inner="2" 
      radius-outer="2.1" 
      color="#ff00ff"
      material="shader: flat; emissive: #ff00ff; emissiveIntensity: 1.5; side: double"
      look-at="[camera]"
      animation="property: rotation; to: 0 0 -360; loop: true; dur: 6000; easing: linear">
    </a-ring>

    <!-- Vidéo centrale -->
    <a-video 
      id="ar-video"
      src="#video" 
      width="3.2" 
      height="1.8" 
      position="0 0 0"
      look-at="[camera]">
    </a-video>

    <!-- Panneau d'informations - positionné en bas -->
    <a-plane 
      position="0 -1.2 0" 
      width="3.5" 
      height="0.6" 
      color="#000000"
      material="opacity: 0.85; transparent: true"
      look-at="[camera]"
      animation="property: material.emissive; from: #000000; to: #0a0a0a; loop: true; dur: 1500; dir: alternate">
      
      <!-- Nom d'utilisateur -->
      <a-text 
        id="username-text"
        value="@chargement..." 
        position="-1.6 0.15 0.01" 
        width="2.5"
        color="#00ffff"
        align="left"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
        shader="msdf">
      </a-text>

      <!-- Date et heure -->
      <a-text 
        id="date-text"
        value="Chargement..." 
        position="-1.6 -0.05 0.01" 
        width="2"
        color="#ffffff"
        align="left"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
        shader="msdf">
      </a-text>

      <!-- Compteur de vues -->
      <a-text 
        id="views-text"
        value="👁️ 0" 
        position="0.5 0.15 0.01" 
        width="1.8"
        color="#00ff00"
        align="left"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
        shader="msdf">
      </a-text>

      <!-- Compteur de likes avec animation -->
      <a-text 
        id="likes-text"
        value="❤️ 0" 
        position="0.5 -0.05 0.01" 
        width="1.8"
        color="#ff00ff"
        align="left"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
        shader="msdf"
        animation="property: scale; to: 1.15 1.15 1.15; loop: true; dur: 1000; dir: alternate; easing: easeInOutQuad">
      </a-text>

    </a-plane>

    <!-- Particules lumineuses gauche -->
    <a-sphere 
      position="2.5 1 0" 
      radius="0.1" 
      color="#00ffff"
      material="emissive: #00ffff; emissiveIntensity: 3; shader: flat"
      animation="property: position; to: 2.5 -1 0; loop: true; dur: 2000; dir: alternate; easing: easeInOutQuad">
    </a-sphere>

    <!-- Particules lumineuses droite -->
    <a-sphere 
      position="-2.5 0.5 0" 
      radius="0.1" 
      color="#ff00ff"
      material="emissive: #ff00ff; emissiveIntensity: 3; shader: flat"
      animation="property: position; to: -2.5 -0.5 0; loop: true; dur: 1500; dir: alternate; easing: easeInOutQuad">
    </a-sphere>

    <!-- Logo torique flottant au-dessus -->
    <a-torus 
      position="0 2 0" 
      radius="0.4" 
      radius-tubular="0.05"
      color="#00ffff"
      material="emissive: #00ffff; emissiveIntensity: 2.5; shader: flat"
      look-at="[camera]"
      animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
      animation__float="property: position; to: 0 2.3 0; loop: true; dur: 2000; dir: alternate; easing: easeInOutSine">
    </a-torus>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let videoElement = null;
  let isStarted = false;

  // Bouton de démarrage (requis pour autoplay navigateur)
  document.getElementById('start-button').addEventListener('click', function() {
    this.style.display = 'none';
    isStarted = true;
    loadVideoData(1);
  });

  // Fonction pour récupérer les données depuis Supabase
  async function loadVideoData(videoId = 1) {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      
      const data = await response.json();
      
      if (data && data.length > 0) {
        const video = data[0];
        
        // Charger la vidéo
        videoElement = document.querySelector('#video');
        videoElement.src = video.video_url;
        videoElement.load();
        
        // Mettre à jour les textes
        document.querySelector('#username-text').setAttribute('value', `@${video.user_id}`);
        
        const date = new Date(video.created_at);
        const formattedDate = date.toLocaleString('fr-FR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        document.querySelector('#date-text').setAttribute('value', formattedDate);
        
        document.querySelector('#views-text').setAttribute('value', `👁️ ${video.view_count}`);
        document.querySelector('#likes-text').setAttribute('value', `❤️ ${video.like_count}`);
        
        console.log('✅ Vidéo chargée:', video.title);
      }
    } catch (error) {
      console.error('❌ Erreur:', error);
    }
  }

  // Détecter quand le marker est trouvé/perdu
  const marker = document.querySelector('#marker');
  
  marker.addEventListener('markerFound', function() {
    console.log('🎯 Marker détecté!');
    if (videoElement && isStarted) {
      videoElement.play().catch(e => console.log('Autoplay bloqué:', e));
    }
  });

  marker.addEventListener('markerLost', function() {
    console.log('❌ Marker perdu');
    if (videoElement) {
      videoElement.pause();
    }
  });
</script>

</body>
</html>
