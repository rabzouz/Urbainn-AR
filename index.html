<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    canvas {
      display: block;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles bas : prev / sound / next */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">WebXR AR : tape pour placer l'écran vidéo sur le sol.</div>
  <div id="video-count">0 vidéo</div>
</div>

<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<div id="video-nav">
  <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled>⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>➡️</button>
</div>

<!-- Vidéo HTML5 source pour la texture -->
<video
  id="video"
  src=""
  preload="auto"
  loop
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="display:none">
</video>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  let videoElement = null;
  let videoTexture = null;
  let soundEnabled = true;

  // Panneau 3D : group global (fond + vidéo + bandeau infos + logo + colonne sociale)
  let boardGroup = null;
  let groundPlane = null;
  let frameMatGlobal = null; // pour les effets animés sur le cadre
  let videoPlane = null;
  let infoPlane = null;
  let infoTexture = null;
  let infoCanvas = null;
  let infoCtx = null;

  // Colonne sociale (likes / vues façon TikTok)
  let socialPlane = null;
  let socialTexture = null;
  let socialCanvas = null;
  let socialCtx = null;

  // Liste des vidéos et métadonnées
  let videos = [];          // URLs
  let currentIndex = 0;

  let usernames = [];
  let dates = [];
  let likesList = [];
  let viewsList = [];

  function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lumière d'ambiance pour les matériaux Standard
    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    // Réticule
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Bouton WebXR : centré et plus haut que la barre du bas
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    });
    arButton.style.position = 'fixed';
    arButton.style.left = '50%';
    arButton.style.transform = 'translateX(-50%)';
    arButton.style.bottom = '110px';
    arButton.style.zIndex = '11';
    document.body.appendChild(arButton);

    // Session AR
    renderer.xr.addEventListener('sessionstart', async () => {
      const session = renderer.xr.getSession();
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      hitTestSourceRequested = true;

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      session.addEventListener('select', onSelect);
    });

    window.addEventListener('resize', onWindowResize);
    renderer.setAnimationLoop(render);

    parseUrlParamsAndLoadVideos();
    setupVideoElement();
    setupInfoCanvas();

    if (videos.length > 0) {
      loadVideo(0);
      playCurrentVideo();
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function createBoardIfNeeded() {
    if (boardGroup) return;

    boardGroup = new THREE.Group();

    // Panneau arrière noir translucide, visible des deux côtés
    const backGeo = new THREE.PlaneGeometry(1.4, 2.2);
    const backMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide
    });
    const backPanel = new THREE.Mesh(backGeo, backMat);
    backPanel.position.set(0, 0, 0);
    boardGroup.add(backPanel);

    // Cadre néon 3D tout autour (4 barres BoxGeometry)
    const frameColorOuter = 0x00f5ff; // cyan
    const frameColorInner = 0x00ff80; // vert
    const frameDepth = 0.04;
    const frameThickness = 0.045;
    const frameWidth = 1.0;
    const frameHeight = 1.85;

    const frameMat = new THREE.MeshStandardMaterial({
      color: frameColorOuter,
      emissive: frameColorOuter,
      emissiveIntensity: 1.5,
      metalness: 0.2,
      roughness: 0.3
    });
    frameMatGlobal = frameMat;

    // Petite lumière néon pour accentuer l'effet
    const neonLight = new THREE.PointLight(frameColorInner, 0.8, 4, 2.0);
    neonLight.position.set(0, 0.5, 0.4);
    boardGroup.add(neonLight);

    // Barre horizontale haute
    const topBarGeo = new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth);
    const topBar = new THREE.Mesh(topBarGeo, frameMat);
    topBar.position.set(0, frameHeight / 2, frameDepth / 2);
    boardGroup.add(topBar);

    // Barre horizontale basse
    const bottomBarGeo = new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth);
    const bottomBar = new THREE.Mesh(bottomBarGeo, frameMat);
    bottomBar.position.set(0, -frameHeight / 2, frameDepth / 2);
    boardGroup.add(bottomBar);

    // Barre verticale gauche
    const leftBarGeo = new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth);
    const leftBar = new THREE.Mesh(leftBarGeo, frameMat);
    leftBar.position.set(-frameWidth / 2, 0, frameDepth / 2);
    boardGroup.add(leftBar);

    // Barre verticale droite
    const rightBarGeo = new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth);
    const rightBar = new THREE.Mesh(rightBarGeo, frameMat);
    rightBar.position.set(frameWidth / 2, 0, frameDepth / 2);
    boardGroup.add(rightBar);

    // Sol / ombre sous le panneau (disque sombre horizontal, fake shadow)
    const groundGeo = new THREE.CircleGeometry(1.2, 48);
    const groundMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.35
    });
    groundPlane = new THREE.Mesh(groundGeo, groundMat);
    groundPlane.rotation.x = -Math.PI / 2; // horizontal
    groundPlane.position.set(0, -frameHeight / 2 - 0.05, 0);
    boardGroup.add(groundPlane);

    // Plane vidéo portrait 9:16 (au centre du cadre)
    const videoGeo = new THREE.PlaneGeometry(0.9, 1.6);
    const videoMat = new THREE.MeshBasicMaterial({
      map: videoTexture,
      side: THREE.DoubleSide
    });
    videoPlane = new THREE.Mesh(videoGeo, videoMat);
    videoPlane.position.set(0, -0.1, 0.02);
    boardGroup.add(videoPlane);

    // Bandeau infos AU-DESSUS de la vidéo
    const infoGeo = new THREE.PlaneGeometry(0.9, 0.4);
    infoTexture = new THREE.CanvasTexture(infoCanvas);
    const infoMat = new THREE.MeshBasicMaterial({
      map: infoTexture,
      transparent: true,
      side: THREE.DoubleSide
    });
    infoPlane = new THREE.Mesh(infoGeo, infoMat);
    infoPlane.position.set(0, 1.15, 0.04);
    boardGroup.add(infoPlane);

    // Colonne sociale TikTok à droite de la vidéo
    const socialGeo = new THREE.PlaneGeometry(0.28, 0.9);
    socialTexture = new THREE.CanvasTexture(socialCanvas);
    const socialMat = new THREE.MeshBasicMaterial({
      map: socialTexture,
      transparent: true,
      side: THREE.DoubleSide
    });
    socialPlane = new THREE.Mesh(socialGeo, socialMat);
    socialPlane.position.set(0.9 / 2 + 0.18, -0.1, 0.04);
    boardGroup.add(socialPlane);

    // Logo UrbainAR à droite du bandeau nom/date
    const logoWidth = 0.35;
    const logoHeight = 0.35;
    const logoGeo = new THREE.PlaneGeometry(logoWidth, logoHeight);

    const logoUrl = 'https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/logoUrbainar.png';
    const logoTexture = new THREE.TextureLoader().load(logoUrl);

    const logoMat = new THREE.MeshBasicMaterial({
      map: logoTexture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const logoPlane = new THREE.Mesh(logoGeo, logoMat);
    logoPlane.position.set(
      0.9 / 2 + logoWidth / 2 + 0.08, // à droite du bandeau (largeur infoPlane = 0.9)
      1.15,                           // même hauteur Y que infoPlane
      0.06                            // légèrement devant le panneau
    );
    boardGroup.add(logoPlane);

    scene.add(boardGroup);
  }

  function onSelect() {
    if (!reticle.visible || !videoTexture) return;

    createBoardIfNeeded();

    // Positionner le panneau 3D sur la pose détectée
    boardGroup.position.setFromMatrixPosition(reticle.matrix);

    // Orientation : panneau vertical, pivot Y uniquement
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);

    const objPos = new THREE.Vector3();
    boardGroup.getWorldPosition(objPos);

    const dir = new THREE.Vector3().subVectors(camPos, objPos);
    const angleY = Math.atan2(dir.x, dir.z);

    boardGroup.rotation.set(0, angleY, 0);
  }

  // ------- Gestion des vidéos + métadonnées -------

  function parseUrlParamsAndLoadVideos() {
    const params = new URLSearchParams(window.location.search);

    // 1) Mode multi : ?videos=url1,url2,url3
    const videosParam = params.get('videos');

    if (videosParam) {
      videos = videosParam.split(',').map(v => v.trim()).filter(v => v.length > 0);
    } else {
      // 2) Compat ancien : ?video=...
      const videoUrl = params.get('video');
      if (videoUrl) {
        videos = [videoUrl];
      }
    }

    // Métadonnées parallèles (même nombre que videos) - optionnel
    usernames = parseListParam(params.get('usernames'), videos.length, 'UrbainAR');
    dates = parseListParam(params.get('dates'), videos.length, 'Date 12/2025');
    likesList = parseNumberListParam(params.get('likes'), videos.length, 124);
    viewsList = parseNumberListParam(params.get('views'), videos.length, 654);

    document.getElementById('video-count').textContent =
      videos.length > 0
        ? `Vidéo 1/${videos.length}`
        : 'Aucune vidéo';

    updateNavButtonsState();
  }

  function parseListParam(param, targetLength, defaultValue) {
    if (!param) return new Array(targetLength).fill(defaultValue);
    const arr = param.split(',').map(v => v.trim());
    while (arr.length < targetLength) arr.push(defaultValue);
    return arr.slice(0, targetLength);
  }

  function parseNumberListParam(param, targetLength, defaultValue) {
    if (!param) return new Array(targetLength).fill(defaultValue);
    const arr = param.split(',').map(v => parseInt(v.trim(), 10) || defaultValue);
    while (arr.length < targetLength) arr.push(defaultValue);
    return arr.slice(0, targetLength);
  }

  function setupVideoElement() {
    videoElement = document.getElementById('video');
    if (!videoElement) return;

    videoElement.addEventListener('ended', () => {
      videoElement.currentTime = 0;
      videoElement.play().catch(() => {});
    });

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.encoding = THREE.sRGBEncoding;
  }

  function setupInfoCanvas() {
    // Bandeau infos (username + date)
    infoCanvas = document.createElement('canvas');
    infoCanvas.width = 512;
    infoCanvas.height = 256;
    infoCtx = infoCanvas.getContext('2d');
    drawInfoText(0);

    // Colonne sociale (TikTok-style à droite)
    socialCanvas = document.createElement('canvas');
    socialCanvas.width = 256;
    socialCanvas.height = 512;
    socialCtx = socialCanvas.getContext('2d');
    drawSocialColumn(0);
  }

  function drawInfoText(index) {
    if (!infoCtx) return;

    const username = usernames[index] || 'UrbainAR';
    const date = dates[index] || 'Date 12/2025';

    infoCtx.clearRect(0, 0, infoCanvas.width, infoCanvas.height);

    // Fond arrondi sombre
    infoCtx.fillStyle = 'rgba(0,0,0,0.75)';
    const r = 28;
    const w = infoCanvas.width - 40;
    const h = infoCanvas.height - 40;
    const x = 20;
    const y = 20;
    infoCtx.beginPath();
    infoCtx.moveTo(x + r, y);
    infoCtx.lineTo(x + w - r, y);
    infoCtx.quadraticCurveTo(x + w, y, x + w, y + r);
    infoCtx.lineTo(x + w, y + h - r);
    infoCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    infoCtx.lineTo(x + r, y + h);
    infoCtx.quadraticCurveTo(x, y + h, x, y + h - r);
    infoCtx.lineTo(x, y + r);
    infoCtx.quadraticCurveTo(x, y, x + r, y);
    infoCtx.closePath();
    infoCtx.fill();

    infoCtx.fillStyle = '#ffffff';
    infoCtx.font = 'bold 32px system-ui';
    infoCtx.textBaseline = 'top';
    infoCtx.fillText(username, 40, 40);

    infoCtx.font = '24px system-ui';
    infoCtx.fillStyle = '#cccccc';
    infoCtx.fillText(date, 40, 86);

    if (infoTexture) {
      infoTexture.needsUpdate = true;
    }
  }

  function drawSocialColumn(index) {
    if (!socialCtx) return;

    const likes = likesList[index] ?? 0;
    const views = viewsList[index] ?? 0;

    const w = socialCanvas.width;
    const h = socialCanvas.height;

    socialCtx.clearRect(0, 0, w, h);

    // Fond vertical arrondi
    socialCtx.fillStyle = 'rgba(0,0,0,0.75)';
    const r = 40;
    const padX = 40;
    const padY = 40;
    const boxW = w - padX * 2;
    const boxH = h - padY * 2;

    socialCtx.beginPath();
    socialCtx.moveTo(padX + r, padY);
    socialCtx.lineTo(padX + boxW - r, padY);
    socialCtx.quadraticCurveTo(padX + boxW, padY, padX + boxW, padY + r);
    socialCtx.lineTo(padX + boxW, padY + boxH - r);
    socialCtx.quadraticCurveTo(padX + boxW, padY + boxH, padX + boxW - r, padY + boxH);
    socialCtx.lineTo(padX + r, padY + boxH);
    socialCtx.quadraticCurveTo(padX, padY + boxH, padX, padY + boxH - r);
    socialCtx.lineTo(padX, padY + r);
    socialCtx.quadraticCurveTo(padX, padY, padX + r, padY);
    socialCtx.closePath();
    socialCtx.fill();

    socialCtx.textAlign = 'center';
    socialCtx.textBaseline = 'middle';

    // Bloc LIKE (haut)
    const centerX = w / 2;
    let centerY = padY + boxH * 0.30;

    socialCtx.font = '40px system-ui';
    socialCtx.fillStyle = '#ffffff';
    socialCtx.fillText('❤️', centerX, centerY - 30);

    socialCtx.font = '28px system-ui';
    socialCtx.fillText(`${likes}`, centerX, centerY + 18);

    // Bloc VUES (bas)
    centerY = padY + boxH * 0.68;

    socialCtx.font = '40px system-ui';
    socialCtx.fillText('👁', centerX, centerY - 30);

    socialCtx.font = '28px system-ui';
    socialCtx.fillText(`${views}`, centerX, centerY + 18);

    if (socialTexture) {
      socialTexture.needsUpdate = true;
    }
  }

  function loadVideo(index) {
    if (!videos || videos.length === 0) return;
    if (index < 0 || index >= videos.length) return;

    currentIndex = index;

    if (!videoElement) {
      videoElement = document.getElementById('video');
    }

    const url = videos[index];
    videoElement.src = url;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent =
      videos.length > 1
        ? 'Flèches pour changer de vidéo à ce spot.'
        : 'Vidéo depuis UrbainAR (une seule vidéo).';

    document.getElementById('video-count').textContent =
      `Vidéo ${index + 1}/${videos.length}`;

    drawInfoText(index);
    drawSocialColumn(index);
    updateNavButtonsState();

    console.log('▶️ Vidéo chargée index', index, url);
  }

  function updateNavButtonsState() {
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    if (!btnPrev || !btnNext) return;

    if (videos.length <= 1) {
      btnPrev.disabled = true;
      btnNext.disabled = true;
    } else {
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === videos.length - 1;
    }
  }

  function playCurrentVideo() {
    if (!videoElement) return;
    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  // Navigation
  window.nextVideo = function () {
    if (currentIndex < videos.length - 1) {
      loadVideo(currentIndex + 1);
      playCurrentVideo();
    }
  };

  window.prevVideo = function () {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
      playCurrentVideo();
    }
  };

  // Toggle son
  window.toggleSound = function () {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  };

  // Fermer
  window.closeAr = function () {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  };

  // Fallback : premier tap écran → autoriser play() sur Android
  window.addEventListener('click', () => {
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  // Boucle de rendu WebXR + animations néon / ombre
  function render(timestamp, frame) {
    const session = renderer.xr.getSession();
    if (session && hitTestSourceRequested && hitTestSource && frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    // Effets animés (néon + ombre)
    const t = timestamp * 0.001;

    if (frameMatGlobal) {
      frameMatGlobal.emissiveIntensity = 1.5 + Math.sin(t * 2.0) * 0.4;
    }

    if (groundPlane) {
      const baseOpacity = 0.30;
      const extra = Math.abs(Math.sin(t * 1.5)) * 0.15;
      groundPlane.material.opacity = baseOpacity + extra;

      const scale = 1.0 + Math.sin(t * 1.2) * 0.05;
      groundPlane.scale.set(scale, scale, 1);
    }

    renderer.render(scene, camera);
  }

  // Démarrage
  if (!('xr' in navigator)) {
    document.getElementById('video-meta').textContent =
      "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
    console.error("navigator.xr non disponible");
  } else {
    init();
  }
</script>

</body>
</html>
