<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UrbainAR - Simple</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;' vr-mode-ui="enabled: false">
  
  <a-assets>
    <video 
      id="video" 
      crossorigin="anonymous"
      preload="auto" 
      loop 
      playsinline 
      webkit-playsinline>
    </video>
  </a-assets>

  <a-marker preset='hiro' id="marker" emitevents="true">
    
    <!-- Juste la vidéo, simple -->
    <a-video 
      src="#video" 
      width="2" 
      height="1.5" 
      position="0 0.5 0"
      rotation="-90 0 0">
    </a-video>
    
    <!-- Infos en dessous -->
    <a-plane 
      position="0 -0.3 0" 
      width="2.2" 
      height="0.4" 
      color="#000000"
      material="opacity: 0.7; transparent: true"
      rotation="-90 0 0">
      
      <a-text 
        id="username-text"
        value="@user" 
        position="-1 0.15 0.01" 
        width="3"
        color="#ffffff"
        align="left">
      </a-text>

      <a-text 
        id="info-text"
        value="❤️ 0 | 👁️ 0" 
        position="-1 -0.05 0.01" 
        width="3"
        color="#cccccc"
        align="left">
      </a-text>

    </a-plane>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let videoElement = null;

  // Charger la vidéo au démarrage
  window.addEventListener('load', async function() {
    
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc&limit=1`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      
      const data = await response.json();
      
      if (data && data.length > 0) {
        const video = data[0];
        
        // Charger la vidéo
        videoElement = document.querySelector('#video');
        videoElement.src = video.video_url;
        videoElement.load();
        
        // Mettre à jour les textes
        document.querySelector('#username-text').setAttribute('value', `@${video.user_id}`);
        document.querySelector('#info-text').setAttribute('value', `❤️ ${video.like_count} | 👁️ ${video.view_count}`);
        
        console.log('✅ Vidéo chargée');
      }
    } catch (error) {
      console.error('❌ Erreur:', error);
    }
    
    // Détecter le marker
    const marker = document.querySelector('#marker');
    
    marker.addEventListener('markerFound', function() {
      console.log('🎯 Marker trouvé');
      if (videoElement) {
        videoElement.play().catch(e => console.log('Play:', e));
      }
    });
    
    marker.addEventListener('markerLost', function() {
      console.log('❌ Marker perdu');
      if (videoElement) {
        videoElement.pause();
      }
    });
  });
</script>

</body>
</html>
