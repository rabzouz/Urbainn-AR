<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Contrôles navigation */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 15px;
    }
    
    #video-nav button {
      width: 60px;
      height: 60px;
      font-size: 24px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    #video-nav button:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.1);
    }
    
    #video-nav button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    /* Info vidéo */
    #video-info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
    
    #video-info h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
    }
    
    #video-info p {
      margin: 3px 0;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<!-- Info vidéo -->
<div id="video-info">
  <h3 id="video-title">Chargement...</h3>
  <p id="video-user">@utilisateur</p>
  <p id="video-count">Vidéo <span id="current">1</span>/<span id="total">0</span></p>
</div>

<!-- Navigation -->
<div id="video-nav">
  <button id="btn-prev" onclick="previousVideo()" title="Vidéo précédente">⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante">➡️</button>
</div>

<a-scene 
  embedded 
  arjs='sourceType: webcam; debugUIEnabled: false;' 
  vr-mode-ui="enabled: false">
  
  <a-assets>
    <video 
      id="video" 
      preload="auto" 
      loop 
      crossorigin="anonymous"
      playsinline 
      webkit-playsinline
      volume="1.0">
    </video>
  </a-assets>

  <a-marker preset='hiro' id="marker" emitevents="true">
    
    <!-- Vidéo simple -->
    <a-video 
      src="#video" 
      width="2" 
      height="1.5" 
      position="0 0.5 -2"
      rotation="-90 0 0">
    </a-video>
    
    <!-- Nom utilisateur au-dessus de la vidéo -->
    <a-text 
      id="username-text"
      value="@user" 
      position="0 1.5 -2" 
      rotation="-90 0 0"
      width="3"
      color="#ffffff"
      align="center">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let allVideos = [];
  let currentIndex = 0;
  let videoElement = null;
  let soundEnabled = true;

  // Charger toutes les vidéos
  async function loadAllVideos() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      
      allVideos = await response.json();
      console.log(`✅ ${allVideos.length} vidéos chargées`);
      
      document.getElementById('total').textContent = allVideos.length;
      
      if (allVideos.length > 0) {
        loadVideo(0);
      }
    } catch (error) {
      console.error('❌ Erreur:', error);
    }
  }

  // Charger une vidéo
  function loadVideo(index) {
    if (index < 0 || index >= allVideos.length) return;
    
    currentIndex = index;
    const video = allVideos[index];
    
    videoElement = document.querySelector('#video');
    videoElement.src = video.video_url;
    videoElement.muted = !soundEnabled;
    videoElement.load();
    
    // Mettre à jour l'interface
    document.getElementById('video-title').textContent = video.title || 'Vidéo UrbainAR';
    document.getElementById('video-user').textContent = `@${video.user_id}`;
    document.getElementById('current').textContent = index + 1;
    document.querySelector('#username-text').setAttribute('value', `@${video.user_id}`);
    
    // Activer/désactiver les boutons
    document.getElementById('btn-prev').disabled = index === 0;
    document.getElementById('btn-next').disabled = index === allVideos.length - 1;
    
    console.log(`▶️ Vidéo ${index + 1}/${allVideos.length}`);
  }

  // Navigation
  function nextVideo() {
    if (currentIndex < allVideos.length - 1) {
      loadVideo(currentIndex + 1);
    }
  }

  function previousVideo() {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
    }
  }

  // Toggle son
  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  }

  // Initialisation
  window.addEventListener('load', () => {
    loadAllVideos();
    
    const marker = document.querySelector('#marker');
    
    marker.addEventListener('markerFound', () => {
      console.log('🎯 Marker trouvé');
      if (videoElement) {
        videoElement.play().then(() => {
          console.log('✅ Lecture OK');
        }).catch(e => {
          console.log('⚠️ Autoplay bloqué, désactivation son');
          soundEnabled = false;
          videoElement.muted = true;
          videoElement.play();
          document.getElementById('btn-sound').textContent = '🔇';
        });
      }
    });
    
    marker.addEventListener('markerLost', () => {
      console.log('❌ Marker perdu');
      if (videoElement) {
        videoElement.pause();
      }
    });
  });
</script>

</body>
</html>
