<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR Debug</title>
    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }
      #info {
        position: fixed; z-index: 10; top: 10px; left: 10px; right: 10px;
        padding: 12px; background: rgba(0, 0, 0, 0.9); color: white;
        font-size: 11px; font-family: monospace; max-height: 50%;
        overflow-y: auto; white-space: pre-wrap;
      }
      #soundBtn {
        position: fixed; z-index: 10; bottom: 20px; left: 50%;
        transform: translateX(-50%); padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8); color: white;
        border: none; border-radius: 8px; font-size: 16px;
        font-weight: bold; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="info">Chargement...</div>
    <button id="soundBtn">🔊 Activer son</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-assets id="assets"></a-assets>
      <a-marker preset="hiro" id="marker" smooth="true">
        <a-entity id="container" position="0 0.5 0"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const info = document.getElementById('info');
      const soundBtn = document.getElementById('soundBtn');
      const container = document.getElementById('container');
      const assets = document.getElementById('assets');

      let log = '';
      function addLog(msg) {
        log += msg + '\n';
        info.textContent = log;
        console.log(msg);
      }

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function load() {
        try {
          addLog('Connexion Supabase...');
          
          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(1);

          if (error) {
            addLog('ERREUR Supabase: ' + error.message);
            throw error;
          }

          if (!data || data.length === 0) {
            addLog('Aucune vidéo dans la table');
            return;
          }

          const video = data[0];
          addLog('Vidéo trouvée:');
          addLog('  ID: ' + video.id);
          addLog('  Title: ' + video.title);
          addLog('  URL: ' + video.video_url);
          addLog('  User: ' + video.user_id);

          const videoEl = document.createElement('video');
          videoEl.id = 'vid';
          videoEl.src = video.video_url;
          videoEl.loop = true;
          videoEl.muted = true;
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('webkit-playsinline', '');
          videoEl.setAttribute('crossorigin', 'anonymous');

          videoEl.addEventListener('loadstart', () => addLog('Chargement vidéo...'));
          videoEl.addEventListener('loadedmetadata', () => {
            addLog('Métadonnées chargées');
            addLog('  Durée: ' + videoEl.duration + 's');
            addLog('  Dimensions: ' + videoEl.videoWidth + 'x' + videoEl.videoHeight);
          });
          videoEl.addEventListener('canplay', () => {
            addLog('✅ Vidéo prête à jouer');
            videoEl.play().then(() => {
              addLog('✅ Lecture démarrée');
            }).catch(e => {
              addLog('❌ Erreur play: ' + e.message);
            });
          });
          videoEl.addEventListener('error', (e) => {
            addLog('❌ ERREUR VIDÉO:');
            addLog('  Code: ' + videoEl.error.code);
            addLog('  Message: ' + videoEl.error.message);
          });

          assets.appendChild(videoEl);

          const plane = document.createElement('a-plane');
          plane.setAttribute('width', '0.9');
          plane.setAttribute('height', '1.6');
          plane.setAttribute('material', 'shader: flat; src: #vid');
          plane.setAttribute('rotation', '-90 0 0');
          plane.setAttribute('position', '0 0 0');

          container.appendChild(plane);

          soundBtn.addEventListener('click', () => {
            videoEl.muted = false;
            videoEl.play();
            soundBtn.style.display = 'none';
            addLog('Son activé');
          });

        } catch (e) {
          addLog('❌ Exception: ' + e.message);
        }
      }

      document.querySelector('a-scene').addEventListener('loaded', load);
    </script>
  </body>
</html>
