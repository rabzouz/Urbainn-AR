<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UrbainAR - Test Debug</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }
      
      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
      }

      #playBtn {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>

  <body style='margin: 0; overflow: hidden;'>
    <div id="info">Test vidéo simple. Vise Hiro.</div>
    <button id="playBtn">🔊 Activer le son</button>

    <a-scene embedded arjs>
      <a-assets>
        <video
          id="vid"
          src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_f27db215-1cb8-40d2-aa8a-4418eb3214c4.mp4"
          loop
          autoplay
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-marker preset="hiro">
        <a-video
          src="#vid"
          position="0 0 0"
          rotation="-90 0 0"
          width="0.9"
          height="1.6"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      console.log('Script chargé');
      const vid = document.getElementById('vid');
      const btn = document.getElementById('playBtn');
      const info = document.getElementById('info');

      vid.addEventListener('canplay', function() {
        console.log('Vidéo prête');
        vid.play();
        info.textContent = 'Vidéo prête. Vise Hiro.';
      });

      vid.addEventListener('error', function(e) {
        console.error('Erreur vidéo:', e);
        info.textContent = 'Erreur chargement vidéo !';
      });

      btn.addEventListener('click', function() {
        console.log('Activation son');
        vid.muted = false;
        vid.play();
        btn.style.display = 'none';
        info.textContent = 'Son activé !';
      });
    </script>
  </body>
</html>
