<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <style>
    :root{
      --bg: #000;
      --text: #fff;
      --muted: rgba(255,255,255,.78);
      --glass: rgba(0,0,0,.6);
      --stroke: rgba(255,255,255,.22);
      --accent: #6ee7ff;
      --accent-2:#60a5fa;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    canvas { display: block; }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 12px;
      right: 68px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
    }
    #video-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    #video-meta, #video-count { font-size: 12px; opacity: 0.9; }

    /* Bouton Fermer */
    #top-right { position: fixed; top: calc(10px + var(--safe-top)); right: 10px; z-index: 12; }
    #btn-close {
      width: 42px; height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: radial-gradient(circle at top, rgba(0,0,0,0.92), rgba(0,0,0,0.65));
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.55);
    }
    #btn-close:active { transform: scale(0.98); }

    /* Contrôles bas : prev / sound / next */
    #video-nav {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex; gap: 18px; align-items: center;
    }
    #video-nav button {
      width: 56px; height: 56px; font-size: 22px;
      background: rgba(0,0,0,0.72); color: #fff;
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
    }
    #video-nav button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Mini‑map circulaire + label rue */
    #mini-map-wrapper {
      position: fixed;
      bottom: calc(190px + var(--safe-bottom)); /* au-dessus du bouton ARButton three.js */
      left: 50%; transform: translateX(-50%);
      width: 92px; height: 92px; border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 6px 18px rgba(0,0,0,0.65);
      z-index: 11; background: #000;
    }
    #mini-map { width: 100%; height: 100%; }

    #street-label {
      position: fixed;
      bottom: calc(310px + var(--safe-bottom));
      right: 18px;
      background: rgba(0,0,0,0.75);
      color: #fff; padding: 6px 10px;
      border-radius: 10px; font-size: 12px; max-width: 60vw;
      z-index: 6; border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
    }

    /* Bottom sheet + scrim */
    .scrim{
      position: fixed; inset: 0; z-index: 14;
      background: rgba(0,0,0,.42); opacity: 0; pointer-events: none;
      transition: opacity 220ms ease;
    }
    .scrim.on{ opacity: 1; pointer-events: auto; }

    .sheet{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
      height: min(76vh, 620px);
      transform: translateY(calc(100% - 96px)); /* peek */
      transition: transform 220ms ease;
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      background: rgba(12, 16, 22, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 -18px 44px rgba(0,0,0,.5);
      overflow: hidden;
      touch-action: none;
    }
    .sheet.expanded{ transform: translateY(0); }

    .sheetHeader{ padding: 10px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .grabber{
      width: 46px; height: 5px; border-radius: 999px;
      background: rgba(255,255,255,.22); margin: 6px auto 10px;
    }
    .sheetTopRow{ display:flex; align-items:center; justify-content: space-between; gap: 12px; }
    .title{ display:flex; flex-direction: column; gap: 2px; min-width: 0; }
    .title h3{ margin:0; font-size: 15px; font-weight: 800; letter-spacing: .2px; }
    .title p{ margin:0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chipRow{ display:flex; gap:10px; padding: 12px 16px; overflow-x:auto; -webkit-overflow-scrolling: touch; }
    .chip{
      white-space: nowrap; padding: 10px 12px; border-radius: 999px;
      border: 1px solid var(--stroke); background: rgba(255,255,255,.06);
      color: var(--text); font-size: 13px; cursor:pointer; user-select:none;
    }
    .chip.active{ border-color: rgba(110,231,255,.55); background: rgba(110,231,255,.14); }

    .sheetContent{
      height: calc(100% - 132px);
      overflow: auto; padding: 8px 16px calc(24px + var(--safe-bottom));
    }
    .listItem{
      display:flex; gap: 12px; align-items:center;
      padding: 12px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.14); cursor:pointer; margin-bottom: 10px;
    }
    .thumb{
      width: 54px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(110,231,255,.28), rgba(96,165,250,.18));
      border: 1px solid rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .meta{ min-width:0; }
    .meta b{ display:block; font-size: 13px; margin-bottom: 2px; }
    .meta span{ display:block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ARButton (three.js) sera positionné au-dessus du sheet peek */
    .ar-fab-offset { bottom: calc(110px + var(--safe-bottom)) !important; }

    @media (max-width: 380px){
      #video-info{ right: 60px; }
    }
  </style>

  <!-- Google Maps JavaScript API + géoloc mini-map -->
  <script>
    // Variables globales Maps + géoloc
    let miniMap = null;
    let miniUserMarker = null;
    let miniVideoMarkers = [];
    let geocoder = null;
    let lastStreetText = '';

    function initMiniMap() {
      const el = document.getElementById('mini-map');
      if (!el || !window.google || !google.maps) return;

      miniMap = new google.maps.Map(el, {
        center: { lat: 48.8566, lng: 2.3522 },
        zoom: 16,
        disableDefaultUI: true
      });
      geocoder = new google.maps.Geocoder();
    }
    window.initMiniMap = initMiniMap;

    function updateMiniMapUserPosition(lat, lng) {
      if (!miniMap || !window.google || !google.maps) return;
      const pos = { lat, lng };
      if (!miniUserMarker) {
        miniUserMarker = new google.maps.Marker({
          position: pos, map: miniMap,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: '#00aaff', fillOpacity: 1, strokeWeight: 0 }
        });
      } else {
        miniUserMarker.setPosition(pos);
      }
      miniMap.setCenter(pos);
    }

    function updateStreetName(lat, lng) {
      if (!window.google || !google.maps || !geocoder || !geocoder.geocode) return;
      geocoder.geocode({ location: { lat, lng } }, (results, status) => {
        if (status !== 'OK' || !results || !results[0]) return;
        const address = results[0].formatted_address;
        if (address === lastStreetText) return;
        lastStreetText = address;
        const lbl = document.getElementById('street-label');
        if (lbl) lbl.textContent = address;
      });
    }

    function showNearbyVideoMarkers(nearbyVideos) {
      if (!miniMap || !window.google || !google.maps) return;
      miniVideoMarkers.forEach(m => m.setMap(null));
      miniVideoMarkers = [];
      nearbyVideos.forEach(v => {
        const marker = new google.maps.Marker({
          position: { lat: v.lat, lng: v.lng }, map: miniMap, title: v.title || 'Vidéo UrbainAR'
        });
        marker.addListener('click', () => {
          if (window.loadVideo && window.playCurrentVideo) {
            const idx = window.videos ? window.videos.indexOf(v.url) : -1;
            if (idx >= 0) { window.loadVideo(idx); window.playCurrentVideo(); }
          }
        });
        miniVideoMarkers.push(marker);
      });
    }

    function startGeoTracking() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          updateMiniMapUserPosition(latitude, longitude);
          updateStreetName(latitude, longitude);
        },
        (err) => { console.warn('Geo error', err); },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }
    window.startGeoTracking = startGeoTracking;
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDGe5utx89UUDQllkr3nC5ex_wk4RT-aPo&callback=initMiniMap&loading=async" async defer></script>
</head>
<body>

  <!-- UI overlay -->
  <div id="video-info" aria-live="polite">
    <div id="video-title">Chargement de la vidéo...</div>
    <div id="video-meta">WebXR AR : tape pour placer l'écran vidéo sur le sol.</div>
    <div id="video-count">0 vidéo</div>
  </div>

  <div id="top-right">
    <button id="btn-close" onclick="closeAr()" title="Fermer l'AR" aria-label="Fermer">✕</button>
  </div>

  <div id="video-nav" aria-label="Navigation vidéos">
    <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled aria-label="Précédente">⬅️</button>
    <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF" aria-label="Son">🔊</button>
    <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled aria-label="Suivante">➡️</button>
  </div>

  <!-- Mini-map circulaire + label rue -->
  <div id="mini-map-wrapper" aria-hidden="true">
    <div id="mini-map"></div>
  </div>
  <div id="street-label" aria-live="polite"></div>

  <!-- Vidéos HTML5 pour la texture -->
  <video id="video" src="" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none"></video>
  <video id="frameVideo" src="" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous" style="display:none"></video>

  <!-- Bottom sheet moderne -->
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-label="Vidéos proches">
    <div class="sheetHeader" id="sheetHeader">
      <div class="grabber"></div>
      <div class="sheetTopRow">
        <div class="title">
          <h3>Vidéos à proximité</h3>
          <p id="subtitle">Prévisualise puis place en AR.</p>
        </div>
        <button id="btnSheetToggle" class="chip" style="padding:8px 10px">⌄</button>
      </div>
    </div>

    <div class="chipRow">
      <div class="chip active" data-tab="near">Proches</div>
      <div class="chip" data-tab="popular">Populaires</div>
      <div class="chip" data-tab="saved">Enregistrées</div>
    </div>

    <div class="sheetContent" id="sheetContent">
      <!-- Exemple de contenu (remplace par tes données) -->
      <div class="listItem" data-video="vid_1">
        <div class="thumb"></div>
        <div class="meta">
          <b>Street AR – 120 m</b>
          <span>12 vues • 3 likes • Sol contrasté conseillé</span>
        </div>
      </div>
      <div class="listItem" data-video="vid_2">
        <div class="thumb"></div>
        <div class="meta">
          <b>Mur Urbain – 310 m</b>
          <span>28 vues • 9 likes • Bon éclairage</span>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let videoElement = null;
    let videoTexture = null;
    let soundEnabled = true;

    let frameVideoElement = null;
    let frameVideoTexture = null;
    let framePlane = null;

    let boardGroup = null;
    let groundPlane = null;
    let frameMatGlobal = null;
    let videoPlane = null;
    let infoPlane = null;
    let infoTexture = null;
    let infoCanvas = null;
    let infoCtx = null;

    let socialPlane = null;
    let socialTexture = null;
    let socialCanvas = null;
    let socialCtx = null;

    // Données vidéos
    window.videos = [];
    let currentIndex = 0;
    let usernames = [];
    let dates = [];
    let likesList = [];
    let viewsList = [];

    // Sheet UI
    const sheet = document.getElementById('sheet');
    const scrim = document.getElementById('scrim');
    const sheetHeader = document.getElementById('sheetHeader');
    const btnSheetToggle = document.getElementById('btnSheetToggle');

    const setExpanded = (expanded) => {
      sheet.classList.toggle('expanded', expanded);
      scrim.classList.toggle('on', expanded);
      btnSheetToggle.textContent = expanded ? '✕' : '⌄';
    };
    sheetHeader.addEventListener('click', (e) => {
      if (e.target === btnSheetToggle) return;
      setExpanded(!sheet.classList.contains('expanded'));
    });
    btnSheetToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      setExpanded(!sheet.classList.contains('expanded'));
    });
    scrim.addEventListener('click', () => setExpanded(false));
    // Swipe
    let startY = 0;
    sheet.addEventListener('pointerdown', (e) => {
      startY = e.clientY;
      sheet.setPointerCapture(e.pointerId);
    });
    sheet.addEventListener('pointerup', (e) => {
      const dy = e.clientY - startY;
      if (dy < -30) setExpanded(true);
      if (dy > 30) setExpanded(false);
    });

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // ARButton avec domOverlay pour une UI DOM fiable au-dessus de la scène (si supporté)
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
        domOverlay: { root: document.body }
      });
      arButton.style.position = 'fixed';
      arButton.style.left = '50%';
      arButton.style.transform = 'translateX(-50%)';
      arButton.style.bottom = '110px';
      arButton.style.zIndex = '13';
      arButton.classList.add('ar-fab-offset');
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', async () => {
        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        hitTestSourceRequested = true;

        session.addEventListener('end', () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
        });

        session.addEventListener('select', onSelect);
      });

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);

      parseUrlParamsAndLoadVideos();
      setupVideoElement();
      setupFrameVideoElement();
      setupInfoCanvas();

      if (window.videos.length > 0) {
        loadVideo(0);
        playCurrentVideo();
      }

      if (window.startGeoTracking) window.startGeoTracking();

      // Liste item -> sélection vidéo
      document.querySelectorAll('.listItem').forEach((el) => {
        el.addEventListener('click', () => {
          document.getElementById('subtitle').textContent =
            el.querySelector('b').textContent + ' • Appuie sur AR puis place au sol.';
          setExpanded(false);
        });
      });
      // Chips
      document.querySelectorAll('.chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createBoardIfNeeded() {
      if (boardGroup) return;
      boardGroup = new THREE.Group();

      const frameGeo = new THREE.PlaneGeometry(1.4, 2.2);
      const frameMat = new THREE.MeshBasicMaterial({ map: frameVideoTexture, side: THREE.DoubleSide });
      framePlane = new THREE.Mesh(frameGeo, frameMat);
      boardGroup.add(framePlane);

      const frameColorOuter = 0x00f5ff, frameColorInner = 0x00ff80, frameDepth = 0.04, frameThickness = 0.045;
      const frameWidth = 1.0, frameHeight = 1.85;

      const frameMatNeon = new THREE.MeshStandardMaterial({
        color: frameColorOuter, emissive: frameColorOuter, emissiveIntensity: 1.5, metalness: 0.2, roughness: 0.3
      });
      frameMatGlobal = frameMatNeon;

      const neonLight = new THREE.PointLight(frameColorInner, 0.8, 4, 2.0);
      neonLight.position.set(0, 0.5, 0.4);
      boardGroup.add(neonLight);

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      topBar.position.set(0, frameHeight / 2, frameDepth / 2);
      const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      bottomBar.position.set(0, -frameHeight / 2, frameDepth / 2);
      const leftBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      leftBar.position.set(-frameWidth / 2, 0, frameDepth / 2);
      const rightBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      rightBar.position.set(frameWidth / 2, 0, frameDepth / 2);
      boardGroup.add(topBar, bottomBar, leftBar, rightBar);

      const groundGeo = new THREE.CircleGeometry(1.2, 48);
      const groundMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
      groundPlane = new THREE.Mesh(groundGeo, groundMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.set(0, -frameHeight / 2 - 0.05, 0);
      boardGroup.add(groundPlane);

      const videoGeo = new THREE.PlaneGeometry(0.9, 1.6);
      const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
      videoPlane = new THREE.Mesh(videoGeo, videoMat);
      videoPlane.position.set(0, -0.1, 0.02);
      boardGroup.add(videoPlane);

      infoCanvas = document.createElement('canvas');
      infoCanvas.width = 512; infoCanvas.height = 256;
      infoCtx = infoCanvas.getContext('2d');
      drawInfoText(0);
      infoTexture = new THREE.CanvasTexture(infoCanvas);
      const infoMat = new THREE.MeshBasicMaterial({ map: infoTexture, transparent: true, side: THREE.DoubleSide });
      infoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.4), infoMat);
      infoPlane.position.set(0, 1.15, 0.04);
      boardGroup.add(infoPlane);

      socialCanvas = document.createElement('canvas');
      socialCanvas.width = 256; socialCanvas.height = 512;
      socialCtx = socialCanvas.getContext('2d');
      drawSocialColumn(0);
      socialTexture = new THREE.CanvasTexture(socialCanvas);
      const socialMat = new THREE.MeshBasicMaterial({ map: socialTexture, transparent: true, side: THREE.DoubleSide });
      socialPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.9), socialMat);
      socialPlane.position.set(0.9 / 2 + 0.18, -0.1, 0.04);
      boardGroup.add(socialPlane);

      const logoWidth = 0.35, logoHeight = 0.35;
      const logoTexture = new THREE.TextureLoader().load('https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/logoUrbainar.png');
      const logoMat = new THREE.MeshBasicMaterial({ map: logoTexture, transparent: true, side: THREE.DoubleSide });
      const logoPlane = new THREE.Mesh(new THREE.PlaneGeometry(logoWidth, logoHeight), logoMat);
      logoPlane.position.set(0.9 / 2 + logoWidth / 2 + 0.08, 1.15, 0.06);
      boardGroup.add(logoPlane);

      scene.add(boardGroup);
    }

    function onSelect() {
      if (!reticle.visible || !videoTexture) return;
      createBoardIfNeeded();

      boardGroup.position.setFromMatrixPosition(reticle.matrix);

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      const objPos = new THREE.Vector3();
      boardGroup.getWorldPosition(objPos);
      const dir = new THREE.Vector3().subVectors(camPos, objPos);
      const angleY = Math.atan2(dir.x, dir.z);
      boardGroup.rotation.set(0, angleY, 0);
    }

    function parseUrlParamsAndLoadVideos() {
      const params = new URLSearchParams(window.location.search);
      const videosParam = params.get('videos');
      if (videosParam) {
        window.videos = videosParam.split(',').map(v => v.trim()).filter(v => v.length > 0);
      } else {
        const videoUrl = params.get('video');
        if (videoUrl) window.videos = [videoUrl];
      }

      usernames = parseListParam(params.get('usernames'), window.videos.length, 'UrbainAR');
      dates = parseListParam(params.get('dates'), window.videos.length, 'Date 12/2025');
      likesList = parseNumberListParam(params.get('likes'), window.videos.length, 124);
      viewsList = parseNumberListParam(params.get('views'), window.videos.length, 654);

      document.getElementById('video-count').textContent =
        window.videos.length > 0 ? `Vidéo 1/${window.videos.length}` : 'Aucune vidéo';

      updateNavButtonsState();
    }

    function parseListParam(param, targetLength, defVal) {
      if (!param) return new Array(targetLength).fill(defVal);
      const arr = param.split(',').map(v => v.trim());
      while (arr.length < targetLength) arr.push(defVal);
      return arr.slice(0, targetLength);
    }
    function parseNumberListParam(param, targetLength, defVal) {
      if (!param) return new Array(targetLength).fill(defVal);
      const arr = param.split(',').map(v => parseInt(v.trim(), 10) || defVal);
      while (arr.length < targetLength) arr.push(defVal);
      return arr.slice(0, targetLength);
    }

    function setupVideoElement() {
      videoElement = document.getElementById('video');
      if (!videoElement) return;
      videoElement.addEventListener('ended', () => { videoElement.currentTime = 0; videoElement.play().catch(() => {}); });
      videoTexture = new THREE.VideoTexture(videoElement);
      videoTexture.colorSpace = THREE.SRGBColorSpace;
    }

    function setupFrameVideoElement() {
      frameVideoElement = document.getElementById('frameVideo');
      if (!frameVideoElement) return;
      frameVideoElement.src = 'https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/frameUrbainar.mp4';
      frameVideoElement.muted = true; frameVideoElement.load();
      frameVideoTexture = new THREE.VideoTexture(frameVideoElement);
      frameVideoTexture.colorSpace = THREE.SRGBColorSpace;
    }

    function setupInfoCanvas() {
      // Créées dans createBoardIfNeeded pour être synchronisées avec les meshes
      // mais on dessine aussi la 1ère fois ici si nécessaire
    }

    function drawInfoText(index) {
      if (!infoCtx) return;
      const username = usernames[index] || 'UrbainAR';
      const date = dates[index] || 'Date 12/2025';
      infoCtx.clearRect(0, 0, infoCanvas.width, infoCanvas.height);
      infoCtx.fillStyle = 'rgba(0,0,0,0.75)';
      const r = 28, w = infoCanvas.width - 40, h = infoCanvas.height - 40, x = 20, y = 20;
      infoCtx.beginPath();
      infoCtx.moveTo(x + r, y);
      infoCtx.lineTo(x + w - r, y);
      infoCtx.quadraticCurveTo(x + w, y, x + w, y + r);
      infoCtx.lineTo(x + w, y + h - r);
      infoCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      infoCtx.lineTo(x + r, y + h);
      infoCtx.quadraticCurveTo(x, y + h, x, y + h - r);
      infoCtx.lineTo(x, y + r);
      infoCtx.quadraticCurveTo(x, y, x + r, y);
      infoCtx.closePath();
      infoCtx.fill();
      infoCtx.fillStyle = '#ffffff';
      infoCtx.font = 'bold 32px system-ui';
      infoCtx.textBaseline = 'top';
      infoCtx.fillText(username, 40, 40);
      infoCtx.font = '24px system-ui';
      infoCtx.fillStyle = '#cccccc';
      infoCtx.fillText(date, 40, 86);
      if (infoTexture) infoTexture.needsUpdate = true;
    }

    function drawSocialColumn(index) {
      if (!socialCtx) return;
      const likes = likesList[index] ?? 0;
      const views = viewsList[index] ?? 0;
      const w = socialCanvas.width, h = socialCanvas.height;
      socialCtx.clearRect(0, 0, w, h);
      socialCtx.fillStyle = 'rgba(0,0,0,0.75)';
      const r = 40, padX = 40, padY = 40, boxW = w - padX * 2, boxH = h - padY * 2;
      socialCtx.beginPath();
      socialCtx.moveTo(padX + r, padY);
      socialCtx.lineTo(padX + boxW - r, padY);
      socialCtx.quadraticCurveTo(padX + boxW, padY, padX + boxW, padY + r);
      socialCtx.lineTo(padX + boxW, padY + boxH - r);
      socialCtx.quadraticCurveTo(padX + boxW, padY + boxH, padX + boxW - r, padY + boxH);
      socialCtx.lineTo(padX + r, padY + boxH);
      socialCtx.quadraticCurveTo(padX, padY + boxH, padX, padY + boxH - r);
      socialCtx.lineTo(padX, padY + r);
      socialCtx.quadraticCurveTo(padX, padY, padX + r, padY);
      socialCtx.closePath();
      socialCtx.fill();
      socialCtx.textAlign = 'center';
      socialCtx.textBaseline = 'middle';
      const cx = w / 2;
      let cy = padY + boxH * 0.30;
      socialCtx.font = '40px system-ui'; socialCtx.fillStyle = '#ffffff'; socialCtx.fillText('❤️', cx, cy - 30);
      socialCtx.font = '28px system-ui'; socialCtx.fillText(`${likes}`, cx, cy + 18);
      cy = padY + boxH * 0.68;
      socialCtx.font = '40px system-ui'; socialCtx.fillText('👁', cx, cy - 30);
      socialCtx.font = '28px system-ui'; socialCtx.fillText(`${views}`, cx, cy + 18);
      if (socialTexture) socialTexture.needsUpdate = true;
    }

    function loadVideo(index) {
      if (!window.videos || window.videos.length === 0) return;
      if (index < 0 || index >= window.videos.length) return;
      currentIndex = index;
      if (!videoElement) videoElement = document.getElementById('video');
      const url = window.videos[index];
      videoElement.src = url;
      videoElement.muted = !soundEnabled;
      videoElement.load();

      document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
      document.getElementById('video-meta').textContent =
        window.videos.length > 1 ? 'Flèches pour changer de vidéo à ce spot.' : 'Vidéo depuis UrbainAR (une seule vidéo).';
      document.getElementById('video-count').textContent = `Vidéo ${index + 1}/${window.videos.length}`;

      // Si le board est déjà créé, mettre à jour les infos
      if (infoCtx) drawInfoText(index);
      if (socialCtx) drawSocialColumn(index);
      updateNavButtonsState();
    }
    window.loadVideo = loadVideo;

    function updateNavButtonsState() {
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      if (!btnPrev || !btnNext) return;
      if (window.videos.length <= 1) { btnPrev.disabled = true; btnNext.disabled = true; }
      else { btnPrev.disabled = currentIndex === 0; btnNext.disabled = currentIndex === window.videos.length - 1; }
    }

    function playCurrentVideo() {
      if (!videoElement) return;
      videoElement.play()
        .then(() => {
          if (frameVideoElement && frameVideoElement.paused) frameVideoElement.play().catch(() => {});
        })
        .catch(() => {
          soundEnabled = false;
          videoElement.muted = true;
          videoElement.play().catch(() => {});
          const btn = document.getElementById('btn-sound');
          if (btn) { btn.textContent = '🔇'; btn.title = 'Son OFF'; }
          if (frameVideoElement && frameVideoElement.paused) frameVideoElement.play().catch(() => {});
        });
    }
    window.playCurrentVideo = playCurrentVideo;

    window.nextVideo = function () { if (currentIndex < window.videos.length - 1) { loadVideo(currentIndex + 1); playCurrentVideo(); } };
    window.prevVideo = function () { if (currentIndex > 0) { loadVideo(currentIndex - 1); playCurrentVideo(); } };
    window.toggleSound = function () {
      soundEnabled = !soundEnabled;
      if (videoElement) videoElement.muted = !soundEnabled;
      const btn = document.getElementById('btn-sound');
      btn.textContent = soundEnabled ? '🔊' : '🔇';
      btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
    };
    window.closeAr = function () {
      if (history.length > 1) history.back(); else window.close();
    };

    window.addEventListener('click', () => {
      if (videoElement && videoElement.paused) videoElement.play().catch(() => {});
      if (frameVideoElement && frameVideoElement.paused) frameVideoElement.play().catch(() => {});
    }, { once: true });

    // ---- RENDER ----
    let noHitFrames = 0;
    function render(timestamp, frame) {
      const session = renderer.xr.getSession();
      if (session && hitTestSourceRequested && hitTestSource && frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          noHitFrames = 0;
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
          noHitFrames++;
          if (noHitFrames > 120) {
            const meta = document.getElementById('video-meta');
            if (meta) meta.textContent = "Déplace ton téléphone vers un sol contrasté et mieux éclairé.";
          }
        }
      }

      const t = timestamp * 0.001;
      if (frameMatGlobal) frameMatGlobal.emissiveIntensity = 1.5 + Math.sin(t * 2.0) * 0.4;
      if (groundPlane) {
        const baseOpacity = 0.30;
        const extra = Math.abs(Math.sin(t * 1.5)) * 0.15;
        groundPlane.material.opacity = baseOpacity + extra;
        const scale = 1.0 + Math.sin(t * 1.2) * 0.05;
        groundPlane.scale.set(scale, scale, 1);
      }
      renderer.render(scene, camera);
    }

    if (!('xr' in navigator)) {
      document.getElementById('video-meta').textContent = "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
      console.error("navigator.xr non disponible");
    } else {
      init();
    }
  </script>
</body>
