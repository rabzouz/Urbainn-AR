<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <style>
    :root{
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);

      --glass: rgba(0,0,0,0.62);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);

      --accent: #6ee7ff;
      --accent2: #60a5fa;

      --shadow: 0 12px 34px rgba(0,0,0,0.55);
      --radius-xl: 22px;
      --radius-lg: 16px;

      --sheet-peek: 92px;
    }

    html, body { height: 100%; }
    body{
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    canvas{ display:block; }

    /* Overlay root: on laisse passer les taps AR partout sauf sur les éléments interactifs */
    #xr-overlay{
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }
    .ui{ pointer-events: auto; }

    /* --- Top bar infos vidéo --- */
    #video-info {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 12px;
      right: 68px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      z-index: 30;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
    }
    #video-title { font-size: 15px; font-weight: 800; line-height: 1.2; }
    #video-meta { font-size: 12px; opacity: 0.88; }
    #video-count { font-size: 12px; opacity: 0.9; }

    /* --- Close --- */
    #top-right {
      position: fixed;
      top: calc(10px + var(--safe-top));
      right: 10px;
      z-index: 40;
    }
    #btn-close {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: radial-gradient(circle at top, rgba(0,0,0,0.92), rgba(0,0,0,0.65));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    #btn-close:active { transform: scale(0.98); }

    /* --- Dock contrôles (vertical à droite, ne chevauche pas Start AR) --- */
    #controls-dock{
      position: fixed;
      right: 14px;
      left: auto;

      top: 50%;
      bottom: auto;
      transform: translateY(-50%);

      z-index: 35;

      display: flex;
      flex-direction: column; /* vertical */
      align-items: center;
      gap: 10px;

      padding: 10px 10px;
      border-radius: 18px;

      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
    }

    #controls-dock button{
      width: 44px;
      height: 44px;
      border-radius: 999px;
      cursor: pointer;

      color: #fff;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.40);

      display: grid;
      place-items: center;
      font-size: 18px;
    }

    #controls-dock button:disabled{
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* mini loader dans le dock */
    #mini-loader{
      width: 14px; height: 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.28);
      border-top-color: rgba(110,231,255,0.95);
      animation: spin 700ms linear infinite;
      display: none;
      margin-left: 2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Volume: zone invisible au bord GAUCHE pour “ouvrir” le rail --- */
    #volume-edge{
      position: fixed;
      top: 0;
      left: 0;
      right: auto;
      width: 22px;
      height: 100vh;
      z-index: 60;
      pointer-events: auto;
      background: transparent;
    }

    /* rail volume à GAUCHE */
    #volume-rail{
      position: fixed;
      left: 10px;
      right: auto;
      top: 50%;
      transform: translateY(-50%);
      z-index: 61;

      width: 50px;
      height: 240px;

      border-radius: 999px;
      background: rgba(0,0,0,0.60);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: var(--shadow);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px 0;

      pointer-events: auto;
    }
    #volume-rail.open{ display:flex; }

    /* slider vertical: writing-mode vertical-lr + direction rtl */
    #volume-slider{
      writing-mode: vertical-lr;
      direction: rtl;
      height: 195px;
      width: 18px;
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent);
    }
    #volume-slider::-webkit-slider-runnable-track{
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      width: 6px;
    }
    #volume-slider::-webkit-slider-thumb{
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    #volume-slider::-moz-range-track{
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      width: 6px;
    }
    #volume-slider::-moz-range-thumb{
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
      cursor: pointer;
    }

    /* --- ARButton --- */
    #ARButton {
      position: fixed !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      bottom: calc(var(--sheet-peek) + 14px + var(--safe-bottom)) !important;

      z-index: 38 !important;
      border: 0 !important;
      padding: 14px 18px !important;
      border-radius: 999px !important;

      color: #041018 !important;
      font-weight: 900 !important;
      letter-spacing: 0.3px !important;

      background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
      box-shadow: 0 14px 34px rgba(0,0,0,0.55) !important;
      min-width: 170px !important;
      font-size: 15px !important;
    }

    /* --- Toast status --- */
    #toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(72px + var(--safe-top));
      z-index: 80;

      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.60);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: var(--muted);
      font-size: 12px;
      display: none;
      pointer-events: none;
      max-width: 86vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.on{ display:block; }

    /* --- Bottom sheet --- */
    .scrim{
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(0,0,0,.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .scrim.on{
      opacity: 1;
      pointer-events: auto;
    }

    .sheet{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      height: min(74vh, 640px);

      transform: translateY(calc(100% - var(--sheet-peek)));
      transition: transform 220ms ease;

      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      background: rgba(12, 16, 22, 0.94);
      border-top: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 -18px 46px rgba(0,0,0,0.55);
      overflow: hidden;
      touch-action: none;
    }
    .sheet.expanded{ transform: translateY(0); }

    .sheetHeader{
      padding: 10px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .grabber{
      width: 46px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      margin: 6px auto 10px;
    }
    .sheetTopRow{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sheetTitle{ min-width: 0; }
    .sheetTitle b{ display:block; font-size: 15px; font-weight: 900; }
    .sheetTitle span{
      display:block;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .sheetBtn{
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .chipRow{
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chip{
      white-space: nowrap;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .chip.active{
      border-color: rgba(110,231,255,0.55);
      background: rgba(110,231,255,0.14);
    }

    .sheetContent{
      height: calc(100% - 134px);
      overflow: auto;
      padding: 10px 16px calc(18px + var(--safe-bottom));
    }

    .emptyState{
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .listItem{
      display:flex;
      gap: 12px;
      align-items:center;
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.16);
      cursor:pointer;
      margin-bottom: 10px;
    }
    .thumb{
      width: 56px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(110,231,255,.26), rgba(96,165,250,.16));
      border: 1px solid rgba(255,255,255,0.10);
      flex: 0 0 auto;
    }
    .meta{ min-width:0; }
    .meta b{ display:block; font-size: 13px; }
    .meta span{
      display:block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div id="xr-overlay">
    <div id="video-info" class="ui">
      <div id="video-title">Chargement…</div>
      <div id="video-meta">Start AR puis touche l’écran pour placer la vidéo.</div>
      <div id="video-count">0 vidéo</div>
    </div>

    <div id="top-right" class="ui">
      <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
    </div>

    <div id="toast"></div>

    <!-- Dock à droite : ⟵ 🔊 ⟶ -->
    <div id="controls-dock" class="ui" aria-label="Contrôles">
      <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled>⟵</button>
      <button id="btn-mute" onclick="toggleMute()" title="Muet">🔊</button>
      <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>⟶</button>
      <div id="mini-loader" aria-hidden="true"></div>
    </div>

    <!-- Volume: bord gauche ouvre la barre à gauche -->
    <div id="volume-edge" class="ui" aria-label="Ouvrir le volume"></div>

    <div id="volume-rail" class="ui" aria-label="Volume">
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Contrôle du volume" />
    </div>

    <!-- Bottom sheet -->
    <div class="scrim ui" id="scrim"></div>

    <section class="sheet ui" id="sheet">
      <div class="sheetHeader" id="sheetHeader">
        <div class="grabber"></div>
        <div class="sheetTopRow">
          <div class="sheetTitle">
            <b>Vidéos à proximité</b>
            <span id="sheetSubtitle">Sélectionnez une vidéo, puis Start AR.</span>
          </div>
          <button class="sheetBtn" id="btnSheetToggle">⌄</button>
        </div>
      </div>

      <div class="chipRow">
        <div class="chip active" data-tab="near">Proches</div>
        <div class="chip" data-tab="all">Toutes</div>
        <div class="chip" data-tab="help">Aide</div>
      </div>

      <div class="sheetContent" id="sheetContent">
        <div class="emptyState" id="emptyState">
          Aucune vidéo fournie.<br><br>
          Ouvre avec : <b>?videos=url1,url2</b> ou <b>?payload=...</b>
        </div>
        <div id="videoList"></div>
      </div>
    </section>
  </div>

  <!-- Vidéos HTML5 -->
  <video id="video" src="" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none"></video>
  <video id="frameVideo" src="" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous" style="display:none"></video>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let videoElement = null;
    let videoTexture = null;

    let frameVideoElement = null;
    let frameVideoTexture = null;

    let boardGroup = null;
    let groundPlane = null;
    let frameMatGlobal = null;

    let infoTexture = null;
    let infoCanvas = null;
    let infoCtx = null;

    let socialTexture = null;
    let socialCanvas = null;
    let socialCtx = null;

    window.videos = [];
    let currentIndex = 0;

    let usernames = [];
    let timestamps = [];
    let likesList = [];
    let viewsList = [];

    let volumeSlider = null;

    const toastEl = document.getElementById('toast');
    const loaderEl = document.getElementById('mini-loader');

    function toast(msg, ms = 1600){
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('on');
      window.clearTimeout(toastEl._t);
      toastEl._t = window.setTimeout(() => toastEl.classList.remove('on'), ms);
    }

    function setLoading(isLoading){
      if (!loaderEl) return;
      loaderEl.style.display = isLoading ? 'block' : 'none';
    }

    // --- Bottom sheet logic ---
    const sheet = document.getElementById('sheet');
    const scrim = document.getElementById('scrim');
    const sheetHeader = document.getElementById('sheetHeader');
    const btnSheetToggle = document.getElementById('btnSheetToggle');

    function setExpanded(expanded){
      sheet.classList.toggle('expanded', expanded);
      scrim.classList.toggle('on', expanded);
      btnSheetToggle.textContent = expanded ? '✕' : '⌄';
    }

    sheetHeader.addEventListener('click', (e) => {
      if (e.target === btnSheetToggle) return;
      setExpanded(!sheet.classList.contains('expanded'));
    });

    btnSheetToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      setExpanded(!sheet.classList.contains('expanded'));
    });

    scrim.addEventListener('click', () => setExpanded(false));

    let startY = 0;
    sheet.addEventListener('pointerdown', (e) => {
      startY = e.clientY;
      sheet.setPointerCapture(e.pointerId);
    });
    sheet.addEventListener('pointerup', (e) => {
      const dy = e.clientY - startY;
      if (dy < -30) setExpanded(true);
      if (dy > 30) setExpanded(false);
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');

        const tab = chip.dataset.tab;
        const subtitle = document.getElementById('sheetSubtitle');

        if (tab === 'help') {
          subtitle.textContent = "Volume: glisse sur le bord gauche pour afficher la barre.";
          setExpanded(true);
        } else {
          subtitle.textContent = "Sélectionnez une vidéo, puis Start AR.";
        }
      });
    });

    function populateSheetFromVideos(){
      const list = document.getElementById('videoList');
      const empty = document.getElementById('emptyState');
      list.innerHTML = '';

      if (!window.videos || window.videos.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      window.videos.forEach((url, idx) => {
        const title = usernames[idx] ? `@${usernames[idx]}` : 'Vidéo UrbainAR';
        const dt = formatPublishedAt(idx);
        const meta = `${likesList[idx] ?? 0} likes • ${viewsList[idx] ?? 0} vues • ${dt}`.trim();

        const item = document.createElement('div');
        item.className = 'listItem';
        item.innerHTML = `
          <div class="thumb"></div>
          <div class="meta">
            <b>${escapeHtml(title)}</b>
            <span>${escapeHtml(meta)}</span>
          </div>
        `;
        item.addEventListener('click', () => {
          window.loadVideo(idx);
          window.playCurrentVideo();
          setExpanded(false);
        });
        list.appendChild(item);
      });
    }

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // --- Volume UX (edge swipe + auto close) ---
    const volumeEdge = document.getElementById('volume-edge');
    const volumeRail = document.getElementById('volume-rail');

    function openVolume(){
      volumeRail.classList.add('open');
      window.clearTimeout(openVolume._t);
      openVolume._t = window.setTimeout(() => closeVolume(), 2200);
    }
    function closeVolume(){
      volumeRail.classList.remove('open');
    }
    volumeEdge.addEventListener('pointerdown', () => openVolume());
    volumeRail.addEventListener('pointerdown', () => openVolume());

    function bindVolumeUI(){
      volumeSlider = document.getElementById('volume-slider');
      if (!volumeSlider) return;

      volumeSlider.value = 1;

      volumeSlider.addEventListener('input', async () => {
        openVolume();
        const v = parseFloat(volumeSlider.value || '1');
        if (videoElement) {
          videoElement.volume = v;
          videoElement.muted = (v <= 0.001);
        }
        const btn = document.getElementById('btn-mute');
        if (btn) btn.textContent = (v <= 0.001) ? '🔇' : '🔊';

        try { if (videoElement && videoElement.paused) await videoElement.play(); } catch (_) {}
      });
    }

    window.toggleMute = async function () {
      openVolume();
      if (!videoElement) return;

      const cur = parseFloat(volumeSlider?.value || '1');
      const next = (cur > 0.001) ? 0 : 1;

      if (volumeSlider) volumeSlider.value = String(next);
      videoElement.volume = next;
      videoElement.muted = (next <= 0.001);

      const btn = document.getElementById('btn-mute');
      if (btn) btn.textContent = (next <= 0.001) ? '🔇' : '🔊';

      try { if (videoElement && videoElement.paused) await videoElement.play(); } catch (_) {}
    };

    // --- Date/heure publication ---
    const fmt = new Intl.DateTimeFormat("fr-FR", { dateStyle: "short", timeStyle: "short" });

    function formatPublishedAt(idx){
      const ms = Number(timestamps[idx]);
      if (!Number.isNaN(ms) && ms > 0) {
        return fmt.format(new Date(ms));
      }
      return "Date inconnue";
    }

    async function tryPlayWithCurrentVolume(){
      if (!videoElement) return;

      const vol = parseFloat(volumeSlider?.value || '1');
      videoElement.volume = vol;
      videoElement.muted = (vol <= 0.001);

      try {
        await videoElement.play();
      } catch (e) {
        toast("Tape l’écran ou bouge le volume pour autoriser le son.");
      }
    }

    // ✅ base64url -> utf8 (padding + TextDecoder)
    function decodeBase64UrlToUtf8(b64url){
      const b64 = String(b64url).replace(/-/g, "+").replace(/_/g, "/");
      const pad = b64.length % 4;
      const padded = pad ? (b64 + "=".repeat(4 - pad)) : b64;

      const bin = atob(padded);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      return new TextDecoder("utf-8").decode(bytes);
    }

    // ✅ parse payload JSON { v:1, videos:[{url,lat,lng,title,thumb,username,timestamp,likes,views,...}] }
    function parsePayloadVideos(payloadStr){
      try{
        const jsonStr = decodeBase64UrlToUtf8(payloadStr);
        const data = JSON.parse(jsonStr);

        const vids = Array.isArray(data?.videos) ? data.videos : [];

        const urls = vids
          .map(v => (v?.url || v?.videoUrl || "").trim())
          .filter(u => u.length > 0);

        const u = vids.map(v => (v?.username || v?.user || "").trim());
        const t = vids.map(v => Number(v?.timestamp || v?.publishedAt || 0));
        const l = vids.map(v => Number(v?.likes || 0));
        const vw = vids.map(v => Number(v?.views || 0));

        return { urls, usernames: u, timestamps: t, likes: l, views: vw };
      } catch (e){
        console.error("payload decode error:", e);
        return { urls: [], usernames: [], timestamps: [], likes: [], views: [] };
      }
    }

    function parseListParam(param, targetLength, defaultValue){
      if (!param) return new Array(targetLength).fill(defaultValue);
      const arr = param.split(',').map(v => v.trim());
      while (arr.length < targetLength) arr.push(defaultValue);
      return arr.slice(0, targetLength);
    }

    function parseNumberListParam(param, targetLength, defaultValue){
      if (!param) return new Array(targetLength).fill(defaultValue);
      const arr = param.split(',').map(v => parseInt(v.trim(), 10) || defaultValue);
      while (arr.length < targetLength) arr.push(defaultValue);
      return arr.slice(0, targetLength);
    }

    // ✅ Mise à jour: support payload= (priorité), sinon videos=, sinon video=
   function parseUrlParamsAndLoadVideos(){
  const params = new URLSearchParams(window.location.search); // valeurs déjà décodées [web:352]

  const payload = params.get("payload");
  if (payload) {
    const p = parsePayloadVideos(payload);

    window.videos = p.urls;

    // si payload ne fournit pas un champ, fallback sur query string
    usernames  = p.usernames.length  ? p.usernames  : parseListParam(params.get('usernames'),  window.videos.length, 'UrbainAR');
    timestamps = p.timestamps.length ? p.timestamps : parseNumberListParam(params.get('timestamps'), window.videos.length, 0);
    likesList  = p.likes.length      ? p.likes      : parseNumberListParam(params.get('likes'),      window.videos.length, 0);
    viewsList  = p.views.length      ? p.views      : parseNumberListParam(params.get('views'),      window.videos.length, 0);

  } else {
    const videosParam = params.get('videos');
    if (videosParam) {
      // ✅ IMPORTANT: decodeURIComponent pour chaque URL encodée depuis Android (Uri.encode)
      window.videos = videosParam
        .split(',')
        .map(v => v.trim())
        .filter(v => v.length > 0)
        .map(v => {
          try { return decodeURIComponent(v); } catch (_) { return v; } // [web:379]
        });
    } else {
      const videoUrl = params.get('video');
      window.videos = videoUrl ? [videoUrl] : [];
    }

    usernames  = parseListParam(params.get('usernames'),  window.videos.length, 'UrbainAR');
    timestamps = parseNumberListParam(params.get('timestamps'), window.videos.length, 0);
    likesList  = parseNumberListParam(params.get('likes'),      window.videos.length, 0);
    viewsList  = parseNumberListParam(params.get('views'),      window.videos.length, 0);
  }

  document.getElementById('video-count').textContent =
    window.videos.length > 0 ? `Vidéo 1/${window.videos.length}` : 'Aucune vidéo';

  updateNavButtonsState();
}

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.30));

      const ringGeo = new THREE.RingGeometry(0.05, 0.065, 40).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x66ffcc });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const overlayRoot = document.getElementById('xr-overlay');
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
        domOverlay: { root: overlayRoot }
      });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', async () => {
        toast("Session AR démarrée. Touche l’écran pour placer.");
        setExpanded(false);

        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        hitTestSourceRequested = true;

        session.addEventListener('end', () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
          toast("Session AR terminée.");
        });

        session.addEventListener('select', onSelect);
      });

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);

      parseUrlParamsAndLoadVideos();
      setupVideoElement();
      setupFrameVideoElement();
      setupInfoCanvas();
      bindVolumeUI();

      populateSheetFromVideos();

      if (window.videos.length > 0) {
        loadVideo(0);
        playCurrentVideo();
      } else {
        document.getElementById('video-title').textContent = 'Aucune vidéo';
        document.getElementById('video-meta').textContent = "Reviens depuis la carte UrbainAR (ou passe ?videos=... / ?payload=...).";
        document.getElementById('video-count').textContent = "0 vidéo";
      }

      window.addEventListener('pointerup', () => tryPlayWithCurrentVolume(), { once: true });
    }

    function onWindowResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createBoardIfNeeded(){
      if (boardGroup) return;

      boardGroup = new THREE.Group();

      const frameGeo = new THREE.PlaneGeometry(1.4, 2.2);
      const frameMat = new THREE.MeshBasicMaterial({ map: frameVideoTexture, side: THREE.DoubleSide });
      const framePlane = new THREE.Mesh(frameGeo, frameMat);
      boardGroup.add(framePlane);

      const frameColorOuter = 0x00f5ff;
      const frameColorInner = 0x00ff80;
      const frameDepth = 0.04;
      const frameThickness = 0.045;
      const frameWidth = 1.0;
      const frameHeight = 1.85;

      const frameMatNeon = new THREE.MeshStandardMaterial({
        color: frameColorOuter,
        emissive: frameColorOuter,
        emissiveIntensity: 1.5,
        metalness: 0.2,
        roughness: 0.3
      });
      frameMatGlobal = frameMatNeon;

      const neonLight = new THREE.PointLight(frameColorInner, 0.8, 4, 2.0);
      neonLight.position.set(0, 0.5, 0.4);
      boardGroup.add(neonLight);

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      topBar.position.set(0, frameHeight / 2, frameDepth / 2);
      boardGroup.add(topBar);

      const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      bottomBar.position.set(0, -frameHeight / 2, frameDepth / 2);
      boardGroup.add(bottomBar);

      const leftBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      leftBar.position.set(-frameWidth / 2, 0, frameDepth / 2);
      boardGroup.add(leftBar);

      const rightBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      rightBar.position.set(frameWidth / 2, 0, frameDepth / 2);
      boardGroup.add(rightBar);

      const groundGeo = new THREE.CircleGeometry(1.2, 48);
      const groundMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
      groundPlane = new THREE.Mesh(groundGeo, groundMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.set(0, -frameHeight / 2 - 0.05, 0);
      boardGroup.add(groundPlane);

      const videoGeo = new THREE.PlaneGeometry(0.9, 1.6);
      const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
      const videoPlane = new THREE.Mesh(videoGeo, videoMat);
      videoPlane.position.set(0, -0.1, 0.02);
      boardGroup.add(videoPlane);

      const infoGeo = new THREE.PlaneGeometry(0.9, 0.4);
      infoTexture = new THREE.CanvasTexture(infoCanvas);
      const infoMat = new THREE.MeshBasicMaterial({ map: infoTexture, transparent: true, side: THREE.DoubleSide });
      const infoPlane = new THREE.Mesh(infoGeo, infoMat);
      infoPlane.position.set(0, 1.15, 0.04);
      boardGroup.add(infoPlane);

      const socialGeo = new THREE.PlaneGeometry(0.28, 0.9);
      socialTexture = new THREE.CanvasTexture(socialCanvas);
      const socialMat = new THREE.MeshBasicMaterial({ map: socialTexture, transparent: true, side: THREE.DoubleSide });
      const socialPlane = new THREE.Mesh(socialGeo, socialMat);
      socialPlane.position.set(0.9 / 2 + 0.18, -0.1, 0.04);
      boardGroup.add(socialPlane);

      const logoUrl = 'https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/logoUrbainar.png';
      const logoTexture = new THREE.TextureLoader().load(logoUrl);
      const logoPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.35, 0.35),
        new THREE.MeshBasicMaterial({ map: logoTexture, transparent: true, side: THREE.DoubleSide })
      );
      logoPlane.position.set(0.9 / 2 + 0.35 / 2 + 0.08, 1.15, 0.06);
      boardGroup.add(logoPlane);

      scene.add(boardGroup);
    }

    function onSelect(){
      if (!reticle.visible || !videoTexture) return;

      createBoardIfNeeded();
      boardGroup.position.setFromMatrixPosition(reticle.matrix);

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const objPos = new THREE.Vector3();
      boardGroup.getWorldPosition(objPos);

      const dir = new THREE.Vector3().subVectors(camPos, objPos);
      const angleY = Math.atan2(dir.x, dir.z);

      boardGroup.rotation.set(0, angleY, 0);
      toast("Placée.");
    }

    function setupVideoElement(){
      videoElement = document.getElementById('video');
      if (!videoElement) return;

      videoTexture = new THREE.VideoTexture(videoElement);
      videoTexture.colorSpace = THREE.SRGBColorSpace;

      videoElement.addEventListener('waiting', () => { setLoading(true); toast("Chargement vidéo…", 900); });
      videoElement.addEventListener('playing', () => setLoading(false));
      videoElement.addEventListener('canplay', () => setLoading(false));
      videoElement.addEventListener('error', () => { setLoading(false); toast("Erreur vidéo (URL invalide ou CORS).", 2200); });

      videoElement.addEventListener('ended', () => {
        videoElement.currentTime = 0;
        videoElement.play().catch(() => {});
      });
    }

    function setupFrameVideoElement(){
      frameVideoElement = document.getElementById('frameVideo');
      if (!frameVideoElement) return;

      const frameVideoUrl = 'https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/frameUrbainar.mp4';
      frameVideoElement.src = frameVideoUrl;
      frameVideoElement.muted = true;
      frameVideoElement.load();

      frameVideoTexture = new THREE.VideoTexture(frameVideoElement);
      frameVideoTexture.colorSpace = THREE.SRGBColorSpace;
    }

    function setupInfoCanvas(){
      infoCanvas = document.createElement('canvas');
      infoCanvas.width = 512;
      infoCanvas.height = 256;
      infoCtx = infoCanvas.getContext('2d');

      socialCanvas = document.createElement('canvas');
      socialCanvas.width = 256;
      socialCanvas.height = 512;
      socialCtx = socialCanvas.getContext('2d');

      drawInfoText(0);
      drawSocialColumn(0);
    }

    function drawInfoText(index){
      if (!infoCtx) return;

      const username = usernames[index] || 'UrbainAR';
      const publishedAt = formatPublishedAt(index);

      infoCtx.clearRect(0, 0, infoCanvas.width, infoCanvas.height);

      infoCtx.fillStyle = 'rgba(0,0,0,0.75)';
      const r = 28, w = infoCanvas.width - 40, h = infoCanvas.height - 40, x = 20, y = 20;

      infoCtx.beginPath();
      infoCtx.moveTo(x + r, y);
      infoCtx.lineTo(x + w - r, y);
      infoCtx.quadraticCurveTo(x + w, y, x + w, y + r);
      infoCtx.lineTo(x + w, y + h - r);
      infoCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      infoCtx.lineTo(x + r, y + h);
      infoCtx.quadraticCurveTo(x, y + h, x, y + h - r);
      infoCtx.lineTo(x, y + r);
      infoCtx.quadraticCurveTo(x, y, x + r, y);
      infoCtx.closePath();
      infoCtx.fill();

      infoCtx.fillStyle = '#ffffff';
      infoCtx.font = 'bold 32px system-ui';
      infoCtx.textBaseline = 'top';
      infoCtx.fillText(username, 40, 40);

      infoCtx.font = '22px system-ui';
      infoCtx.fillStyle = '#cccccc';
      infoCtx.fillText(publishedAt, 40, 92);

      if (infoTexture) infoTexture.needsUpdate = true;
    }

    function drawSocialColumn(index){
      if (!socialCtx) return;

      const likes = likesList[index] ?? 0;
      const views = viewsList[index] ?? 0;

      const w = socialCanvas.width;
      const h = socialCanvas.height;

      socialCtx.clearRect(0, 0, w, h);

      socialCtx.fillStyle = 'rgba(0,0,0,0.75)';
      const r = 40, padX = 40, padY = 40, boxW = w - padX * 2, boxH = h - padY * 2;

      socialCtx.beginPath();
      socialCtx.moveTo(padX + r, padY);
      socialCtx.lineTo(padX + boxW - r, padY);
      socialCtx.quadraticCurveTo(padX + boxW, padY, padX + boxW, padY + r);
      socialCtx.lineTo(padX + boxW, padY + boxH - r);
      socialCtx.quadraticCurveTo(padX + boxW, padY + boxH, padX + boxW - r, padY + boxH);
      socialCtx.lineTo(padX + r, padY + boxH);
      socialCtx.quadraticCurveTo(padX, padY + boxH, padX, padY + boxH - r);
      socialCtx.lineTo(padX, padY + r);
      socialCtx.quadraticCurveTo(padX, padY, padX + r, padY);
      socialCtx.closePath();
      socialCtx.fill();

      socialCtx.textAlign = 'center';
      socialCtx.textBaseline = 'middle';

      const centerX = w / 2;
      let centerY = padY + boxH * 0.30;

      socialCtx.font = '40px system-ui';
      socialCtx.fillStyle = '#ffffff';
      socialCtx.fillText('❤️', centerX, centerY - 30);

      socialCtx.font = '28px system-ui';
      socialCtx.fillText(String(likes), centerX, centerY + 18);

      centerY = padY + boxH * 0.68;

      socialCtx.font = '40px system-ui';
      socialCtx.fillText('👁', centerX, centerY - 30);

      socialCtx.font = '28px system-ui';
      socialCtx.fillText(String(views), centerX, centerY + 18);

      if (socialTexture) socialTexture.needsUpdate = true;
    }

    function loadVideo(index){
      if (!window.videos || window.videos.length === 0) return;
      if (index < 0 || index >= window.videos.length) return;

      currentIndex = index;

      const url = window.videos[index];
      videoElement.src = url;

      const vol = parseFloat(volumeSlider?.value || '1');
      videoElement.volume = vol;
      videoElement.muted = (vol <= 0.001);

      setLoading(true);
      videoElement.load();

      document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
      document.getElementById('video-meta').textContent =
        window.videos.length > 1 ? 'Utilise ⟵ ⟶ pour changer de vidéo.' : 'Vidéo UrbainAR.';

      document.getElementById('video-count').textContent = `Vidéo ${index + 1}/${window.videos.length}`;

      drawInfoText(index);
      drawSocialColumn(index);
      updateNavButtonsState();
    }
    window.loadVideo = loadVideo;

    function updateNavButtonsState(){
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      if (!btnPrev || !btnNext) return;

      if (window.videos.length <= 1) {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      } else {
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === window.videos.length - 1;
      }
    }

    function playCurrentVideo(){
      if (!videoElement) return;
      tryPlayWithCurrentVolume();

      if (frameVideoElement && frameVideoElement.paused) {
        frameVideoElement.play().catch(() => {});
      }
    }
    window.playCurrentVideo = playCurrentVideo;

    window.nextVideo = function(){
      if (currentIndex < window.videos.length - 1) {
        loadVideo(currentIndex + 1);
        playCurrentVideo();
      }
    };

    window.prevVideo = function(){
      if (currentIndex > 0) {
        loadVideo(currentIndex - 1);
        playCurrentVideo();
      }
    };

    window.closeAr = function(){
      if (history.length > 1) history.back();
      else window.close();
    };

    let noHitFrames = 0;

    function render(timestamp, frame){
      const session = renderer.xr.getSession();
      if (session && hitTestSourceRequested && hitTestSource && frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          noHitFrames = 0;
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);

          const s = 1 + Math.sin(timestamp * 0.008) * 0.12;
          reticle.scale.set(s, s, s);
        } else {
          reticle.visible = false;
          noHitFrames++;
          if (noHitFrames > 120) {
            const meta = document.getElementById('video-meta');
            if (meta) meta.textContent = "Déplace ton téléphone : vise un sol contrasté et mieux éclairé.";
          }
        }
      }

      const t = timestamp * 0.001;
      if (frameMatGlobal) frameMatGlobal.emissiveIntensity = 1.5 + Math.sin(t * 2.0) * 0.4;

      if (groundPlane) {
        groundPlane.material.opacity = 0.30 + Math.abs(Math.sin(t * 1.5)) * 0.15;
        const scale = 1.0 + Math.sin(t * 1.2) * 0.05;
        groundPlane.scale.set(scale, scale, 1);
      }

      renderer.render(scene, camera);
    }

    if (!('xr' in navigator)) {
      document.getElementById('video-meta').textContent =
        "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
      console.error("navigator.xr non disponible");
    } else {
      init();
    }
  </script>
