<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UrbainAR - Test Vidéo</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }
      
      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body style='margin: 0; overflow: hidden;'>
    <div id="info">Vidéo de test chargée. Vise le marker fenetre.</div>

    <a-scene embedded arjs>
      <a-assets>
        <!-- VIDÉO TEST EN DUR -->
        <video
          id="vid"
          src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_f27db215-1cb8-40d2-aa8a-4418eb3214c4.mp4"
          loop
          autoplay
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-marker
        type="pattern"
        url="markers/fenetre.patt"
      >
        <a-video
          src="#vid"
          position="0 0 0"
          rotation="-90 0 0"
          width="0.9"
          height="1.6"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const vid = document.getElementById('vid');
      
      // Forcer le play dès que la vidéo peut jouer
      vid.addEventListener('canplay', function() {
        vid.play();
      });
    </script>
  </body>
</html>
