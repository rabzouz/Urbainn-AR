<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR 3D</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
        border-radius: 4px;
      }

      #soundBtn {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="info">Chargement... Vise le marker Hiro</div>
    <button id="soundBtn">🔊 Activer le son</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets id="assets"></a-assets>

      <a-marker preset="hiro" id="marker">
        <!-- Les vidéos seront ajoutées ici -->
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const info = document.getElementById('info');
      const soundBtn = document.getElementById('soundBtn');
      const sceneEl = document.querySelector('a-scene');
      const assetsEl = document.getElementById('assets');
      const markerEl = document.getElementById('marker');

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let videos = [];
      let videoElements = [];

      async function loadVideos() {
        try {
          info.textContent = 'Chargement des vidéos...';

          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(5);

          if (error) throw error;

          videos = data || [];
          info.textContent = `${videos.length} vidéo(s). Vise Hiro et clique sur une vidéo.`;

          if (videos.length === 0) {
            info.textContent = 'Aucune vidéo dans la base.';
            return;
          }

          createVideoPanels();
        } catch (err) {
          console.error('Erreur:', err);
          info.textContent = 'Erreur: ' + err.message;
        }
      }

      function createVideoPanels() {
        const spacing = 1.2;
        const startX = -(videos.length - 1) * spacing / 2;

        videos.forEach((video, index) => {
          const videoId = `vid-${video.id}`;
          
          // Créer vidéo HTML
          const videoEl = document.createElement('video');
          videoEl.id = videoId;
          videoEl.src = video.video_url;
          videoEl.loop = true;
          videoEl.muted = true;
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('webkit-playsinline', '');
          videoEl.setAttribute('crossorigin', 'anonymous');
          
          videoEl.addEventListener('loadeddata', () => {
            videoEl.play().catch(e => console.log('autoplay:', e));
          });
          
          assetsEl.appendChild(videoEl);
          videoElements.push(videoEl);

          const x = startX + (index * spacing);

          // Container
          const container = document.createElement('a-entity');
          container.setAttribute('position', `${x} 1 0`);

          // Vidéo (ratio 9:16)
          const videoWidth = 0.6;
          const videoHeight = videoWidth * (16 / 9);

          const plane = document.createElement('a-plane');
          plane.setAttribute('width', videoWidth);
          plane.setAttribute('height', videoHeight);
          plane.setAttribute('material', `shader: flat; src: #${videoId}`);
          plane.setAttribute('rotation', '-90 0 0');
          plane.setAttribute('position', '0 0 0');
          
          // Event click pour son
          plane.addEventListener('click', function() {
            console.log('Click vidéo:', video.title);
            videoEl.muted = false;
            videoEl.play();
            soundBtn.style.display = 'none';
          });

          container.appendChild(plane);

          // Logo UrbainAR (texte 3D au-dessus)
          const logo = document.createElement('a-text');
          logo.setAttribute('value', 'UrbainAR');
          logo.setAttribute('align', 'center');
          logo.setAttribute('width', '2');
          logo.setAttribute('color', '#00D4FF');
          logo.setAttribute('position', `0 0.1 ${videoHeight / 2 + 0.2}`);
          logo.setAttribute('rotation', '-90 0 0');
          container.appendChild(logo);

          // User
          const username = document.createElement('a-text');
          username.setAttribute('value', video.user_id || 'Anonyme');
          username.setAttribute('align', 'center');
          username.setAttribute('width', '1.5');
          username.setAttribute('color', '#FFFFFF');
          username.setAttribute('position', `0 0.1 ${videoHeight / 2 + 0.1}`);
          username.setAttribute('rotation', '-90 0 0');
          container.appendChild(username);

          // Vues (bas gauche)
          const views = document.createElement('a-text');
          views.setAttribute('value', `${video.view_count || 0} vues`);
          views.setAttribute('align', 'left');
          views.setAttribute('width', '1');
          views.setAttribute('color', '#FFFFFF');
          views.setAttribute('position', `${-videoWidth / 2 + 0.05} 0.1 ${-videoHeight / 2 - 0.1}`);
          views.setAttribute('rotation', '-90 0 0');
          container.appendChild(views);

          // Likes (bas droite)
          const likes = document.createElement('a-text');
          likes.setAttribute('value', `♥ ${video.like_count || 0}`);
          likes.setAttribute('align', 'right');
          likes.setAttribute('width', '1');
          likes.setAttribute('color', '#FF5A7A');
          likes.setAttribute('position', `${videoWidth / 2 - 0.05} 0.1 ${-videoHeight / 2 - 0.1}`);
          likes.setAttribute('rotation', '-90 0 0');
          container.appendChild(likes);

          markerEl.appendChild(container);
        });
      }

      // Bouton global pour tout activer
      soundBtn.addEventListener('click', () => {
        videoElements.forEach(v => {
          v.muted = false;
          v.play();
        });
        soundBtn.style.display = 'none';
      });

      sceneEl.addEventListener('loaded', () => {
        loadVideos();
      });
    </script>
  </body>
</html>
