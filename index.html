<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR Supabase</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js pour A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

    <style>
      body, html {
        margin: 0;
        overflow: hidden;
      }
      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 20px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      xr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Vidéo HTML5 -->
      <video
        id="video-texture"
        src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_0061bed7-6c43-43fe-814b-4c9288a7c65e.mp4"
        loop="true"
        crossorigin="anonymous"
        webkit-playsinline
        playsinline
      ></video>

      <!-- Marker Hiro -->
      <a-marker preset="hiro">
        <a-video
          id="video-plane"
          src="#video-texture"
          width="1.0"
          height="1.0"
          position="0 0 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <button id="playWithSound">Activer le son</button>

    <script>
      const vid = document.getElementById("video-texture");
      const btn = document.getElementById("playWithSound");
      const plane = document.getElementById("video-plane");

      // 1) Lire ?video=... dans l'URL
      try {
        const params = new URLSearchParams(window.location.search);
        const videoParam = params.get("video");
        if (videoParam) {
          vid.src = decodeURIComponent(videoParam);
        }
      } catch (e) {
        console.log("Erreur lecture paramètre video:", e);
      }

      // 2) Quand les métadonnées sont chargées, ajuster le ratio du plan
      vid.addEventListener("loadedmetadata", () => {
        const vw = vid.videoWidth;
        const vh = vid.videoHeight;
        if (!vw || !vh || !plane) return;

        // largeur de base en mètres (taille du panneau)
        const baseWidth = 1.5;
        const aspect = vh / vw; // hauteur / largeur pour respecter le ratio
        const finalWidth = baseWidth;
        const finalHeight = baseWidth * aspect;

        plane.setAttribute("width", finalWidth);
        plane.setAttribute("height", finalHeight);
      });

      // 3) Démarrage auto en muet
      vid.muted = true;
      vid.play().catch(() => {});

      // 4) Au clic, activer le son
      btn.addEventListener("click", () => {
        vid.muted = false;
        vid.play().catch(err => console.log("Erreur lecture:", err));
        btn.style.display = "none";
      });
    </script>
  </body>
</html>
