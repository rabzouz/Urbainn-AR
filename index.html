<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - Vidéos près de vous</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 9999;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer (retour app) */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles en bas (navigation dans la liste, son) */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-nav button:hover {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      transform: scale(1.05);
    }

    #video-nav button:active {
      transform: scale(0.95);
    }

    #video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Loader A‑Frame custom */
    .a-loader-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>
</head>
<body>

<!-- Top bar infos vidéo sélectionnée -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">La vidéo s'affiche devant toi en AR.</div>
  <div id="video-count">1 vidéo en cours</div>
</div>

<!-- Bouton Fermer -->
<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<!-- Navigation (une seule vidéo, flèches désactivées) -->
<div id="video-nav">
  <button id="btn-prev" onclick="previousVideo()" title="Vidéo précédente" disabled>⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>➡️</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="precision: medium; antialias: true"
  loading-screen="enabled: true; backgroundColor: #000000; dotsColor: #1a73e8"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false">

  <!-- Caméra (on garde gps-new-camera pour plus tard si tu veux le GPS) -->
  <a-camera gps-new-camera="gpsMinDistance: 5" rotation-reader></a-camera>

  <a-assets>
    <video
      id="video"
      src=""
      preload="auto"
      loop
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <!-- Écran vidéo toujours visible devant la caméra -->
  <a-entity id="video-container" position="0 1.5 -3">
    <a-plane
      width="0.9"
      height="1.6"
      material="src: #video; shader: flat;">
    </a-plane>
  </a-entity>

</a-scene>

<script>
  let videoElement = null;
  let soundEnabled = true;

  // Boucle douce
  document.addEventListener('DOMContentLoaded', () => {
    videoElement = document.querySelector('#video');
    if (videoElement) {
      videoElement.addEventListener('ended', () => {
        videoElement.currentTime = 0;
        videoElement.play().catch(() => {});
      });
    }
  });

  // Lecture du paramètre ?video= depuis l'app Android
  function parseUrlParamsAndLoad() {
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('video');

    if (!videoUrl) {
      document.getElementById('video-title').textContent = "Paramètre vidéo manquant";
      console.error("Paramètre ?video manquant dans l'URL");
      return;
    }

    if (!videoElement) {
      videoElement = document.querySelector('#video');
    }

    // Charger la vidéo envoyée par l'app (Supabase)
    videoElement.src = videoUrl;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent = 'Vidéo depuis UrbainAR';
    document.getElementById('video-count').textContent = '1 vidéo en cours';

    console.log('▶️ Vidéo chargée depuis URL param');
  }

  function playCurrentVideo() {
    if (!videoElement) return;

    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  function nextVideo() {
    // pas utilisé ici (1 seule vidéo)
  }

  function previousVideo() {
    // pas utilisé ici (1 seule vidéo)
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  }

  function closeAr() {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }

  // Fallback : premier tap écran → autoriser play() sur mobile
  window.addEventListener('click', () => {
    if (!videoElement) {
      videoElement = document.querySelector('#video');
    }
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  window.onload = () => {
    parseUrlParamsAndLoad();
    playCurrentVideo();
  };
</script>

</body>
</html>
