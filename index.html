<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;' vr-mode-ui="enabled: false">
  
  <a-assets>
    <video 
      id="video" 
      preload="auto" 
      loop 
      crossorigin="anonymous"
      playsinline 
      webkit-playsinline
      muted>
    </video>
  </a-assets>

  <a-marker preset='hiro' id="marker" emitevents="true">
    
    <!-- Cadre néon extérieur cyan -->
    <a-ring 
      position="0 0.5 0" 
      rotation="-90 0 0"
      radius-inner="1.8" 
      radius-outer="2" 
      color="#00ffff"
      material="shader: flat; emissive: #00ffff; emissiveIntensity: 2; side: double"
      animation="property: rotation; from: -90 0 0; to: -90 0 360; loop: true; dur: 4000; easing: linear">
    </a-ring>

    <!-- Cadre néon intérieur magenta -->
    <a-ring 
      position="0 0.5 0.05" 
      rotation="-90 0 0"
      radius-inner="2" 
      radius-outer="2.1" 
      color="#ff00ff"
      material="shader: flat; emissive: #ff00ff; emissiveIntensity: 1.5; side: double"
      animation="property: rotation; from: -90 0 0; to: -90 0 -360; loop: true; dur: 6000; easing: linear">
    </a-ring>

    <!-- Vidéo centrale -->
    <a-video 
      id="ar-video"
      src="#video" 
      width="1.6" 
      height="0.9" 
      position="0 0.5 0"
      rotation="-90 0 0">
    </a-video>

    <!-- Panneau d'informations -->
    <a-plane 
      position="0 0.5 0" 
      rotation="-90 0 0"
      width="1.8" 
      height="0.3" 
      color="#000000"
      material="opacity: 0.85; transparent: true"
      animation="property: material.emissive; from: #000000; to: #0a0a0a; loop: true; dur: 1500; dir: alternate">
      
      <!-- Nom d'utilisateur -->
      <a-text 
        id="username-text"
        value="@chargement..." 
        position="-0.8 0.08 0.01" 
        width="1.5"
        color="#00ffff"
        align="left">
      </a-text>

      <!-- Date et heure -->
      <a-text 
        id="date-text"
        value="Chargement..." 
        position="-0.8 -0.02 0.01" 
        width="1.2"
        color="#ffffff"
        align="left">
      </a-text>

      <!-- Compteur de vues -->
      <a-text 
        id="views-text"
        value="👁️ 0" 
        position="0.3 0.08 0.01" 
        width="1"
        color="#00ff00"
        align="left">
      </a-text>

      <!-- Compteur de likes -->
      <a-text 
        id="likes-text"
        value="❤️ 0" 
        position="0.3 -0.02 0.01" 
        width="1"
        color="#ff00ff"
        align="left"
        animation="property: scale; to: 1.15 1.15 1.15; loop: true; dur: 1000; dir: alternate; easing: easeInOutQuad">
      </a-text>

    </a-plane>

    <!-- Particules lumineuses gauche -->
    <a-sphere 
      position="1.2 1.2 0" 
      radius="0.05" 
      color="#00ffff"
      material="emissive: #00ffff; emissiveIntensity: 3; shader: flat"
      animation="property: position; to: 1.2 0.2 0; loop: true; dur: 2000; dir: alternate; easing: easeInOutQuad">
    </a-sphere>

    <!-- Particules lumineuses droite -->
    <a-sphere 
      position="-1.2 0.8 0" 
      radius="0.05" 
      color="#ff00ff"
      material="emissive: #ff00ff; emissiveIntensity: 3; shader: flat"
      animation="property: position; to: -1.2 0.3 0; loop: true; dur: 1500; dir: alternate; easing: easeInOutQuad">
    </a-sphere>

    <!-- Logo torique flottant -->
    <a-torus 
      position="0 1.5 0" 
      radius="0.3" 
      radius-tubular="0.04"
      color="#00ffff"
      material="emissive: #00ffff; emissiveIntensity: 2.5; shader: flat"
      animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
      animation__float="property: position; to: 0 1.8 0; loop: true; dur: 2000; dir: alternate; easing: easeInOutSine">
    </a-torus>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let videoElement = null;
  let videoLoaded = false;

  // Charger la vidéo depuis Supabase
  async function loadVideoData() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc&limit=1`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      
      const data = await response.json();
      console.log('📊 Données reçues:', data);
      
      if (data && data.length > 0) {
        const video = data[0];
        
        // Charger la vidéo
        videoElement = document.querySelector('#video');
        videoElement.src = video.video_url;
        videoElement.load();
        
        videoElement.addEventListener('loadeddata', () => {
          console.log('✅ Vidéo prête');
          videoLoaded = true;
        });
        
        // Mettre à jour les textes
        document.querySelector('#username-text').setAttribute('value', `@${video.user_id}`);
        
        const date = new Date(video.created_at);
        const formattedDate = date.toLocaleString('fr-FR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        document.querySelector('#date-text').setAttribute('value', formattedDate);
        
        document.querySelector('#views-text').setAttribute('value', `👁️ ${video.view_count}`);
        document.querySelector('#likes-text').setAttribute('value', `❤️ ${video.like_count}`);
        
        console.log('✅ Données chargées:', video.title);
      }
    } catch (error) {
      console.error('❌ Erreur:', error);
    }
  }

  // Attendre le chargement de la scène
  window.addEventListener('load', () => {
    loadVideoData();
    
    // Écouter les événements du marker
    const marker = document.querySelector('#marker');
    
    marker.addEventListener('markerFound', () => {
      console.log('🎯 Marker détecté !');
      if (videoElement && videoLoaded) {
        videoElement.play().then(() => {
          console.log('▶️ Vidéo en lecture');
        }).catch(e => {
          console.log('⚠️ Autoplay bloqué:', e.message);
        });
      }
    });
    
    marker.addEventListener('markerLost', () => {
      console.log('❌ Marker perdu');
      if (videoElement) {
        videoElement.pause();
        console.log('⏸️ Vidéo en pause');
      }
    });
  });
</script>

</body>
</html>
