<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Three.js + ARButton (WebXR) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    canvas {
      display: block;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles bas (juste son ON/OFF ici) */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #xr-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">WebXR AR : cherche un sol puis tape pour placer l'écran.</div>
  <div id="video-count">1 vidéo en cours</div>
</div>

<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<div id="video-nav">
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
</div>

<!-- Vidéo HTML5 source pour la texture -->
<video
  id="video"
  src=""
  preload="auto"
  loop
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="display:none">
</video>

<div id="xr-button"></div>

<script>
  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;
  let xrSession = null;

  let videoElement = null;
  let videoTexture = null;
  let soundEnabled = true;
  let videoPlane = null;

  // 1) Initialisation Three.js
  function initThree() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Réticule (anneau) pour montrer la position du hit-test
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.rotation.x = -Math.PI / 2;
    reticle.visible = false;
    scene.add(reticle);

    // Bouton WebXR (AR)
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body }
    });
    document.getElementById('xr-button').appendChild(arButton);

    // Quand une session AR démarre
    renderer.xr.addEventListener('sessionstart', (ev) => {
      xrSession = renderer.xr.getSession();
      setupHitTestSource();
      xrSession.addEventListener('select', onSelect);
    });

    // Quand la session se termine
    renderer.xr.addEventListener('sessionend', () => {
      xrSession = null;
      hitTestSourceRequested = false;
      hitTestSource = null;
    });

    window.addEventListener('resize', onWindowResize);

    renderer.setAnimationLoop(render);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // 2) Hit-test WebXR (pose du sol) [tap écran + plane 3D]
  async function setupHitTestSource() {
    if (hitTestSourceRequested) return;
    const session = renderer.xr.getSession();
    if (!session) return;

    const viewerSpace = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

    session.addEventListener('end', () => {
      hitTestSourceRequested = false;
      hitTestSource = null;
    });

    hitTestSourceRequested = true;
  }

  function onSelect() {
    // Quand l'utilisateur tape, si le reticle est visible → placer/mettre à jour l'écran vidéo
    if (!reticle.visible || !videoTexture) return;

    if (!videoPlane) {
      // Plane 1080x1920 → ratio 9:16 (on prend largeur 0.9, hauteur 1.6)
      const geometry = new THREE.PlaneGeometry(0.9, 1.6);
      const material = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
      videoPlane = new THREE.Mesh(geometry, material);
      scene.add(videoPlane);
    }

    videoPlane.position.setFromMatrixPosition(reticle.matrix);
    // orienter le plane vers la caméra
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    videoPlane.lookAt(camPos);
  }

  // 3) Chargement de la vidéo depuis ?video=
  function parseUrlParamsAndLoadVideo() {
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('video');

    videoElement = document.getElementById('video');

    if (!videoUrl) {
      document.getElementById('video-title').textContent = "Paramètre vidéo manquant";
      console.error("Paramètre ?video manquant dans l'URL");
      return;
    }

    videoElement.src = videoUrl;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    videoElement.addEventListener('ended', () => {
      videoElement.currentTime = 0;
      videoElement.play().catch(() => {});
    });

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.encoding = THREE.sRGBEncoding;

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent = 'Tape sur le sol pour placer la vidéo.';
    document.getElementById('video-count').textContent = '1 vidéo en cours';

    console.log('▶️ Vidéo chargée pour WebXR AR');
  }

  function playCurrentVideo() {
    if (!videoElement) return;
    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  }

  function closeAr() {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }

  // 4) Boucle de rendu WebXR avec hit-test
  function render(timestamp, frame) {
    const session = renderer.xr.getSession();
    if (session && hitTestSource && frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  }

  // Fallback : premier tap → autoriser play() sur Android
  window.addEventListener('click', () => {
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  window.onload = () => {
    if (!('xr' in navigator)) {
      document.getElementById('video-meta').textContent =
        "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
      console.error("navigator.xr non disponible");
      return;
    }

    initThree();
    parseUrlParamsAndLoadVideo();
    playCurrentVideo();
  };
</script>

</body>
</html>
