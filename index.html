<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    canvas {
      display: block;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles bas : prev / sound / next */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #xr-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">WebXR AR : tape pour placer l'écran vidéo sur le sol.</div>
  <div id="video-count">0 vidéo</div>
</div>

<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<div id="video-nav">
  <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled>⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>➡️</button>
</div>

<!-- Vidéo HTML5 source pour la texture -->
<video
  id="video"
  src=""
  preload="auto"
  loop
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="display:none">
</video>

<div id="xr-button"></div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  let videoElement = null;
  let videoTexture = null;
  let soundEnabled = true;
  let videoPlane = null;

  // Liste des vidéos au même endroit
  let videos = [];      // array d'URLs
  let currentIndex = 0; // index de la vidéo affichée

  function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Réticule
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Bouton WebXR
const arButton = ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test']
});
document.body.appendChild(arButton); // bouton centré en bas par défaut


    // Session AR
    renderer.xr.addEventListener('sessionstart', async () => {
      const session = renderer.xr.getSession();
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      hitTestSourceRequested = true;

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      session.addEventListener('select', onSelect);
    });

    window.addEventListener('resize', onWindowResize);
    renderer.setAnimationLoop(render);

    parseUrlParamsAndLoadVideos();
    setupVideoElement();
    if (videos.length > 0) {
      loadVideo(0);
      playCurrentVideo();
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onSelect() {
    if (!reticle.visible || !videoTexture) return;

    if (!videoPlane) {
      const geometry = new THREE.PlaneGeometry(0.9, 1.6);
      const material = new THREE.MeshBasicMaterial({
        map: videoTexture,
        side: THREE.DoubleSide
      });
      videoPlane = new THREE.Mesh(geometry, material);
      scene.add(videoPlane);
    }

    // Position
    videoPlane.position.setFromMatrixPosition(reticle.matrix);

    // Orientation : panneau vertical, pivot Y uniquement
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);

    const objPos = new THREE.Vector3();
    videoPlane.getWorldPosition(objPos);

    const dir = new THREE.Vector3().subVectors(camPos, objPos);
    const angleY = Math.atan2(dir.x, dir.z);

    videoPlane.rotation.set(0, angleY, 0);
  }

  // ------- Gestion des vidéos multiples -------

  function parseUrlParamsAndLoadVideos() {
    const params = new URLSearchParams(window.location.search);

    // 1) Mode multi : ?videos=url1,url2,url3
    const videosParam = params.get('videos');

    if (videosParam) {
      videos = videosParam.split(',').map(v => v.trim()).filter(v => v.length > 0);
    } else {
      // 2) Compat ancien : ?video=...
      const videoUrl = params.get('video');
      if (videoUrl) {
        videos = [videoUrl];
      }
    }

    document.getElementById('video-count').textContent =
      videos.length > 0
        ? `Vidéo 1/${videos.length}`
        : 'Aucune vidéo';

    // Activer / désactiver les flèches
    updateNavButtonsState();
  }

  function setupVideoElement() {
    videoElement = document.getElementById('video');
    if (!videoElement) return;

    videoElement.addEventListener('ended', () => {
      videoElement.currentTime = 0;
      videoElement.play().catch(() => {});
    });

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.encoding = THREE.sRGBEncoding;
  }

  function loadVideo(index) {
    if (!videos || videos.length === 0) return;
    if (index < 0 || index >= videos.length) return;

    currentIndex = index;

    if (!videoElement) {
      videoElement = document.getElementById('video');
    }

    const url = videos[index];
    videoElement.src = url;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent =
      videos.length > 1
        ? 'Flèches pour changer de vidéo à ce spot.'
        : 'Vidéo depuis UrbainAR (une seule vidéo).';

    document.getElementById('video-count').textContent =
      `Vidéo ${index + 1}/${videos.length}`;

    updateNavButtonsState();

    console.log('▶️ Vidéo chargée index', index, url);
  }

  function updateNavButtonsState() {
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    if (!btnPrev || !btnNext) return;

    if (videos.length <= 1) {
      btnPrev.disabled = true;
      btnNext.disabled = true;
    } else {
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === videos.length - 1;
    }
  }

  function playCurrentVideo() {
    if (!videoElement) return;
    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  // Navigation
  window.nextVideo = function () {
    if (currentIndex < videos.length - 1) {
      loadVideo(currentIndex + 1);
      playCurrentVideo();
    }
  };

  window.prevVideo = function () {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
      playCurrentVideo();
    }
  };

  // Toggle son
  window.toggleSound = function () {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  };

  // Fermer
  window.closeAr = function () {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  };

  // Fallback : premier tap écran → autoriser play() sur Android
  window.addEventListener('click', () => {
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  // Boucle de rendu WebXR
  function render(timestamp, frame) {
    const session = renderer.xr.getSession();
    if (session && hitTestSourceRequested && hitTestSource && frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  }

  // Démarrage
  if (!('xr' in navigator)) {
    document.getElementById('video-meta').textContent =
      "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
    console.error("navigator.xr non disponible");
  } else {
    init();
  }
</script>

</body>
</html>
