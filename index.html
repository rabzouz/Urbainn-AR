<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UrbainAR WebAR</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        font-family: sans-serif;
        cursor: pointer;
      }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
      }

      #video-ui {
        position: fixed;
        z-index: 11;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: sans-serif;
        font-size: 13px;
      }

      #video-title { font-weight: 600; }

      #video-stats {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #likeBtn {
        background: transparent;
        border: none;
        color: #ff5a7a;
        font-size: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body style='margin: 0; overflow: hidden;'>
    <div id="info">Vise le marker Hiro</div>

    <div id="video-ui">
      <div>
        <div id="video-title">UrbainAR</div>
        <div id="video-views">1 vue</div>
      </div>
      <div id="video-stats">
        <button id="likeBtn">♡</button>
        <span id="video-likes">0</span>
      </div>
    </div>

    <button id="playWithSound">🔊 Activer le son</button>

    <a-scene embedded arjs>
      <a-assets>
        <video
          id="vid"
          src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_f27db215-1cb8-40d2-aa8a-4418eb3214c4.mp4"
          loop
          autoplay
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-marker preset="hiro" id="hiroMarker">
        <a-video
          src="#vid"
          position="0 0 0"
          rotation="-90 0 0"
          width="0.9"
          height="1.6"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const vid = document.getElementById('vid');
      const btn = document.getElementById('playWithSound');
      const info = document.getElementById('info');
      const likeBtn = document.getElementById('likeBtn');
      const likesEl = document.getElementById('video-likes');

      vid.addEventListener('canplay', function() {
        vid.play();
      });

      btn.addEventListener('click', function() {
        vid.muted = false;
        vid.play();
        btn.style.display = 'none';
        info.textContent = 'Son activé ! Marker détecté.';
      });

      // Likes locaux
      let localLikes = 0;
      let liked = false;

      likeBtn.addEventListener('click', function() {
        liked = !liked;
        if (liked) {
          localLikes += 1;
          likeBtn.textContent = '❤';
        } else {
          localLikes = Math.max(0, localLikes - 1);
          likeBtn.textContent = '♡';
        }
        likesEl.textContent = localLikes.toString();
      });
    </script>
  </body>
</html>
