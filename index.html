<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UrbainAR - Toutes les vidéos</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #playBtn {
        position: fixed;
        z-index: 10;
        bottom: 140px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        font-family: sans-serif;
        cursor: pointer;
      }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
      }

      #video-ui {
        position: fixed;
        z-index: 11;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: sans-serif;
        font-size: 13px;
      }

      #video-title { font-weight: 600; }

      #video-stats {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #likeBtn {
        background: transparent;
        border: none;
        color: #ff5a7a;
        font-size: 20px;
        cursor: pointer;
      }

      .nav-btn {
        position: fixed;
        z-index: 10;
        bottom: 70px;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        font-family: sans-serif;
      }

      #prevBtn { left: 20px; }
      #nextBtn { right: 20px; }
    </style>
  </head>

  <body style='margin: 0; overflow: hidden;'>
    <div id="info">Chargement des vidéos...</div>

    <div id="video-ui">
      <div>
        <div id="video-title">UrbainAR</div>
        <div id="video-views">-- vues</div>
      </div>
      <div id="video-stats">
        <button id="likeBtn">♡</button>
        <span id="video-likes">0</span>
      </div>
    </div>

    <button id="playBtn">🔊 Activer le son</button>
    <button id="prevBtn" class="nav-btn">◀</button>
    <button id="nextBtn" class="nav-btn">▶</button>

    <a-scene id="scene" embedded arjs>
      <a-assets id="assets"></a-assets>
      <a-marker preset="hiro" id="hiroMarker"></a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      console.log('Script démarré');

      const info = document.getElementById('info');
      const btn = document.getElementById('playBtn');
      const likeBtn = document.getElementById('likeBtn');
      const likesEl = document.getElementById('video-likes');
      const titleEl = document.getElementById('video-title');
      const viewsEl = document.getElementById('video-views');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log('Client Supabase créé');

      let videos = [];
      let videoElements = [];
      let currentVideo = null;
      let currentIndex = 0;

      async function loadVideos() {
        try {
          console.log('Chargement vidéos depuis Supabase...');
          info.textContent = 'Chargement des vidéos...';
          
          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (error) {
            console.error('Erreur Supabase:', error);
            throw error;
          }

          videos = data || [];
          console.log(`${videos.length} vidéo(s) chargée(s)`);
          info.textContent = `${videos.length} vidéo(s). Vise Hiro.`;

          if (videos.length === 0) {
            info.textContent = 'Aucune vidéo. Utilise l\'app pour poster !';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            return;
          }

          // Cacher navigation si une seule vidéo
          if (videos.length === 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
          }

          createVideoPlanes();
        } catch (err) {
          console.error('Erreur:', err);
          info.textContent = 'Erreur: ' + err.message;
        }
      }

      function createVideoPlanes() {
        const assets = document.getElementById('assets');
        const marker = document.getElementById('hiroMarker');

        videos.forEach((video, index) => {
          // Créer élément vidéo
          const videoEl = document.createElement('video');
          videoEl.id = `vid-${video.id}`;
          videoEl.src = video.video_url;
          videoEl.loop = true;
          videoEl.muted = true;
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('webkit-playsinline', '');
          videoEl.setAttribute('crossorigin', 'anonymous');
          
          videoEl.addEventListener('canplay', () => {
            console.log('Vidéo prête:', video.title);
          });

          videoEl.addEventListener('error', (e) => {
            console.error('Erreur vidéo:', video.title, e);
          });

          assets.appendChild(videoEl);
          videoElements.push({ video: video, element: videoEl });

          // Position CENTRÉE sur le marker
          const plane = document.createElement('a-video');
          plane.setAttribute('src', `#vid-${video.id}`);
          plane.setAttribute('position', '0 0.5 0');
          plane.setAttribute('rotation', '-90 0 0');
          plane.setAttribute('width', '0.9');
          plane.setAttribute('height', '1.6');
          plane.setAttribute('visible', index === 0);

          marker.appendChild(plane);
        });

        // Sélectionner la première
        if (videoElements.length > 0) {
          selectVideo(0);
        }
      }

      function selectVideo(index) {
        currentIndex = index;
        const item = videoElements[index];
        currentVideo = item;
        
        // Mettre à jour UI
        titleEl.textContent = item.video.title || 'UrbainAR';
        viewsEl.textContent = (item.video.view_count || 0) + ' vues';
        likesEl.textContent = item.video.like_count || 0;
        info.textContent = `Vidéo ${index + 1}/${videos.length}`;

        // Afficher seulement cette vidéo
        const marker = document.getElementById('hiroMarker');
        const planes = marker.querySelectorAll('a-video');
        planes.forEach((plane, i) => {
          plane.setAttribute('visible', i === index);
        });

        // Play cette vidéo, pause les autres
        videoElements.forEach((v, i) => {
          if (i === index) {
            v.element.play();
          } else {
            v.element.pause();
          }
        });
      }

      // Navigation
      prevBtn.addEventListener('click', () => {
        if (videos.length > 0) {
          currentIndex = (currentIndex - 1 + videos.length) % videos.length;
          selectVideo(currentIndex);
        }
      });

      nextBtn.addEventListener('click', () => {
        if (videos.length > 0) {
          currentIndex = (currentIndex + 1) % videos.length;
          selectVideo(currentIndex);
        }
      });

      // Activer son
      btn.addEventListener('click', function() {
        console.log('Activation son');
        videoElements.forEach(v => {
          v.element.muted = false;
        });
        if (currentVideo) {
          currentVideo.element.play();
        }
        btn.style.display = 'none';
        info.textContent = 'Son activé !';
      });

      // Likes
      let liked = false;

      likeBtn.addEventListener('click', function() {
        if (!currentVideo) return;

        liked = !liked;
        if (liked) {
          likeBtn.textContent = '❤';
          const newCount = (currentVideo.video.like_count || 0) + 1;
          likesEl.textContent = newCount;
          currentVideo.video.like_count = newCount;
          
          // TODO: Sauvegarder dans Supabase
          // supabaseClient.from('videos').update({ like_count: newCount }).eq('id', currentVideo.video.id)
        } else {
          likeBtn.textContent = '♡';
          const newCount = Math.max(0, (currentVideo.video.like_count || 0) - 1);
          likesEl.textContent = newCount;
          currentVideo.video.like_count = newCount;
        }
      });

      // Charger au démarrage
      document.getElementById('scene').addEventListener('loaded', () => {
        console.log('Scène A-Frame chargée');
        loadVideos();
      });
    </script>
  </body>
</html>
