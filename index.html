<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR Vidéo</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js pour A-Frame (marker-based simple pour démarrer) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      body, html {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Scène A-Frame + AR.js
      embedded + arjs : lance la caméra et superpose la 3D
    -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Vidéo HTML5 comme source -->
      <video
        id="video-texture"
        src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        loop="true"
        crossorigin="anonymous"
        webkit-playsinline
        playsinline
        muted
      ></video>

      <!--
        Marqueur AR : on utilise le pattern Hiro par défaut pour démarrer
        Quand la caméra voit ce marqueur, le plan vidéo apparaît dessus
      -->
      <a-marker type="pattern" url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/three.js/data/patt.hiro">
        <!-- Plan avec la vidéo comme texture -->
        <a-video
          src="#video-texture"
          width="2"
          height="1.125"  <!-- format ~16:9 -->
          position="0 0 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <!-- Caméra AR.js -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Démarrage auto de la vidéo quand la page se charge
      const vid = document.getElementById("video-texture");
      document.addEventListener("click", () => {
        // Sur mobile, il faut souvent une interaction utilisateur pour lancer le son
        vid.play().catch((e) => console.log("play error", e));
      });
      // Tentative auto (certains navigateurs la bloquent si pas muted)
      vid.play().catch(() => {});
    </script>
  </body>
</html>
