<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR (toutes vidéos)</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <!-- Gestes (pinch zoom, etc.) -->
    <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 60px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 12px;
        max-width: 80%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #video-ui {
        position: fixed;
        z-index: 11;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      #video-title { font-weight: 600; }

      #video-stats {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #likeBtn {
        background: transparent;
        border: none;
        color: #ff5a7a;
        font-size: 20px;
        line-height: 1;
        padding: 0 4px;
        cursor: pointer;
      }

      div.a-enter-vr,
      div.a-enter-ar {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="info">Chargement de la vidéo...</div>

    <div id="video-ui">
      <div>
        <div id="video-title">UrbainAR</div>
        <div id="video-views">0 vues</div>
      </div>
      <div id="video-stats">
        <button id="likeBtn">♡</button>
        <span id="video-likes">0</span>
      </div>
    </div>

    <button id="playWithSound">Activer le son</button>

    <a-scene
      embedded
      xr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
      <a-assets>
        <!-- vidéo principale (celle cliquée) -->
        <video
          id="video-texture"
          src=""
          loop="true"
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera></a-camera>
    </a-scene>

    <script>
      const vid       = document.getElementById("video-texture");
      const btn       = document.getElementById("playWithSound");
      const info      = document.getElementById("info");
      const viewsEl   = document.getElementById("video-views");
      const likesEl   = document.getElementById("video-likes");
      const likeBtn   = document.getElementById("likeBtn");
      const titleEl   = document.getElementById("video-title");
      const sceneEl   = document.querySelector("a-scene");

      let videoUrl = null;
      let videoId  = null;
      let clusterVideos = [];
      const htmlVideos = []; // toutes les balises <video> créées (pour activer le son)

      function getParams() {
        try {
          const params = new URLSearchParams(window.location.search);
          const videoParam   = params.get("video");
          const titleParam   = params.get("title");
          const idParam      = params.get("id");
          const clusterParam = params.get("cluster");

          if (videoParam) {
            videoUrl = decodeURIComponent(videoParam);
            vid.src = videoUrl;
            info.textContent = "Vidéo chargée. Autorise la caméra, puis appuie sur Activer le son.";
          } else {
            info.textContent = "Paramètre ?video= manquant dans l'URL.";
          }

          if (titleParam) {
            titleEl.textContent = decodeURIComponent(titleParam);
          }

          videoId = idParam || null;

          if (clusterParam) {
            const json = decodeURIComponent(clusterParam);
            clusterVideos = JSON.parse(json); // liste de VideoData
          }
        } catch (e) {
          console.log("Erreur lecture paramètres URL:", e);
          info.textContent = "Erreur de lecture des paramètres d'URL.";
        }
      }

      function createHtmlVideo(id, src, autoplayMuted = true) {
        const videoEl = document.createElement("video");
        videoEl.id = id;
        videoEl.src = src;
        videoEl.loop = true;
        videoEl.crossOrigin = "anonymous";
        videoEl.setAttribute("playsinline", "");
        videoEl.setAttribute("webkit-playsinline", "");
        if (autoplayMuted) {
          videoEl.muted = true;
          videoEl.play().catch(() => {});
        }
        document.body.appendChild(videoEl);
        htmlVideos.push(videoEl);
        return videoEl;
      }

      function createVideoPanel(videoId, index, total) {
        const radius = 4;      // distance autour de la caméra
        const yPos   = 1.6;    // hauteur
        const angle  = (index / total) * 2 * Math.PI;
        const x = radius * Math.cos(angle);
        const z = -radius * Math.sin(angle);

        const panel = document.createElement("a-entity");
        panel.setAttribute("geometry", "primitive: plane; height: 1.2; width: 0.7");
        panel.setAttribute("material", `shader: flat; src: #${videoId}`);
        panel.setAttribute("position", `${x} ${yPos} ${z}`);
        panel.setAttribute("look-at", "[camera]");

        panel.addEventListener("click", () => {
          const v = document.getElementById(videoId);
          v.muted = false;
          v.play().catch(err => console.log("Erreur lecture:", err));
          btn.style.display = "none";
        });

        sceneEl.appendChild(panel);
      }

      function createMainPanel() {
        // Panneau principal devant la caméra avec #video-texture
        const panel = document.createElement("a-entity");
        panel.setAttribute("geometry", "primitive: plane; height: 0.9; width: 1.5");
        panel.setAttribute("material", "shader: flat; src: #video-texture");
        panel.setAttribute("position", "0 1.6 -3");
        panel.setAttribute("look-at", "[camera]");
        panel.setAttribute("gesture-handler", "minScale: 0.2; maxScale: 2");

        panel.addEventListener("click", () => {
          vid.muted = false;
          vid.play().catch(err => console.log("Erreur lecture:", err));
          btn.style.display = "none";
        });

        sceneEl.appendChild(panel);
      }

      function setupClusterPanels() {
        if (!clusterVideos || !clusterVideos.length) return;
        clusterVideos.forEach((v, index) => {
          const id = `vid_${v.id}`;
          createHtmlVideo(id, v.videoUrl);
          createVideoPanel(id, index, clusterVideos.length);
        });
      }

      getParams();

      // Ajuster le ratio du plan principal
      vid.addEventListener("loadedmetadata", () => {
        const vw = vid.videoWidth;
        const vh = vid.videoHeight;
        if (!vw || !vh) return;
        const aspect = vh / vw;
        const baseWidth = 1.5;
        const finalWidth = baseWidth;
        const finalHeight = baseWidth * aspect;

        const mainPanel = sceneEl.querySelector("[material*='#video-texture']");
        if (mainPanel) {
          mainPanel.setAttribute("width", finalWidth);
          mainPanel.setAttribute("height", finalHeight);
        }
      });

      // Quand la scène est prête
      sceneEl.addEventListener("loaded", () => {
        if (!videoUrl) return;

        // vidéo principale en muet
        vid.muted = true;
        vid.play().then(() => {
          const mesh = sceneEl.querySelector("[material*='#video-texture']")?.getObject3D("mesh");
          if (mesh && mesh.material && mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        }).catch(err => console.log("autoplay error:", err));

        // Panneau principal + panneaux du cluster
        createMainPanel();
        setupClusterPanels();

        // Démo: vue = 1
        viewsEl.textContent = "1 vue";
      });

      // Bouton global pour activer le son sur toutes les vidéos
      btn.addEventListener("click", () => {
        if (!videoUrl) return;
        htmlVideos.concat([vid]).forEach(v => {
          v.muted = false;
          v.play().catch(err => console.log("play error:", err));
        });
        btn.style.display = "none";
      });

      // Bouton like local (front-only)
      let localLikes = 0;
      let liked = false;

      likeBtn.addEventListener("click", () => {
        liked = !liked;
        if (liked) {
          localLikes += 1;
          likeBtn.textContent = "❤";
        } else {
          localLikes = Math.max(0, localLikes - 1);
          likeBtn.textContent = "♡";
        }
        likesEl.textContent = localLikes.toString();
        // Ici plus tard: appel backend / Firestore pour sauver le like (videoId)
      });
    </script>
  </body>
</html>
