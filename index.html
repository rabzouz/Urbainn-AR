<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Test vidéo UrbainAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }
      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 20px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
      div.a-enter-vr, div.a-enter-ar { display: none !important; }
    </style>
  </head>
  <body>
    <button id="playWithSound">Activer le son</button>

    <a-scene
      embedded
      xr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
      <a-assets>
        <!-- Mets ici ton URL Supabase COMPLETE (public) -->
        <video
          id="video-texture"
          src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_e1cbef24-ab42-4fbe-9ada-3a7b63ed5a23.mp4"
          loop="true"
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera></a-camera>

      <!-- Panneau vidéo simple devant la caméra, sans GPS -->
      <a-video
        id="video-plane"
        src="#video-texture"
        position="0 1.5 -3"
        rotation="0 0 0"
        width="1.5"
        height="0.9"
      ></a-video>
    </a-scene>

    <script>
      const vid   = document.getElementById("video-texture");
      const btn   = document.getElementById("playWithSound");
      const plane = document.getElementById("video-plane");

      // Démarrage muet quand la scène est prête
      document.querySelector("a-scene").addEventListener("loaded", () => {
        vid.muted = true;
        vid.play().then(() => {
          const mesh = plane.getObject3D("mesh");
          if (mesh && mesh.material && mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        }).catch(err => console.log("autoplay error:", err));
      });

      // Bouton pour activer le son
      btn.addEventListener("click", () => {
        vid.muted = false;
        vid.play().catch(err => console.log("play error:", err));
        btn.style.display = "none";
      });
    </script>
  </body>
</html>
