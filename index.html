<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - Vidéos près de vous</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- A-Frame + AR.js 3 location-based -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 9999;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer (retour app) */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles en bas (navigation dans la liste, son) */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-nav button:hover {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      transform: scale(1.05);
    }

    #video-nav button:active {
      transform: scale(0.95);
    }

    #video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Loader A‑Frame custom */
    .a-loader-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>
</head>
<body>

<!-- Top bar infos vidéo sélectionnée -->
<div id="video-info">
  <div id="video-title">Aucune vidéo sélectionnée</div>
  <div id="video-meta">Tourne autour de toi pour voir les vidéos proches.</div>
  <div id="video-count">0 vidéo trouvée</div>
</div>

<!-- Bouton Fermer -->
<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<!-- Navigation (change de vidéo dans la liste, pas la position GPS) -->
<div id="video-nav">
  <button id="btn-prev" onclick="previousVideo()" title="Vidéo précédente" disabled>⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>➡️</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="precision: medium; antialias: true"
  loading-screen="enabled: true; backgroundColor: #000000; dotsColor: #1a73e8"
  cursor="rayOrigin: mouse; fuse: false"
  raycaster="objects: a-entity"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false">

  <!-- Caméra géolocalisée -->
  <a-camera gps-new-camera="gpsMinDistance: 5" rotation-reader></a-camera>

  <a-assets>
    <!-- src par défaut pour éviter les warnings et le timeout A‑Frame -->
    <video
      id="video"
      src="https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-videos/video_fa967c31-9e06-47c1-849f-e94b9a1b4430.mp4"
      preload="auto"
      loop
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <!-- Les entités GPS seront ajoutées en JS -->
</a-scene>

<script>
  const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

  let allVideos = [];      // toutes les vidéos avec lat/lon
  let currentIndex = -1;   // index de la vidéo actuellement sélectionnée
  let videoElement = null;
  let soundEnabled = true;
  let gpsReady = false;

  async function loadAllVideos() {
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/videos?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
          },
        }
      );

      if (!response.ok) {
        console.error('❌ Erreur HTTP Supabase :', response.status, await response.text());
        document.getElementById('video-title').textContent = 'Erreur Supabase ' + response.status;
        return;
      }

      allVideos = await response.json();
      console.log('✅ vidéos chargées:', allVideos.length);

      document.getElementById('video-count').textContent =
        allVideos.length + (allVideos.length > 1 ? ' vidéos' : ' vidéo') + ' proches';

      if (gpsReady) {
        placeVideoEntities();
      }
    } catch (error) {
      console.error('❌ Erreur chargement liste vidéos :', error);
      document.getElementById('video-title').textContent = 'Erreur de chargement';
    }
  }

  // Ajoute un pin AR pour chaque vidéo autour de l'utilisateur
  function placeVideoEntities() {
    const scene = document.querySelector('a-scene');
    if (!scene || allVideos.length === 0) return;

    allVideos.forEach((video, index) => {
      if (!video.latitude || !video.longitude) return;

      const entity = document.createElement('a-entity');

      entity.setAttribute('gps-new-entity-place', {
        latitude: video.latitude,
        longitude: video.longitude,
      });

      // Icône "pin" simple (cylindre + sphère)
      const pin = document.createElement('a-entity');
      pin.setAttribute('geometry', {
        primitive: 'cylinder',
        radius: 0.5,
        height: 2,
      });
      pin.setAttribute('material', { color: '#1a73e8' });
      pin.setAttribute('position', '0 1 0');

      const head = document.createElement('a-sphere');
      head.setAttribute('radius', 0.7);
      head.setAttribute('color', '#ffffff');
      head.setAttribute('position', '0 2 0');

      // Étiquette texte qui regarde la caméra
      const label = document.createElement('a-text');
      label.setAttribute('value', video.title || 'Vidéo UrbainAR');
      label.setAttribute('align', 'center');
      label.setAttribute('color', '#ffffff');
      label.setAttribute('position', '0 3 0');
      label.setAttribute('scale', '8 8 8');
      label.setAttribute('look-at', '[gps-new-camera]');

      entity.appendChild(pin);
      entity.appendChild(head);
      entity.appendChild(label);

      // Quand on clique sur le pin → charger/lecture de la vidéo
      entity.addEventListener('click', () => {
        console.log('📍 Pin vidéo cliqué, index', index);
        loadVideo(index);
        playCurrentVideo();
      });

      scene.appendChild(entity);
    });

    if (allVideos.length > 0) {
      // Sélection initiale = première vidéo de la liste
      loadVideo(0);
    }
  }

  function loadVideo(index) {
    if (index < 0 || index >= allVideos.length) return;

    currentIndex = index;
    const video = allVideos[index];

    if (!videoElement) {
      videoElement = document.querySelector('#video');
    }

    videoElement.src = video.video_url;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    // UI texte
    document.getElementById('video-title').textContent =
      video.title || 'Vidéo UrbainAR';

    const author =
      video.user_id ||
      video.ownerId ||
      video.owner_id ||
      video.author ||
      'Créateur UrbainAR';
    document.getElementById('video-meta').textContent = 'par ' + author;

    document.getElementById('video-count').textContent =
      'Vidéo ' + (index + 1) + '/' + allVideos.length;

    document.getElementById('btn-prev').disabled = index === 0;
    document.getElementById('btn-next').disabled =
      index === allVideos.length - 1;

    console.log(`▶️ Vidéo ${index + 1}/${allVideos.length}`);
  }

  function playCurrentVideo() {
    if (!videoElement) return;

    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play();
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  function nextVideo() {
    if (currentIndex < allVideos.length - 1) {
      loadVideo(currentIndex + 1);
      playCurrentVideo();
    }
  }

  function previousVideo() {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
      playCurrentVideo();
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  }

  function closeAr() {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }

  // Fallback : premier tap écran → autoriser play() sur mobile
  window.addEventListener('click', () => {
    if (!videoElement) {
      videoElement = document.querySelector('#video');
    }
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  window.onload = () => {
    // 1) Chargement des vidéos
    loadAllVideos();

    // 2) Attendre la première position GPS avant de placer les entités
    const cam = document.querySelector('[gps-new-camera]');
    cam.addEventListener('gps-camera-update-position', (e) => {
      console.log(
        '📡 Première position GPS :',
        e.detail.position.latitude,
        e.detail.position.longitude
      );
      if (!gpsReady) {
        gpsReady = true;
        placeVideoEntities();
      }
    });
  };
</script>

</body>
</html>
