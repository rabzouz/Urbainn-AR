<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    canvas {
      display: block;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles bas : prev / sound / next */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">WebXR AR : tape pour placer l'écran vidéo sur le sol.</div>
  <div id="video-count">0 vidéo</div>
</div>

<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<div id="video-nav">
  <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled>⬅️</button>
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
  <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>➡️</button>
</div>

<!-- Vidéo HTML5 source pour la texture -->
<video
  id="video"
  src=""
  preload="auto"
  loop
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="display:none">
</video>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  let videoElement = null;
  let videoTexture = null;
  let soundEnabled = true;

  // Panneau 3D : group global (fond + vidéo + bandeau infos)
  let boardGroup = null;
  let videoPlane = null;
  let infoPlane = null;
  let infoTexture = null;
  let infoCanvas = null;
  let infoCtx = null;

  // Liste des vidéos et métadonnées
  let videos = [];          // URLs
  let currentIndex = 0;

  let usernames = [];
  let dates = [];
  let likesList = [];
  let viewsList = [];

  function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Réticule
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Bouton WebXR : centré et plus haut que la barre du bas
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    });
    arButton.style.position = 'fixed';
    arButton.style.left = '50%';
    arButton.style.transform = 'translateX(-50%)';
    arButton.style.bottom = '110px';   // au-dessus des boutons bas
    arButton.style.zIndex = '11';
    document.body.appendChild(arButton);

    // Session AR
    renderer.xr.addEventListener('sessionstart', async () => {
      const session = renderer.xr.getSession();
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      hitTestSourceRequested = true;

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      session.addEventListener('select', onSelect);
    });

    window.addEventListener('resize', onWindowResize);
    renderer.setAnimationLoop(render);

    parseUrlParamsAndLoadVideos();
    setupVideoElement();
    setupInfoCanvas();

    if (videos.length > 0) {
      loadVideo(0);
      playCurrentVideo();
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

function createBoardIfNeeded() {
  if (boardGroup) return;

  boardGroup = new THREE.Group();

  // Fond légèrement plus grand que la vidéo (noir translucide)
  const bgGeo = new THREE.PlaneGeometry(1.1, 2.0);
  const bgMat = new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.7
  });
  const bgPlane = new THREE.Mesh(bgGeo, bgMat);
  bgPlane.position.set(0, 0, 0);
  boardGroup.add(bgPlane);

  // Cadre néon vert/bleu autour de la vidéo : 4 barres fines
  const frameColor = 0x00f5ff; // cyan néon
  const frameMat = new THREE.MeshBasicMaterial({
    color: frameColor,
    transparent: true,
    opacity: 0.9
  });

  const frameThickness = 0.03;
  const frameWidth = 0.9 + 0.04;
  const frameHeight = 1.6 + 0.04;

  // Barre horizontale haute
  const topBarGeo = new THREE.PlaneGeometry(frameWidth, frameThickness);
  const topBar = new THREE.Mesh(topBarGeo, frameMat);
  topBar.position.set(0, 0.75, 0.02);
  boardGroup.add(topBar);

  // Barre horizontale basse
  const bottomBarGeo = new THREE.PlaneGeometry(frameWidth, frameThickness);
  const bottomBar = new THREE.Mesh(bottomBarGeo, frameMat);
  bottomBar.position.set(0, -0.75, 0.02);
  boardGroup.add(bottomBar);

  // Barre verticale gauche
  const leftBarGeo = new THREE.PlaneGeometry(frameThickness, frameHeight);
  const leftBar = new THREE.Mesh(leftBarGeo, frameMat);
  leftBar.position.set(-frameWidth / 2, 0, 0.02);
  boardGroup.add(leftBar);

  // Barre verticale droite
  const rightBarGeo = new THREE.PlaneGeometry(frameThickness, frameHeight);
  const rightBar = new THREE.Mesh(rightBarGeo, frameMat);
  rightBar.position.set(frameWidth / 2, 0, 0.02);
  boardGroup.add(rightBar);

  // Plane vidéo portrait 9:16 (légèrement plus bas pour laisser la place au bandeau texte en haut)
  const videoGeo = new THREE.PlaneGeometry(0.9, 1.6);
  const videoMat = new THREE.MeshBasicMaterial({
    map: videoTexture,
    side: THREE.DoubleSide
  });
  videoPlane = new THREE.Mesh(videoGeo, videoMat);
  videoPlane.position.set(0, -0.1, 0.01); // décalé un peu vers le bas
  boardGroup.add(videoPlane);

  // Plane infos (bandeau texte) AU-DESSUS de la vidéo
  const infoGeo = new THREE.PlaneGeometry(0.9, 0.4);
  infoTexture = new THREE.CanvasTexture(infoCanvas);
  const infoMat = new THREE.MeshBasicMaterial({
    map: infoTexture,
    transparent: true
  });
  infoPlane = new THREE.Mesh(infoGeo, infoMat);
  infoPlane.position.set(0, 0.95, 0.01); // AU-DESSUS de la vidéo
  boardGroup.add(infoPlane);

  scene.add(boardGroup);
}


  function onSelect() {
    if (!reticle.visible || !videoTexture) return;

    createBoardIfNeeded();

    // Positionner le panneau 3D sur la pose détectée
    boardGroup.position.setFromMatrixPosition(reticle.matrix);

    // Orientation : panneau vertical, pivot Y uniquement
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);

    const objPos = new THREE.Vector3();
    boardGroup.getWorldPosition(objPos);

    const dir = new THREE.Vector3().subVectors(camPos, objPos);
    const angleY = Math.atan2(dir.x, dir.z);

    boardGroup.rotation.set(0, angleY, 0);
  }

  // ------- Gestion des vidéos + métadonnées -------

  function parseUrlParamsAndLoadVideos() {
    const params = new URLSearchParams(window.location.search);

    // 1) Mode multi : ?videos=url1,url2,url3
    const videosParam = params.get('videos');

    if (videosParam) {
      videos = videosParam.split(',').map(v => v.trim()).filter(v => v.length > 0);
    } else {
      // 2) Compat ancien : ?video=...
      const videoUrl = params.get('video');
      if (videoUrl) {
        videos = [videoUrl];
      }
    }

    // Métadonnées parallèles (même nombre que videos) - optionnel
    usernames = parseListParam(params.get('usernames'), videos.length, 'Utilisateur');
    dates = parseListParam(params.get('dates'), videos.length, 'Date inconnue');
    likesList = parseNumberListParam(params.get('likes'), videos.length, 0);
    viewsList = parseNumberListParam(params.get('views'), videos.length, 0);

    document.getElementById('video-count').textContent =
      videos.length > 0
        ? `Vidéo 1/${videos.length}`
        : 'Aucune vidéo';

    updateNavButtonsState();
  }

  function parseListParam(param, targetLength, defaultValue) {
    if (!param) return new Array(targetLength).fill(defaultValue);
    const arr = param.split(',').map(v => v.trim());
    while (arr.length < targetLength) arr.push(defaultValue);
    return arr.slice(0, targetLength);
  }

  function parseNumberListParam(param, targetLength, defaultValue) {
    if (!param) return new Array(targetLength).fill(defaultValue);
    const arr = param.split(',').map(v => parseInt(v.trim(), 10) || defaultValue);
    while (arr.length < targetLength) arr.push(defaultValue);
    return arr.slice(0, targetLength);
  }

  function setupVideoElement() {
    videoElement = document.getElementById('video');
    if (!videoElement) return;

    videoElement.addEventListener('ended', () => {
      videoElement.currentTime = 0;
      videoElement.play().catch(() => {});
    });

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.encoding = THREE.sRGBEncoding;
  }

  function setupInfoCanvas() {
    infoCanvas = document.createElement('canvas');
    infoCanvas.width = 512;
    infoCanvas.height = 256;
    infoCtx = infoCanvas.getContext('2d');
    drawInfoText(0); // initial
  }

  function drawInfoText(index) {
    if (!infoCtx) return;

    const username = usernames[index] || 'Utilisateur';
    const date = dates[index] || 'Date inconnue';
    const likes = likesList[index] ?? 0;
    const views = viewsList[index] ?? 0;

    infoCtx.clearRect(0, 0, infoCanvas.width, infoCanvas.height);

    // Fond arrondi sombre
    infoCtx.fillStyle = 'rgba(0,0,0,0.75)';
    const r = 28;
    const w = infoCanvas.width - 40;
    const h = infoCanvas.height - 40;
    const x = 20;
    const y = 20;
    infoCtx.beginPath();
    infoCtx.moveTo(x + r, y);
    infoCtx.lineTo(x + w - r, y);
    infoCtx.quadraticCurveTo(x + w, y, x + w, y + r);
    infoCtx.lineTo(x + w, y + h - r);
    infoCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    infoCtx.lineTo(x + r, y + h);
    infoCtx.quadraticCurveTo(x, y + h, x, y + h - r);
    infoCtx.lineTo(x, y + r);
    infoCtx.quadraticCurveTo(x, y, x + r, y);
    infoCtx.closePath();
    infoCtx.fill();

    infoCtx.fillStyle = '#ffffff';
    infoCtx.font = 'bold 32px system-ui';
    infoCtx.textBaseline = 'top';

    infoCtx.fillText(username, 40, 40);

    infoCtx.font = '24px system-ui';
    infoCtx.fillStyle = '#cccccc';
    infoCtx.fillText(date, 40, 86);

    infoCtx.fillStyle = '#ffffff';
    infoCtx.font = '26px system-ui';
    infoCtx.fillText(`❤️ ${likes}`, 40, 140);
    infoCtx.fillText(`👁 ${views}`, 220, 140);

    if (infoTexture) {
      infoTexture.needsUpdate = true;
    }
  }

  function loadVideo(index) {
    if (!videos || videos.length === 0) return;
    if (index < 0 || index >= videos.length) return;

    currentIndex = index;

    if (!videoElement) {
      videoElement = document.getElementById('video');
    }

    const url = videos[index];
    videoElement.src = url;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent =
      videos.length > 1
        ? 'Flèches pour changer de vidéo à ce spot.'
        : 'Vidéo depuis UrbainAR (une seule vidéo).';

    document.getElementById('video-count').textContent =
      `Vidéo ${index + 1}/${videos.length}`;

    drawInfoText(index);
    updateNavButtonsState();

    console.log('▶️ Vidéo chargée index', index, url);
  }

  function updateNavButtonsState() {
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    if (!btnPrev || !btnNext) return;

    if (videos.length <= 1) {
      btnPrev.disabled = true;
      btnNext.disabled = true;
    } else {
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === videos.length - 1;
    }
  }

  function playCurrentVideo() {
    if (!videoElement) return;
    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  // Navigation
  window.nextVideo = function () {
    if (currentIndex < videos.length - 1) {
      loadVideo(currentIndex + 1);
      playCurrentVideo();
    }
  };

  window.prevVideo = function () {
    if (currentIndex > 0) {
      loadVideo(currentIndex - 1);
      playCurrentVideo();
    }
  };

  // Toggle son
  window.toggleSound = function () {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  };

  // Fermer
  window.closeAr = function () {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  };

  // Fallback : premier tap écran → autoriser play() sur Android
  window.addEventListener('click', () => {
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  // Boucle de rendu WebXR
  function render(timestamp, frame) {
    const session = renderer.xr.getSession();
    if (session && hitTestSourceRequested && hitTestSource && frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  }

  // Démarrage
  if (!('xr' in navigator)) {
    document.getElementById('video-meta').textContent =
      "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
    console.error("navigator.xr non disponible");
  } else {
    init();
  }
</script>

</body>
</html>
