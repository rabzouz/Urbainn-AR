<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UrbainAR – Réalité Augmentée Urbaine</title>
  <meta name="description" content="Découvrez les vidéos AR géolocalisées dans votre ville avec UrbainAR." />
  <meta property="og:title" content="UrbainAR – Vidéo AR" />
  <meta property="og:description" content="Regardez cette vidéo en réalité augmentée sur UrbainAR." />
  <meta property="og:image" content="https://webar.urbainar.com/og-preview.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0B0B1A;
      --surface:  #12122A;
      --surface2: #1A1A3A;
      --accent:   #7B61FF;
      --accent2:  #FF4D8D;
      --text:     #FFFFFF;
      --text2:    #A0A0C8;
      --text3:    #606080;
      --radius:   20px;
      --shadow:   0 8px 40px rgba(123,97,255,.22);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Barre de chargement haut de page (style YouTube) ───────── */
    #top-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      z-index: 9999;
      transition: width .3s ease, opacity .4s ease;
      border-radius: 0 2px 2px 0;
    }
    #top-bar.done { width: 100% !important; opacity: 0; }

    /* ── Fond dégradé ambiant ───────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(123,97,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(255,77,141,.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 48px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }

    /* Logo icône SVG — pin AR */
    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(145deg, #5B41FF, #A040C0);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(123,97,255,.45), inset 0 1px 0 rgba(255,255,255,.15);
    }

    .logo-text-wrap { display: flex; flex-direction: column; gap: 1px; }

    .logo-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }

    .logo-sub {
      font-size: 9px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .badge-ar {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      border: 1.5px solid rgba(123,97,255,.5);
      border-radius: 8px;
      padding: 5px 11px;
      background: rgba(123,97,255,.08);
      backdrop-filter: blur(4px);
    }

    /* ── Card vidéo ─────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(123,97,255,.20);
      box-shadow: var(--shadow);
      margin-top: 8px;
    }

    /* Barre titre */
    .card-title-bar {
      padding: 16px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .title-pill {
      margin-top: 2px;
      width: 4px;
      height: 36px;
      border-radius: 4px;
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
      flex-shrink: 0;
    }

    .card-title-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }

    .card-author {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ── Wrapper vidéo ──────────────────────────────────────────── */
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      min-height: 200px;
    }

    .video-wrapper video {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: #000;
    }

    /* Overlay play manuel */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.42);
      cursor: pointer;
      transition: opacity .2s;
    }
    .play-overlay.hidden { display: none; }

    .play-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: rgba(123,97,255,.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 28px rgba(123,97,255,.55);
      transition: transform .15s, background .15s;
    }
    .play-btn:hover { transform: scale(1.08); background: rgba(123,97,255,1); }
    .play-btn svg { margin-left: 5px; }

    /* ── Spinner de chargement vidéo ────────────────────────────── */
    #video-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(11,11,26,.85);
      gap: 14px;
      transition: opacity .3s;
      z-index: 10;
    }
    #video-loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(123,97,255,.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label {
      font-size: 13px;
      color: var(--text2);
      letter-spacing: .3px;
    }

    /* Barre progression buffer */
    #buffer-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,.08);
      z-index: 5;
    }
    #buffer-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .4s ease;
      border-radius: 0 2px 2px 0;
    }

    /* ── Tag localisation ───────────────────────────────────────── */
    .location-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      background: rgba(123,97,255,.07);
      border-top: 1px solid rgba(255,255,255,.06);
      font-size: 12px;
      color: var(--text2);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    .location-tag:hover { background: rgba(123,97,255,.13); }
    .location-tag .coords { font-family: 'Courier New', monospace; color: var(--text3); font-size: 11px; }

    /* ── Ligne stats ─────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.06);
    }
    .stat .emoji { font-size: 14px; }

    /* ── Section AR ──────────────────────────────────────────────── */
    .ar-section {
      width: 100%;
      max-width: 600px;
      margin-top: 16px;
      background: linear-gradient(145deg, rgba(123,97,255,.10), rgba(255,77,141,.06));
      border: 1px solid rgba(123,97,255,.22);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      text-align: center;
    }

    .ar-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(123,97,255,.25), rgba(255,77,141,.15));
      border: 1px solid rgba(123,97,255,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 30px;
    }

    .ar-section h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -.2px;
    }

    .ar-section p {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 22px;
      line-height: 1.65;
    }

    /* ── Boutons store ───────────────────────────────────────────── */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      height: 52px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }

    /* Shimmer sur hover */
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.12) 50%, transparent 65%);
      transform: translateX(-100%);
      transition: transform .45s ease;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(0px) scale(.97); }

    .btn-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .btn-store-label { font-size: 10px; font-weight: 500; opacity: .75; letter-spacing: .4px; }
    .btn-store-name  { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }

    .btn-android {
      background: linear-gradient(135deg, #34A853, #1e7e34);
      color: #fff;
      box-shadow: 0 4px 20px rgba(52,168,83,.35);
    }
    .btn-android:hover { box-shadow: 0 8px 32px rgba(52,168,83,.5); }

    .btn-ios {
      background: linear-gradient(135deg, #1C1C1E, #3A3A3C);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
    }
    .btn-ios:hover { box-shadow: 0 8px 32px rgba(0,0,0,.5); }

    /* ── Erreur ─────────────────────────────────────────────────── */
    .error-card {
      width: 100%;
      max-width: 600px;
      margin-top: 40px;
      background: rgba(255,77,77,.08);
      border: 1px solid rgba(255,77,77,.25);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
    }
    .error-card .err-emoji { font-size: 48px; margin-bottom: 12px; }
    .error-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .error-card p  { font-size: 14px; color: var(--text2); line-height: 1.6; }

    /* ── Footer ─────────────────────────────────────────────────── */
    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text3);
      line-height: 1.9;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Skeleton loader ─────────────────────────────────────────── */
    .skeleton-card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(123,97,255,.12);
      margin-top: 8px;
    }
    .sk { background: linear-gradient(90deg, var(--surface2) 25%, #22224A 50%, var(--surface2) 75%);
          background-size: 200% 100%;
          animation: shimmer 1.4s infinite;
          border-radius: 8px; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 420px) {
      .logo-text { font-size: 17px; }
      .btn-group { flex-direction: column; align-items: stretch; }
      .btn { justify-content: center; }
      .btn-inner { align-items: center; }
    }
  </style>
</head>
<body>

<!-- Barre de chargement haut de page -->
<div id="top-bar"></div>

<div class="page">

  <!-- Header -->
  <header>
    <a class="logo" href="https://urbainar.com">
      <div class="logo-icon">
        <!-- Icône AR / pin géolocalisation -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white" opacity=".95"/>
          <circle cx="12" cy="9" r="2.8" fill="#5B41FF"/>
          <!-- Lignes AR -->
          <line x1="2" y1="4" x2="5.5" y2="6.5" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
          <line x1="22" y1="4" x2="18.5" y2="6.5" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
        </svg>
      </div>
      <div class="logo-text-wrap">
        <div class="logo-text">UrbainAR</div>
        <div class="logo-sub">Réalité Augmentée</div>
      </div>
    </a>
    <span class="badge-ar">WebAR</span>
  </header>

  <!-- Contenu injecté par JS -->
  <div id="content">
    <!-- Skeleton loader visible au démarrage -->
    <div class="skeleton-card" id="skeleton">
      <div style="padding:16px 20px 14px; display:flex; gap:12px; align-items:flex-start">
        <div class="sk" style="width:4px; height:40px; border-radius:4px; flex-shrink:0"></div>
        <div style="flex:1; display:flex; flex-direction:column; gap:8px">
          <div class="sk" style="height:16px; width:70%"></div>
          <div class="sk" style="height:12px; width:40%"></div>
        </div>
      </div>
      <div class="sk" style="height:260px; border-radius:0; margin:0"></div>
      <div style="padding:14px 20px; display:flex; gap:8px">
        <div class="sk" style="height:32px; width:80px"></div>
        <div class="sk" style="height:32px; width:80px"></div>
        <div class="sk" style="height:32px; width:80px"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div>© 2025 UrbainAR · <a href="https://urbainar.com/privacy">Confidentialité</a> · <a href="https://urbainar.com/terms">CGU</a></div>
    <div style="margin-top:4px">Partagé depuis l'application UrbainAR</div>
  </footer>
</div>

<script>
// ── Barre de progression top ──────────────────────────────────────
const topBar = document.getElementById('top-bar');
let barPct = 0;
const barTimer = setInterval(() => {
  barPct = Math.min(barPct + (barPct < 40 ? 8 : barPct < 70 ? 4 : 1), 90);
  topBar.style.width = barPct + '%';
}, 120);
function finishTopBar() {
  clearInterval(barTimer);
  topBar.style.width = '100%';
  setTimeout(() => topBar.classList.add('done'), 300);
}

// ── Parse URL params ──────────────────────────────────────────────
const params   = new URLSearchParams(location.search);
const videoUrl = params.get('video') || '';
const lat      = parseFloat(params.get('lat')  || '0');
const lng      = parseFloat(params.get('lng')  || '0');
const thumbUrl = params.get('thumb') || '';
let   title    = params.get('title') || extractTitleFromUrl(videoUrl);

function extractTitleFromUrl(url) {
  try {
    const parts = decodeURIComponent(url).split('/');
    const file  = parts[parts.length - 1].replace(/\.[^.]+$/, '');
    const slug  = file.replace(/^[^_]*_[^_]*_?/, '').replace(/[-_]/g, ' ').trim();
    if (slug.length > 2) return slug.charAt(0).toUpperCase() + slug.slice(1);
  } catch (_) {}
  return 'Vidéo UrbainAR';
}

function formatCoords(lat, lng) {
  if (!lat && !lng) return null;
  return `${Math.abs(lat).toFixed(5)}${lat>=0?'°N':'°S'}, ${Math.abs(lng).toFixed(5)}${lng>=0?'°E':'°O'}`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boutons store ─────────────────────────────────────────────────
const BTN_ANDROID = `
  <a class="btn btn-android"
     href="https://play.google.com/store/apps/details?id=com.example.urbainar"
     target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
      <path d="M3.18 23.76a2 2 0 0 0 2.73.74l9.4-5.42-2.53-2.53-9.6 7.21zM20.76 10.36 17.6 8.5l-2.82 2.82 2.82 2.82 3.18-1.88a1.5 1.5 0 0 0 0-2.9zM2 1.24A1.5 1.5 0 0 0 1.5 2.5v19a1.5 1.5 0 0 0 .5 1.26l.1.07 10.64-10.64v-.26L2.1 1.17 2 1.24zm12.68 9.08L4.04 0.6l-.04-.03A2 2 0 0 0 1.27.37l12.26 9.2-.85.75z"/>
    </svg>
    <div class="btn-inner">
      <span class="btn-store-label">Disponible sur</span>
      <span class="btn-store-name">Google Play</span>
    </div>
  </a>`;

const BTN_IOS = `
  <a class="btn btn-ios"
     href="https://apps.apple.com"
     target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
      <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
    </svg>
    <div class="btn-inner">
      <span class="btn-store-label">Bientôt sur</span>
      <span class="btn-store-name">App Store</span>
    </div>
  </a>`;

// ── Rendu principal ───────────────────────────────────────────────
const content = document.getElementById('content');

if (!videoUrl) {
  // Page d'accueil sans vidéo
  document.getElementById('skeleton').remove();
  finishTopBar();
  content.innerHTML = `
    <div class="ar-section" style="margin-top:24px; padding:40px 24px">
      <div class="ar-icon-wrap">🌆</div>
      <h2>Bienvenue sur UrbainAR</h2>
      <p>Explorez et partagez des vidéos en réalité augmentée géolocalisées dans les rues de votre ville.</p>
      <div class="btn-group">${BTN_ANDROID}${BTN_IOS}</div>
    </div>`;
} else {
  const coords     = formatCoords(lat, lng);
  const coordsHtml = coords
    ? `<a class="location-tag" href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">
         <span>📍</span>
         <span>Voir sur la carte</span>
         <span class="coords">${coords}</span>
       </a>`
    : '';

  const posterAttr = thumbUrl ? ` poster="${escHtml(thumbUrl)}"` : '';

  // Remplace le skeleton par la vraie carte
  document.getElementById('skeleton').outerHTML = `
    <div class="card">
      <div class="card-title-bar">
        <div class="title-pill"></div>
        <div class="card-title-text">
          <h1 id="video-title">${escHtml(title)}</h1>
          <div class="card-author">
            <span>📍</span>
            <span>Partagé depuis UrbainAR</span>
          </div>
        </div>
      </div>

      <div class="video-wrapper">
        <video id="vid" controls playsinline preload="auto"${posterAttr}>
          <source id="vid-src" src="${escHtml(videoUrl)}" type="video/mp4" />
          Votre navigateur ne supporte pas la lecture vidéo.
        </video>

        <!-- Spinner de chargement -->
        <div id="video-loading">
          <div class="spinner"></div>
          <div class="loading-label">Chargement de la vidéo…</div>
        </div>

        <!-- Barre de buffer -->
        <div id="buffer-bar-wrap"><div id="buffer-bar"></div></div>

        <!-- Overlay play -->
        <div class="play-overlay hidden" id="play-overlay">
          <div class="play-btn" onclick="playVideo()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>

      ${coordsHtml}

      <div class="stats-row">
        <div class="stat"><span class="emoji">👁</span> <span id="stat-views">–</span></div>
        <div class="stat"><span class="emoji">❤️</span> <span id="stat-likes">–</span></div>
        <div class="stat"><span class="emoji">💬</span> <span id="stat-comments">–</span></div>
      </div>
    </div>

    <div class="ar-section">
      <div class="ar-icon-wrap">📱</div>
      <h2>Vivre en Réalité Augmentée</h2>
      <p>Téléchargez UrbainAR pour voir cette vidéo en AR directement dans les rues de votre ville.</p>
      <div class="btn-group">${BTN_ANDROID}${BTN_IOS}</div>
    </div>`;

  const vid = document.getElementById('vid');

  // ── Gestion du chargement / buffering ──────────────────────────
  function hideLoader() {
    const loader = document.getElementById('video-loading');
    if (loader) loader.classList.add('hidden');
  }
  function showLoader() {
    const loader = document.getElementById('video-loading');
    if (loader) loader.classList.remove('hidden');
  }

  // Dès que la vidéo peut jouer → masquer le spinner
  vid.addEventListener('canplay',  () => { hideLoader(); finishTopBar(); });
  vid.addEventListener('playing',  () => hideLoader());
  vid.addEventListener('waiting',  () => showLoader());           // re-buffering
  vid.addEventListener('loadstart',() => showLoader());
  vid.addEventListener('error',    () => {
    hideLoader(); finishTopBar();
    document.getElementById('video-loading').innerHTML =
      '<div style="font-size:32px">⚠️</div>' +
      '<div class="loading-label" style="color:#FF6B6B">Impossible de charger la vidéo</div>';
    document.getElementById('video-loading').classList.remove('hidden');
  });

  // Barre de buffer
  function updateBufferBar() {
    if (!vid.buffered.length) return;
    const pct = (vid.buffered.end(vid.buffered.length - 1) / vid.duration) * 100;
    const bar = document.getElementById('buffer-bar');
    if (bar) bar.style.width = Math.min(pct, 100) + '%';
  }
  vid.addEventListener('progress', updateBufferBar);
  vid.addEventListener('timeupdate', updateBufferBar);

  // Overlay play/pause
  vid.addEventListener('play',  () => document.getElementById('play-overlay').classList.add('hidden'));
  vid.addEventListener('pause', () => document.getElementById('play-overlay').classList.remove('hidden'));
  vid.addEventListener('ended', () => document.getElementById('play-overlay').classList.remove('hidden'));

  // Tentative autoplay muet
  vid.muted = true;
  vid.play().then(() => {
    vid.muted = false;
    document.getElementById('play-overlay').classList.add('hidden');
  }).catch(() => {
    // Autoplay bloqué → montrer le bouton play après canplay
    vid.addEventListener('canplay', () => {
      document.getElementById('play-overlay').classList.remove('hidden');
    }, { once: true });
  });

  // Stats Firestore REST
  loadFirestoreStats(videoUrl);
}

// ── Play manuel ───────────────────────────────────────────────────
function playVideo() {
  const vid = document.getElementById('vid');
  if (!vid) return;
  vid.muted = false;
  vid.play();
}

// ── Stats Firestore (API REST publique) ───────────────────────────
async function loadFirestoreStats(videoUrl) {
  const PROJECT = 'urbainar';
  try {
    const res = await fetch(
      `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredQuery: {
            from:  [{ collectionId: 'videos' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'videoUrl' },
                op:    'EQUAL',
                value: { stringValue: videoUrl }
              }
            },
            limit: 1
          }
        })
      }
    );
    const data = await res.json();
    const doc  = data?.[0]?.document?.fields;
    if (doc) {
      document.getElementById('stat-views').textContent = doc.views?.integerValue || doc.views?.doubleValue || '0';
      document.getElementById('stat-likes').textContent = doc.likes?.integerValue || doc.likes?.doubleValue || '0';

      // Mettre à jour le titre si présent dans Firestore et non passé en paramètre
      const fsTitle = doc.title?.stringValue;
      if (fsTitle && !params.get('title')) {
        document.getElementById('video-title').textContent = fsTitle;
      }
    }
  } catch (_) {}

  // Nombre de commentaires
  try {
    const docSnap = await fetch(
      `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredQuery: {
            from:  [{ collectionId: 'comments' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'videoId' },
                op:    'EQUAL',
                value: { stringValue: videoUrl } // fallback par URL si pas d'ID
              }
            },
            limit: 1
          }
        })
      }
    );
    const cData = await docSnap.json();
    const count = Array.isArray(cData) ? cData.filter(d => d.document).length : 0;
    document.getElementById('stat-comments').textContent = count;
  } catch (_) {}
}
</script>
