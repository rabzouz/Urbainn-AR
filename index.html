<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR (toutes vidéos)</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }
      #playWithSound {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 20px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 12px;
        max-width: 80%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      div.a-enter-vr, div.a-enter-ar { display: none !important; }
    </style>
  </head>
  <body>
    <div id="info">
      Chargement de la vidéo...
    </div>
    <button id="playWithSound">Activer le son</button>

    <a-scene
      embedded
      xr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
      <a-assets>
        <!-- La SRC sera mise à jour depuis ?video=... -->
        <video
          id="video-texture"
          src=""
          loop="true"
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera></a-camera>

      <!-- Panneau vidéo devant la caméra, avec zoom au pinch -->
      <a-video
        id="video-plane"
        src="#video-texture"
        position="0 1.5 -8"
        rotation="0 0 0"
        width="1.5"
        height="0.9"
        gesture-handler="minScale: 0.2; maxScale: 2"
      ></a-video>
    </a-scene>

    <script>
      const vid   = document.getElementById("video-texture");
      const btn   = document.getElementById("playWithSound");
      const plane = document.getElementById("video-plane");
      const info  = document.getElementById("info");

      // 1) Lire ?video=... dans l'URL (envoyé par l'app Android)
      let videoUrl = null;
      try {
        const params = new URLSearchParams(window.location.search);
        const videoParam = params.get("video");
        if (videoParam) {
          videoUrl = decodeURIComponent(videoParam);
          vid.src = videoUrl;
          info.textContent = "Vidéo chargée. Autorise la caméra, puis appuie sur Activer le son.";
        } else {
          info.textContent = "Paramètre ?video= manquant dans l'URL.";
        }
      } catch (e) {
        console.log("Erreur lecture paramètre video:", e);
        info.textContent = "Erreur de lecture du paramètre vidéo.";
      }

      // 2) Ajuster le ratio du panneau dès que les métadonnées sont connues
      vid.addEventListener("loadedmetadata", () => {
        const vw = vid.videoWidth;
        const vh = vid.videoHeight;
        if (!vw || !vh || !plane) return;

        const baseWidth = 1.5;
        const aspect    = vh / vw;
        const finalWidth  = baseWidth;
        const finalHeight = baseWidth * aspect;

        plane.setAttribute("width", finalWidth);
        plane.setAttribute("height", finalHeight);
      });

      // 3) Démarrage muet quand la scène est prête
      document.querySelector("a-scene").addEventListener("loaded", () => {
        if (!videoUrl) return;
        vid.muted = true;
        vid.play().then(() => {
          const mesh = plane.getObject3D("mesh");
          if (mesh && mesh.material && mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        }).catch(err => console.log("autoplay error:", err));
      });

      // 4) Bouton pour activer le son
      btn.addEventListener("click", () => {
        if (!videoUrl) return;
        vid.muted = false;
        vid.play().catch(err => console.log("play error:", err));
        btn.style.display = "none";
      });
    </script>
  </body>
</html>
