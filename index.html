<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <style>
    :root{
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);

      --glass: rgba(8, 16, 38, 0.82);
      --glass-light: rgba(16, 28, 60, 0.72);

      --text: rgba(255,255,255,0.96);
      --muted: rgba(180,210,255,0.78);

      --accent: #6ee7ff;
      --accent2: #60a5fa;
      --accent3: #a78bfa;

      --gradient: linear-gradient(135deg, #6ee7ff 0%, #60a5fa 100%);
      --gradient-purple: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      --gradient-vivid: linear-gradient(135deg, #00f5ff 0%, #6ee7ff 40%, #a78bfa 100%);

      --neon: 0 0 14px rgba(110,231,255,0.55), 0 0 30px rgba(96,165,250,0.28);
      --neon-soft: 0 0 10px rgba(110,231,255,0.30), 0 0 22px rgba(96,165,250,0.18);
      --shadow: 0 14px 38px rgba(0,0,0,0.60), 0 2px 8px rgba(0,0,0,0.40);
      --shadow-glow: 0 8px 28px rgba(96,165,250,0.35), 0 2px 10px rgba(0,0,0,0.50);

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;

      --border-glass: 1px solid rgba(110,231,255,0.14);
      --border-bright: 1px solid rgba(110,231,255,0.30);

      --sheet-peek: 168px;
    }

    html, body { height: 100%; }
    body{
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 40% 0%, #0b1a35 0%, #020608 70%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    canvas{ display:block; }

    #xr-overlay{
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }
    .ui{ pointer-events: auto; }

    /* ===== TOP BAR ===== */
    #video-info {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 12px;
      right: 72px;
      background: rgba(5, 10, 26, 0.92);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      color: #fff;
      padding: 13px 16px 13px 20px;
      border-radius: var(--radius-lg);
      z-index: 30;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid rgba(110,231,255,0.20);
      box-shadow: var(--shadow), 0 0 18px rgba(96,165,250,0.22);
      position: fixed;

      /* gradient left bar */
      border-left: 3px solid transparent;
      background-clip: padding-box;
      position: fixed;
    }
    /* Gradient left accent border via pseudo */
    #video-info::before {
      content: '';
      position: absolute;
      left: 0; top: 10%; bottom: 10%;
      width: 3px;
      border-radius: 999px;
      background: var(--gradient);
      box-shadow: var(--neon);
    }

    #video-username {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
      background: var(--gradient-vivid);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      filter: drop-shadow(0 0 8px rgba(110,231,255,0.35));
    }
    #video-meta {
      font-size: 13px;
      opacity: 0.92;
      color: rgba(200, 225, 255, 0.90);
      margin-top: 0px;
      font-weight: 500;
    }
    #video-stats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
    }
    .stat-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      background: rgba(110,231,255,0.11);
      border: 1px solid rgba(110,231,255,0.22);
      border-radius: 999px;
      padding: 5px 13px;
      white-space: nowrap;
    }
    .stat-chip .chip-icon { font-size: 14px; line-height: 1; }
    .stat-chip .chip-val  { letter-spacing: 0.3px; }
    #chip-date .chip-val  { color: rgba(180,210,255,0.95); font-weight: 600; font-size: 12px; }
    #chip-likes .chip-icon { color: #ff6b8a; }
    #chip-likes .chip-val  { color: #ffb3c1; }
    #chip-views .chip-icon { color: var(--accent); }
    #chip-views .chip-val  { color: var(--accent2); }
    #video-count {
      font-size: 11px;
      opacity: 0.7;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ===== CLOSE BUTTON ===== */
    #top-right {
      position: fixed;
      top: calc(10px + var(--safe-top));
      right: 10px;
      z-index: 40;
    }
    #btn-close {
      width: 50px;
      height: 50px;
      border-radius: 999px;
      border: 1px solid rgba(110,231,255,0.22);
      background: rgba(5, 10, 26, 0.88);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow), var(--neon-soft);
      transition: transform 120ms ease, box-shadow 150ms ease;
    }
    #btn-close:active {
      transform: scale(0.92);
      box-shadow: var(--neon);
    }

    /* ===== CONTROLS DOCK ===== */
    #controls-dock{
      position: fixed;
      right: 14px;
      left: auto;
      top: 50%;
      bottom: auto;
      transform: translateY(-50%);
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      border-radius: 22px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: var(--border-glass);
      box-shadow: var(--shadow), var(--neon-soft);
    }

    #controls-dock button{
      width: 52px;
      height: 52px;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      background: rgba(110,231,255,0.12);
      border: 1px solid rgba(110,231,255,0.20);
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: background 150ms ease, transform 120ms ease, box-shadow 150ms ease;
    }
    #controls-dock button:hover {
      background: rgba(110,231,255,0.20);
      box-shadow: var(--neon-soft);
    }
    #controls-dock button:active {
      transform: scale(0.91);
      background: rgba(110,231,255,0.28);
      box-shadow: var(--neon);
    }
    #controls-dock button:disabled{
      opacity: 0.28;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* mini loader */
    #mini-loader{
      width: 16px; height: 16px;
      border-radius: 999px;
      border: 2.5px solid rgba(110,231,255,0.20);
      border-top-color: var(--accent);
      animation: spin 700ms linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== VOLUME RAIL ===== */
    #volume-edge{
      position: fixed;
      top: 0; left: 0;
      width: 22px;
      height: 100vh;
      z-index: 60;
      pointer-events: auto;
      background: transparent;
    }

    #volume-rail{
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 61;
      width: 52px;
      height: 250px;
      border-radius: 999px;
      background: var(--glass);
      border: var(--border-glass);
      box-shadow: var(--shadow), var(--neon-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
      pointer-events: auto;
    }
    #volume-rail.open{ display:flex; }

    #volume-slider{
      writing-mode: vertical-lr;
      direction: rtl;
      height: 200px;
      width: 20px;
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent);
    }
    #volume-slider::-webkit-slider-runnable-track{
      background: linear-gradient(to top, var(--accent2) 0%, rgba(255,255,255,0.15) 100%);
      border-radius: 999px;
      width: 6px;
    }
    #volume-slider::-webkit-slider-thumb{
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--gradient);
      box-shadow: 0 3px 10px rgba(0,0,0,0.50), var(--neon-soft);
      cursor: pointer;
    }
    #volume-slider::-moz-range-track{
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      width: 6px;
    }
    #volume-slider::-moz-range-thumb{
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 999px;
      background: var(--gradient);
      box-shadow: 0 3px 10px rgba(0,0,0,0.50);
      cursor: pointer;
    }

    /* ===== AR BUTTON ===== */
    #ARButton {
      position: fixed !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      bottom: calc(var(--sheet-peek) + 16px + var(--safe-bottom)) !important;
      z-index: 38 !important;
      border: 0 !important;
      padding: 15px 22px !important;
      border-radius: 999px !important;
      color: #040e1c !important;
      font-weight: 900 !important;
      letter-spacing: 0.4px !important;
      background: var(--gradient) !important;
      box-shadow: 0 0 28px rgba(110,231,255,0.55), 0 0 55px rgba(96,165,250,0.28), 0 14px 32px rgba(0,0,0,0.55) !important;
      min-width: 180px !important;
      font-size: 15px !important;
      animation: arBtn-float 3s ease-in-out infinite !important;
    }
    @keyframes arBtn-float {
      0%, 100% { transform: translateX(-50%) translateY(0px); }
      50%       { transform: translateX(-50%) translateY(-5px); }
    }

    /* ===== TOAST ===== */
    #toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(80px + var(--safe-top));
      z-index: 80;
      padding: 11px 20px;
      border-radius: 999px;
      background: rgba(5, 10, 26, 0.92);
      border: 1px solid rgba(110,231,255,0.25);
      box-shadow: var(--shadow), 0 0 16px rgba(110,231,255,0.20);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #7ef4ff;
      font-size: 13px;
      font-weight: 600;
      display: none;
      pointer-events: none;
      max-width: 86vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.on{ display:block; }

    /* ===== SCRIM ===== */
    .scrim{
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(2,8,20,.50);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    .scrim.on{
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== BOTTOM SHEET ===== */
    .sheet{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      height: min(74vh, 640px);
      transform: translateY(calc(100% - var(--sheet-peek)));
      transition: transform 240ms cubic-bezier(.32,.72,0,1);
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(8,18,44,0.97) 0%, rgba(4,10,26,0.98) 100%);
      border-top: 1px solid rgba(110,231,255,0.18);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 -20px 50px rgba(0,0,0,0.65), 0 0 30px rgba(96,165,250,0.10);
      overflow: hidden;
      touch-action: none;
    }
    .sheet.expanded{ transform: translateY(0); }

    /* gradient glow strip along top of sheet */
    .sheet::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: var(--gradient);
      opacity: 0.7;
      border-radius: 999px;
    }

    .sheetHeader{
      padding: 8px 16px 12px;
      border-bottom: 1px solid rgba(110,231,255,0.08);
    }
    .grabber{
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: var(--gradient);
      margin: 8px auto 12px;
      opacity: 0.60;
      box-shadow: var(--neon-soft);
    }
    .sheetTopRow{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sheetTitle{ min-width: 0; }
    .sheetTitle b{
      display:block;
      font-size: 16px;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sheetTitle span{
      display:block;
      font-size: 13px;
      color: rgba(200, 225, 255, 0.80);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .sheetBtn{
      border: var(--border-glass);
      background: rgba(110,231,255,0.08);
      color: var(--accent);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 150ms, box-shadow 150ms;
      min-width: 40px;
      text-align: center;
    }
    .sheetBtn:active {
      background: rgba(110,231,255,0.18);
      box-shadow: var(--neon-soft);
    }

    /* ===== CHIP TABS ===== */
    .chipRow{
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chipRow::-webkit-scrollbar { display: none; }

    .chip{
      white-space: nowrap;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 150ms, border-color 150ms, color 150ms, box-shadow 150ms;
    }
    .chip.active{
      border-color: rgba(110,231,255,0.50);
      background: rgba(110,231,255,0.12);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(110,231,255,0.22);
    }

    /* ===== SHEET CONTENT ===== */
    .sheetContent{
      height: calc(100% - 140px);
      overflow: auto;
      padding: 10px 16px calc(20px + var(--safe-bottom));
      scrollbar-width: thin;
      scrollbar-color: rgba(110,231,255,0.20) transparent;
    }
    .sheetContent::-webkit-scrollbar { width: 3px; }
    .sheetContent::-webkit-scrollbar-track { background: transparent; }
    .sheetContent::-webkit-scrollbar-thumb { background: rgba(110,231,255,0.22); border-radius: 999px; }

    .emptyState{
      padding: 16px;
      border-radius: var(--radius-lg);
      border: var(--border-glass);
      background: rgba(110,231,255,0.04);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .emptyState b { color: var(--accent); }

    /* ===== LIST ITEMS ===== */
    .listItem{
      display:flex;
      gap: 12px;
      align-items:center;
      padding: 12px;
      border-radius: var(--radius-lg);
      border: var(--border-glass);
      background: var(--glass-light);
      cursor:pointer;
      margin-bottom: 10px;
      transition: background 160ms, border-color 160ms, box-shadow 160ms, transform 120ms;
    }
    .listItem:active {
      transform: scale(0.98);
      background: rgba(110,231,255,0.10);
      border-color: rgba(110,231,255,0.35);
      box-shadow: var(--neon-soft);
    }
    .listItem.active-item {
      border-color: rgba(110,231,255,0.45);
      background: rgba(110,231,255,0.10);
      box-shadow: var(--neon-soft);
    }

    .thumb{
      width: 58px; height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(110,231,255,.32), rgba(167,139,250,.22));
      border: 1px solid rgba(110,231,255,0.18);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 20px;
      position: relative;
      overflow: hidden;
    }
    .thumb::after {
      content: '▶';
      color: rgba(255,255,255,0.70);
      font-size: 14px;
    }

    .meta{ min-width:0; flex: 1; }
    .meta b{ display:block; font-size: 13px; font-weight: 700; }
    .meta span{
      display:block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== BADGE INDEX ===== */
    .item-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      background: rgba(110,231,255,0.12);
      border: 1px solid rgba(110,231,255,0.25);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    /* ===== VIDEO CARD ROW (proximité) ===== */
    #videoCardRow {
      display: flex;
      gap: 10px;
      padding: 10px 16px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #videoCardRow:empty { display: none; }
    #videoCardRow::-webkit-scrollbar { display: none; }

    .video-card {
      flex: 0 0 110px;
      border-radius: 16px;
      background: rgba(16, 28, 60, 0.85);
      border: 1px solid rgba(110,231,255,0.15);
      cursor: pointer;
      overflow: hidden;
      transition: transform 120ms ease, border-color 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .video-card:active { transform: scale(0.95); }
    .video-card.active-card {
      border-color: rgba(110,231,255,0.55);
      box-shadow: 0 0 18px rgba(110,231,255,0.30), 0 4px 14px rgba(0,0,0,0.45);
    }
    .card-thumb {
      width: 110px;
      height: 72px;
      background: linear-gradient(135deg, rgba(110,231,255,.20), rgba(167,139,250,.16));
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    .card-thumb canvas {
      position: absolute;
      top: 0; left: 0;
      width: 110px; height: 72px;
    }
    .card-play-icon {
      color: rgba(255,255,255,0.82);
      font-size: 22px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65));
    }
    .card-now-playing {
      position: absolute;
      top: 5px; right: 5px;
      background: var(--accent);
      color: #040e1c;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 999px;
      z-index: 2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .card-info {
      padding: 6px 8px 8px;
    }
    .card-username {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-dist {
      font-size: 9px;
      color: var(--accent);
      margin-top: 3px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .card-stats-mini {
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div id="xr-overlay">
    <div id="video-info" class="ui">
      <div id="video-username">Chargement…</div>
      <div id="video-meta">Start AR puis touche l'écran pour placer la vidéo.</div>
      <div id="video-stats">
        <div class="stat-chip" id="chip-date">
          <span class="chip-icon">🕐</span>
          <span class="chip-val" id="video-date">—</span>
        </div>
        <div class="stat-chip" id="chip-likes">
          <span class="chip-icon">❤️</span>
          <span class="chip-val" id="video-likes">0</span>
        </div>
        <div class="stat-chip" id="chip-views">
          <span class="chip-icon">👁</span>
          <span class="chip-val" id="video-views">0</span>
        </div>
      </div>
      <div id="video-count">0 vidéo</div>
    </div>

    <div id="top-right" class="ui">
      <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
    </div>

    <div id="toast"></div>

    <!-- Dock à droite : ⟵ 🔊 ⟶ -->
    <div id="controls-dock" class="ui" aria-label="Contrôles">
      <button id="btn-prev" onclick="prevVideo()" title="Vidéo précédente" disabled>⟵</button>
      <button id="btn-mute" onclick="toggleMute()" title="Muet">🔊</button>
      <button id="btn-next" onclick="nextVideo()" title="Vidéo suivante" disabled>⟶</button>
      <div id="mini-loader" aria-hidden="true"></div>
    </div>

    <!-- Volume: bord gauche -->
    <div id="volume-edge" class="ui" aria-label="Ouvrir le volume"></div>
    <div id="volume-rail" class="ui" aria-label="Volume">
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Contrôle du volume" />
    </div>

    <!-- Bottom sheet -->
    <div class="scrim ui" id="scrim"></div>

    <section class="sheet ui" id="sheet">
      <div class="sheetHeader" id="sheetHeader">
        <div class="grabber"></div>
        <div class="sheetTopRow">
          <div class="sheetTitle">
            <b>Vidéos à proximité</b>
            <span id="sheetSubtitle">Sélectionnez une vidéo, puis Start AR.</span>
          </div>

    // base64url -> utf8
    function decodeBase64UrlToUtf8(b64url){
      const b64 = String(b64url).replace(/-/g, "+").replace(/_/g, "/");
      const pad = b64.length % 4;
      const padded = pad ? (b64 + "=".repeat(4 - pad)) : b64;

      const bin = atob(padded);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      return new TextDecoder("utf-8").decode(bytes);
    }

    // parse payload JSON
    function parsePayloadVideos(payloadStr){
      try{
        const jsonStr = decodeBase64UrlToUtf8(payloadStr);
        const data = JSON.parse(jsonStr);

        const vids = Array.isArray(data?.videos) ? data.videos : [];

        const urls = vids
          .map(v => (v?.url || v?.videoUrl || "").trim())
          .filter(u => u.length > 0);

        const u = vids.map(v => (v?.username || v?.user || "").trim());
        const t = vids.map(v => Number(v?.timestamp || v?.publishedAt || 0));
        const l = vids.map(v => Number(v?.likes || 0));
        const vw = vids.map(v => Number(v?.views || 0));

        return { urls, usernames: u, timestamps: t, likes: l, views: vw };
      } catch (e){
        console.error("payload decode error:", e);
        return { urls: [], usernames: [], timestamps: [], likes: [], views: [] };
      }
    }

    function parseListParam(param, targetLength, defaultValue){
      if (!param) return new Array(targetLength).fill(defaultValue);
      const arr = param.split(',').map(v => v.trim());
      while (arr.length < targetLength) arr.push(defaultValue);
      return arr.slice(0, targetLength);
    }

    function parseNumberListParam(param, targetLength, defaultValue){
      if (!param) return new Array(targetLength).fill(defaultValue);
      const arr = param.split(',').map(v => parseInt(v.trim(), 10) || defaultValue);
      while (arr.length < targetLength) arr.push(defaultValue);
      return arr.slice(0, targetLength);
    }

    // ===== GPS MATH UTILS =====
    function haversineDistance(lat1, lng1, lat2, lng2){
      const R = 6371000; // Earth radius in metres
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2)
              + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
              * Math.sin(dLng/2)*Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearingDeg(lat1, lng1, lat2, lng2){
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const y = Math.sin(dLng) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180)
              - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLng);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function gpsToArXYZ(videoLat, videoLng){
      if (userLat === null || userLng === null) return { x: 0, y: 1.3, z: -3, dist: 0 };
      const dist = haversineDistance(userLat, userLng, videoLat, videoLng);
      const bearing = getBearingDeg(userLat, userLng, videoLat, videoLng);
      const relAngle = (bearing - arStartHeading) * Math.PI / 180;
      const d = 3 + Math.min(dist, 500) / 500 * 4;
      return {
        x: d * Math.sin(relAngle),
        y: 1.3,
        z: -d * Math.cos(relAngle),
        dist: Math.round(dist)
      };
    }

    function parseUrlParamsAndLoadVideos(){
      const params = new URLSearchParams(window.location.search);

      const payload = params.get("payload");
      if (payload) {
        const p = parsePayloadVideos(payload);

        window.videos = p.urls;

        usernames  = p.usernames.length  ? p.usernames  : parseListParam(params.get('usernames'),  window.videos.length, 'UrbainAR');
        timestamps = p.timestamps.length ? p.timestamps : parseNumberListParam(params.get('timestamps'), window.videos.length, 0);
        likesList  = p.likes.length      ? p.likes      : parseNumberListParam(params.get('likes'),      window.videos.length, 0);
        viewsList  = p.views.length      ? p.views      : parseNumberListParam(params.get('views'),      window.videos.length, 0);

      } else {
        const videosParam = params.get('videos');
        if (videosParam) {
          window.videos = videosParam
            .split(',')
            .map(v => v.trim())
            .filter(v => v.length > 0)
            .map(v => {
              try { return decodeURIComponent(v); } catch (_) { return v; }
            });
        } else {
          const videoUrl = params.get('video');
          window.videos = videoUrl ? [videoUrl] : [];
        }

        usernames  = parseListParam(params.get('usernames'),  window.videos.length, 'UrbainAR');
        timestamps = parseNumberListParam(params.get('timestamps'), window.videos.length, 0);
        likesList  = parseNumberListParam(params.get('likes'),      window.videos.length, 0);
        viewsList  = parseNumberListParam(params.get('views'),      window.videos.length, 0);
      }

      document.getElementById('video-count').textContent =
        window.videos.length > 0 ? `Vidéo 1/${window.videos.length}` : 'Aucune vidéo';

      // Parse GPS coordinates if provided
      const latsParam = params.get('lats');
      const lngsParam = params.get('lngs');
      if (latsParam && lngsParam) {
        videoLats = latsParam.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
        videoLngs = lngsParam.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
        if (videoLats.length > 0 && videoLats.length === videoLngs.length
            && videoLats.length === window.videos.length) {
          gpsMode = true;
        }

      updateNavButtonsState();
    }

    // ===== NEARBY VIDEOS FROM SUPABASE =====
    function loadNearbyVideosFromSupabase(){
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          try {
            const uLat = position.coords.latitude;
            const uLng = position.coords.longitude;
            const resp = await fetch(
              SUPABASE_URL + '/rest/v1/videos?select=video_url,user_id,latitude,longitude,like_count,view_count,created_at&order=created_at.desc&limit=50',
              { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON } }
            );
            if (!resp.ok) return;
            const data = await resp.json();
            if (!Array.isArray(data) || data.length === 0) return;
            const nearby = data.filter(v =>
              v.latitude && v.longitude &&
              haversineDistance(uLat, uLng, v.latitude, v.longitude) <= 5000
            );
            if (nearby.length === 0) return;
            window.videos = nearby.map(v => v.video_url);
            usernames  = nearby.map(v => v.user_id || 'UrbainAR');
            likesList  = nearby.map(v => Number(v.like_count) || 0);
            viewsList  = nearby.map(v => Number(v.view_count) || 0);
            timestamps = nearby.map(v => Math.round(new Date(v.created_at).getTime() / 1000));
            videoLats  = nearby.map(v => v.latitude);
            videoLngs  = nearby.map(v => v.longitude);
            userLat = uLat;
            userLng = uLng;
            gpsMode = true;
            const countEl = document.getElementById('video-count');
            if (countEl) countEl.textContent = 'Vidéo 1/' + window.videos.length;
            updateNavButtonsState();
            populateSheetFromVideos();
            loadVideo(0);
            playCurrentVideo();
            const n = window.videos.length;
            toast('📍 ' + n + ' vidéo' + (n > 1 ? 's' : '') + ' à proximité !', 2800);
          } catch(e){ console.warn('Nearby videos error:', e); }
        },
        () => {},
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
      );
    }

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Ambient light – warm cool tint
      scene.add(new THREE.AmbientLight(0x8ecfff, 0.35));

      // Subtle hemisphere light
      scene.add(new THREE.HemisphereLight(0x6ee7ff, 0x001020, 0.20));

      // Reticle – gradient-inspired cyan ring
      const ringGeo = new THREE.RingGeometry(0.05, 0.068, 40).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x6ee7ff });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const overlayRoot = document.getElementById('xr-overlay');
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
        domOverlay: { root: overlayRoot }
      });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', async () => {
        setExpanded(false);

        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        hitTestSourceRequested = true;

        session.addEventListener('end', () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
          toast("Session AR terminée.");
        });

        session.addEventListener('select', onSelect);

        if (gpsMode) {
          setupCompass();
          setTimeout(() => startGPSPlacement(), 600);
          toast("🗺️ Mode GPS – localisation…", 2000);
        } else if (window.videos.length > 1) {
          setTimeout(() => startAutoPlacement(), 500);
          toast("📺 " + window.videos.length + " vidéos – placement en cours…", 1800);
        } else {
          toast("Session AR démarrée. Touche l’écran pour placer.");
        }
      });

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);

      parseUrlParamsAndLoadVideos();
      setupVideoElement();
      setupFrameVideoElement();
      setupInfoCanvas();
      bindVolumeUI();

      populateSheetFromVideos();

      if (window.videos.length > 0) {
        loadVideo(0);
        playCurrentVideo();
      } else {
        document.getElementById('video-username').textContent = 'UrbainAR';
        document.getElementById('video-meta').textContent = "Reviens depuis la carte UrbainAR (ou passe ?videos=... / ?payload=...).";
        document.getElementById('video-date').textContent  = '—';
        document.getElementById('video-likes').textContent = '0';
        document.getElementById('video-views').textContent = '0';
        document.getElementById('video-count').textContent = '';
      }

      // Démarre la vidéo au premier tap (DOM et WebXR)
      const _resumeOnce = () => {
        tryPlayWithCurrentVolume();
        window.removeEventListener('pointerup', _resumeOnce);
        window.removeEventListener('touchend', _resumeOnce);
        window.removeEventListener('click',    _resumeOnce);
      };
      window.addEventListener('pointerup', _resumeOnce);
      window.addEventListener('touchend',  _resumeOnce);
      window.addEventListener('click',     _resumeOnce);

      // Fetch nearby videos from Supabase in background
      loadNearbyVideosFromSupabase();
    }

    function onWindowResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ===== GPS AR FUNCTIONS =====

    function setupCompass(){
      if (typeof DeviceOrientationEvent !== 'undefined'
          && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', _onOrientation, true);
            }
          }).catch(() => {});
      } else {
        window.addEventListener('deviceorientationabsolute', _onOrientation, true);
        window.addEventListener('deviceorientation', _onOrientation, true);
      }
    }

    function _onOrientation(e){
      if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
        compassHeading = e.webkitCompassHeading;
      } else if (e.absolute && e.alpha !== null) {
        compassHeading = (360 - e.alpha) % 360;
      }
    }

    function setupMultiVideoElements(){
      videoEls = [];
      videoTexs = [];
      for (let i = 0; i < window.videos.length; i++) {
        const v = document.createElement('video');
        v.src = window.videos[i];
        v.crossOrigin = 'anonymous';
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        v.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;';
        document.body.appendChild(v);
        v.load();
        const tex = new THREE.VideoTexture(v);
        tex.colorSpace = THREE.SRGBColorSpace;
        videoEls.push(v);
        videoTexs.push(tex);
      }
    }

    function createGPSBoard(idx, pos){
      const group = new THREE.Group();
      group.position.set(pos.x, pos.y, pos.z);
      const scale = Math.max(0.7, Math.min(1.0, 8 / Math.max(pos.dist, 8)));
      group.scale.set(scale, scale, scale);

      const neonMat = new THREE.MeshStandardMaterial({
        color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 1.8,
        metalness: 0.1, roughness: 0.2
      });

      group.add(new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 2.2),
        new THREE.MeshBasicMaterial({ map: frameVideoTexture, side: THREE.DoubleSide })
      ));

      const fw = 1.0, fh = 1.85, ft = 0.048, fd = 0.04;
      [[fw,ft,fd,0,fh/2,fd/2],[fw,ft,fd,0,-fh/2,fd/2],
       [ft,fh,fd,-fw/2,0,fd/2],[ft,fh,fd,fw/2,0,fd/2]].forEach(([bw,bh,bd,bx,by,bz]) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd), neonMat);
        bar.position.set(bx,by,bz);
        group.add(bar);
      });

      const light = new THREE.PointLight(0x6ee7ff, 1.0, 3.5, 2.0);
      light.position.set(0, 0.6, 0.45);
      group.add(light);

      const videoPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 1.6),
        new THREE.MeshBasicMaterial({ map: videoTexs[idx], side: THREE.DoubleSide })
      );
      videoPlane.position.set(0, -0.1, 0.02);
      group.add(videoPlane);

      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = 512; labelCanvas.height = 128;
      const lctx = labelCanvas.getContext('2d');
      lctx.clearRect(0, 0, 512, 128);
      lctx.fillStyle = 'rgba(5,10,26,0.80)';
      const r = 16;
      lctx.beginPath();
      lctx.moveTo(r,0); lctx.lineTo(512-r,0); lctx.quadraticCurveTo(512,0,512,r);
      lctx.lineTo(512,128-r); lctx.quadraticCurveTo(512,128,512-r,128);
      lctx.lineTo(r,128); lctx.quadraticCurveTo(0,128,0,128-r);
      lctx.lineTo(0,r); lctx.quadraticCurveTo(0,0,r,0);
      lctx.closePath(); lctx.fill();
      const uname = usernames[idx] || 'UrbainAR';
      const distLabel = pos.dist >= 1000 ? (pos.dist/1000).toFixed(1)+' km' : pos.dist+' m';
      lctx.font = 'bold 38px system-ui, sans-serif';
      lctx.fillStyle = '#6ee7ff'; lctx.textAlign = 'center';
      lctx.fillText('@' + uname, 256, 52);
      lctx.font = 'bold 28px system-ui, sans-serif';
      lctx.fillStyle = 'rgba(200,225,255,0.90)';
      lctx.fillText('📍 ' + distLabel, 256, 100);
      const labelTex = new THREE.CanvasTexture(labelCanvas);
      const labelPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.22),
        new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, side: THREE.DoubleSide })
      );
      labelPlane.position.set(0, fh/2 + 0.18, 0.04);
      group.add(labelPlane);

      scene.add(group);
      boardGroups[idx] = group;
      return group;
    }

    function startGPSPlacement(){
      if (!gpsMode) return;
      arStartHeading = compassHeading;

      // Position already pre-fetched by loadNearbyVideosFromSupabase
      if (userLat !== null && userLng !== null && videoLats.length > 0) {
        toast('📍 Placement GPS…', 1500);
        setupMultiVideoElements();
        for (let i = 0; i < window.videos.length; i++) {
          createGPSBoard(i, gpsToArXYZ(videoLats[i], videoLngs[i]));
        }
        videoEls.forEach(v => { v.play().catch(() => {}); });
        return;
      }

      // Fallback: request GPS now
      toast('📍 Localisation…', 3000);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          toast('✅ GPS OK…', 2000);
          setupMultiVideoElements();
          for (let i = 0; i < window.videos.length; i++) {
            createGPSBoard(i, gpsToArXYZ(videoLats[i], videoLngs[i]));
          }
          videoEls.forEach(v => { v.play().catch(() => {}); });
        },
        (err) => { toast('❌ GPS: ' + err.message, 3000); startAutoPlacement(); },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
    function startAutoPlacement(){
      const n = window.videos.length;
      if (n === 0) return;
      setupMultiVideoElements();
      const radius = Math.max(2.5, n * 0.6);
      const arcSpan = Math.min(2.44, (n - 1) * 0.55);
      for (let i = 0; i < n; i++) {
        const angle = n === 1 ? 0 : -arcSpan / 2 + (arcSpan / Math.max(n - 1, 1)) * i;
        createGPSBoard(i, {
          x: radius * Math.sin(angle),
          y: 1.3,
          z: -radius * Math.cos(angle),
          dist: Math.round(radius)
        });
      }
      videoEls.forEach(v => { v.play().catch(() => {}); });
      gpsMode = true;
      toast('▶️ ' + n + ' vidéos placées !', 2000);
    }
    function createBoardIfNeeded(){
      if (boardGroup) return;

      boardGroup = new THREE.Group();

      // Frame background video plane
      const frameGeo = new THREE.PlaneGeometry(1.4, 2.2);
      const frameMat = new THREE.MeshBasicMaterial({ map: frameVideoTexture, side: THREE.DoubleSide });
      const framePlane = new THREE.Mesh(frameGeo, frameMat);
      boardGroup.add(framePlane);

      // Neon frame bars – cyan
      const frameColorOuter = 0x00e5ff;
      const frameColorInner = 0x6ee7ff;
      const frameDepth = 0.04;
      const frameThickness = 0.048;
      const frameWidth = 1.0;
      const frameHeight = 1.85;

      const frameMatNeon = new THREE.MeshStandardMaterial({
        color: frameColorOuter,
        emissive: frameColorOuter,
        emissiveIntensity: 1.8,
        metalness: 0.1,
        roughness: 0.2
      });
      frameMatGlobal = frameMatNeon;

      // Multiple colored lights for richer glow
      const neonLight1 = new THREE.PointLight(0x6ee7ff, 1.2, 3.5, 2.0);
      neonLight1.position.set(0, 0.6, 0.45);
      boardGroup.add(neonLight1);

      const neonLight2 = new THREE.PointLight(0xa78bfa, 0.6, 3, 2.0);
      neonLight2.position.set(0, -0.4, 0.35);
      boardGroup.add(neonLight2);

      const neonLight3 = new THREE.PointLight(0x60a5fa, 0.5, 2.5, 2.0);
      neonLight3.position.set(0.5, 0.3, 0.3);
      boardGroup.add(neonLight3);

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      topBar.position.set(0, frameHeight / 2, frameDepth / 2);
      boardGroup.add(topBar);

      const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(frameWidth, frameThickness, frameDepth), frameMatNeon);
      bottomBar.position.set(0, -frameHeight / 2, frameDepth / 2);
      boardGroup.add(bottomBar);

      const leftBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      leftBar.position.set(-frameWidth / 2, 0, frameDepth / 2);
      boardGroup.add(leftBar);

      const rightBar = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth), frameMatNeon);
      rightBar.position.set(frameWidth / 2, 0, frameDepth / 2);
      boardGroup.add(rightBar);

      // Corner accent dots
      const cornerMat = new THREE.MeshStandardMaterial({
        color: 0xa78bfa,
        emissive: 0xa78bfa,
        emissiveIntensity: 2.0
      });
      const cornerGeo = new THREE.SphereGeometry(0.032, 12, 12);
      const corners = [
        [-frameWidth/2, frameHeight/2], [frameWidth/2, frameHeight/2],
        [-frameWidth/2, -frameHeight/2], [frameWidth/2, -frameHeight/2]
      ];
      corners.forEach(([cx, cy]) => {
        const dot = new THREE.Mesh(cornerGeo, cornerMat);
        dot.position.set(cx, cy, frameDepth);
        boardGroup.add(dot);
      });

      // Ground glow shadow
      const groundGeo = new THREE.CircleGeometry(1.3, 64);
      const groundMat = new THREE.MeshBasicMaterial({
        color: 0x0088ff,
        transparent: true,
        opacity: 0.28
      });
      groundPlane = new THREE.Mesh(groundGeo, groundMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.set(0, -frameHeight / 2 - 0.05, 0);
      boardGroup.add(groundPlane);

      // Video plane
      const videoGeo = new THREE.PlaneGeometry(0.9, 1.6);
      const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
      const videoPlane = new THREE.Mesh(videoGeo, videoMat);
      videoPlane.position.set(0, -0.1, 0.02);
      boardGroup.add(videoPlane);

      // Info canvas (username / date)
      const infoGeo = new THREE.PlaneGeometry(0.9, 0.4);
      infoTexture = new THREE.CanvasTexture(infoCanvas);
      const infoMat = new THREE.MeshBasicMaterial({ map: infoTexture, transparent: true, side: THREE.DoubleSide });
      const infoPlane = new THREE.Mesh(infoGeo, infoMat);
      infoPlane.position.set(0, 1.15, 0.04);
      boardGroup.add(infoPlane);

      // Social column
      const socialGeo = new THREE.PlaneGeometry(0.28, 0.9);
      socialTexture = new THREE.CanvasTexture(socialCanvas);
      const socialMat = new THREE.MeshBasicMaterial({ map: socialTexture, transparent: true, side: THREE.DoubleSide });
      const socialPlane = new THREE.Mesh(socialGeo, socialMat);
      socialPlane.position.set(0.9 / 2 + 0.18, -0.1, 0.04);
      boardGroup.add(socialPlane);

      // Logo — centré au-dessus du board, bien visible
      const logoUrl = 'https://tcsqjgoxeykqmsmqusna.supabase.co/storage/v1/object/public/urbainar-assets/logoUrbainar.png';
      const logoTexture = new THREE.TextureLoader().load(logoUrl);
      logoTexture.colorSpace = THREE.SRGBColorSpace;
      const logoPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.55, 0.55),
        new THREE.MeshBasicMaterial({ map: logoTexture, transparent: true, side: THREE.DoubleSide, alphaTest: 0.05 })
      );
      logoPlane.position.set(0, frameHeight / 2 + 0.36, 0.06);
      boardGroup.add(logoPlane);

      scene.add(boardGroup);
    }

    function onSelect(){
      // In GPS mode: tap unmutes the closest visible GPS video instead of placing
      if (gpsMode && boardGroups.length > 0) {
        if (videoEls.length === 0) return;
        let closestIdx = 0;
        let closestDist = Infinity;
        const camPos = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        boardGroups.forEach((bg, i) => {
          if (!bg) return;
          const d = bg.position.distanceTo(camPos);
          if (d < closestDist) { closestDist = d; closestIdx = i; }
        });
        videoEls.forEach((v, i) => { v.muted = (i !== closestIdx); });
        toast("🔊 " + (usernames[closestIdx] || 'UrbainAR'));
        return;
      }

      if (!reticle.visible || !videoTexture) return;

      createBoardIfNeeded();
      boardGroup.position.setFromMatrixPosition(reticle.matrix);

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const objPos = new THREE.Vector3();
      boardGroup.getWorldPosition(objPos);

      const dir = new THREE.Vector3().subVectors(camPos, objPos);
      const angleY = Math.atan2(dir.x, dir.z);

      boardGroup.rotation.set(0, angleY, 0);

      // Utilise l'interaction utilisateur (tap XR) pour lancer la vidéo
      tryPlayWithCurrentVolume();

      toast("Placée.");
    }

    function setupInfoCanvas(){
      infoCanvas = document.createElement('canvas');

    function drawInfoText(index){
      if (!infoCtx) return;

      const username = usernames[index] || 'UrbainAR';
      const publishedAt = formatPublishedAt(index);

      infoCtx.clearRect(0, 0, infoCanvas.width, infoCanvas.height);

      // Glassmorphism bg with gradient
      const grad = infoCtx.createLinearGradient(0, 0, infoCanvas.width, infoCanvas.height);
      grad.addColorStop(0, 'rgba(8,20,50,0.88)');
      grad.addColorStop(1, 'rgba(6,14,36,0.92)');
      infoCtx.fillStyle = grad;

      const r = 28, w = infoCanvas.width - 40, h = infoCanvas.height - 40, x = 20, y = 20;
      infoCtx.beginPath();
      infoCtx.moveTo(x + r, y);
      infoCtx.lineTo(x + w - r, y);
      infoCtx.quadraticCurveTo(x + w, y, x + w, y + r);
      infoCtx.lineTo(x + w, y + h - r);
      infoCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      infoCtx.lineTo(x + r, y + h);
      infoCtx.quadraticCurveTo(x, y + h, x, y + h - r);
      infoCtx.lineTo(x, y + r);
      infoCtx.quadraticCurveTo(x, y, x + r, y);
      infoCtx.closePath();
      infoCtx.fill();

      // Gradient border stroke
      const borderGrad = infoCtx.createLinearGradient(x, y, x + w, y + h);
      borderGrad.addColorStop(0, 'rgba(110,231,255,0.55)');
      borderGrad.addColorStop(1, 'rgba(96,165,250,0.35)');
      infoCtx.strokeStyle = borderGrad;
      infoCtx.lineWidth = 2;
      infoCtx.stroke();

      // Gradient text for username
      const textGrad = infoCtx.createLinearGradient(40, 0, 200, 0);
      textGrad.addColorStop(0, '#6ee7ff');
      textGrad.addColorStop(1, '#60a5fa');
      infoCtx.fillStyle = textGrad;
      infoCtx.font = 'bold 32px system-ui';
      infoCtx.textBaseline = 'top';
      infoCtx.fillText(username, 40, 40);

      infoCtx.font = '22px system-ui';
      infoCtx.fillStyle = 'rgba(180,210,255,0.80)';
      infoCtx.fillText(publishedAt, 40, 92);

      if (infoTexture) infoTexture.needsUpdate = true;
    }

    function drawSocialColumn(index){
      if (!socialCtx) return;

      const likes = likesList[index] ?? 0;
      const views = viewsList[index] ?? 0;

      const w = socialCanvas.width;
      const h = socialCanvas.height;

      socialCtx.clearRect(0, 0, w, h);

      // Background
      const grad = socialCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, 'rgba(8,20,50,0.90)');
      grad.addColorStop(1, 'rgba(6,14,36,0.94)');
      socialCtx.fillStyle = grad;

      const r = 40, padX = 40, padY = 40, boxW = w - padX * 2, boxH = h - padY * 2;
      socialCtx.beginPath();
      socialCtx.moveTo(padX + r, padY);
      socialCtx.lineTo(padX + boxW - r, padY);
      socialCtx.quadraticCurveTo(padX + boxW, padY, padX + boxW, padY + r);
      socialCtx.lineTo(padX + boxW, padY + boxH - r);
      socialCtx.quadraticCurveTo(padX + boxW, padY + boxH, padX + boxW - r, padY + boxH);
      socialCtx.lineTo(padX + r, padY + boxH);
      socialCtx.quadraticCurveTo(padX, padY + boxH, padX, padY + boxH - r);
      socialCtx.lineTo(padX, padY + r);
      socialCtx.quadraticCurveTo(padX, padY, padX + r, padY);
      socialCtx.closePath();
      socialCtx.fill();

      // Gradient border
      const borderGrad = socialCtx.createLinearGradient(padX, padY, padX + boxW, padY + boxH);
      borderGrad.addColorStop(0, 'rgba(110,231,255,0.45)');
      borderGrad.addColorStop(1, 'rgba(167,139,250,0.30)');
      socialCtx.strokeStyle = borderGrad;
      socialCtx.lineWidth = 2;
      socialCtx.stroke();

      socialCtx.textAlign = 'center';
      socialCtx.textBaseline = 'middle';

      const centerX = w / 2;
      let centerY = padY + boxH * 0.30;

      socialCtx.font = '40px system-ui';
      socialCtx.fillStyle = '#ffffff';
      socialCtx.fillText('❤️', centerX, centerY - 30);

      // Gradient numbers
      const numGrad = socialCtx.createLinearGradient(centerX - 30, 0, centerX + 30, 0);
      numGrad.addColorStop(0, '#6ee7ff');
      numGrad.addColorStop(1, '#60a5fa');
      socialCtx.fillStyle = numGrad;
      socialCtx.font = 'bold 28px system-ui';
      socialCtx.fillText(String(likes), centerX, centerY + 18);

      centerY = padY + boxH * 0.68;

      socialCtx.font = '40px system-ui';
      socialCtx.fillStyle = '#ffffff';
      socialCtx.fillText('👁', centerX, centerY - 30);

      const numGrad2 = socialCtx.createLinearGradient(centerX - 30, 0, centerX + 30, 0);
      numGrad2.addColorStop(0, '#a78bfa');
      numGrad2.addColorStop(1, '#60a5fa');
      socialCtx.fillStyle = numGrad2;
      socialCtx.font = 'bold 28px system-ui';
      socialCtx.fillText(String(views), centerX, centerY + 18);

      if (socialTexture) socialTexture.needsUpdate = true;
    }

    function loadVideo(index){
      if (!window.videos || window.videos.length === 0) return;
      if (index < 0 || index >= window.videos.length) return;

      currentIndex = index;

      const url = window.videos[index];
      videoElement.src = url;

      // Démarrer muted pour contourner la politique d'autoplay du navigateur.
      // Le volume réel sera appliqué dès que l'utilisateur interagit (onSelect / tap).
      videoElement.muted = true;
      videoElement.volume = 0;

      setLoading(true);
      videoElement.load();

      // HUD — username, date, likes, vues
      document.getElementById('video-username').textContent = usernames[index] || 'UrbainAR';
      document.getElementById('video-date').textContent    = formatPublishedAt(index);
      document.getElementById('video-likes').textContent   = formatCount(likesList[index] ?? 0);
      document.getElementById('video-views').textContent   = formatCount(viewsList[index] ?? 0);
      document.getElementById('video-meta').textContent =
        window.videos.length > 1 ? 'Utilise ⟵ ⟶ pour changer de vidéo.' : '🎥 Vidéo UrbainAR';

      document.getElementById('video-count').textContent =
        window.videos.length > 1 ? `${index + 1} / ${window.videos.length}` : '';

      drawInfoText(index);
      drawSocialColumn(index);
      updateNavButtonsState();
      syncCardHighlight(index);
    }
    window.loadVideo = loadVideo;

    function updateNavButtonsState(){
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      if (!btnPrev || !btnNext) return;

      if (window.videos.length <= 1) {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      } else {
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === window.videos.length - 1;
      }
    }

    function playCurrentVideo(){
      if (!videoElement) return;
      tryPlayWithCurrentVolume();

      if (frameVideoElement && frameVideoElement.paused) {
        frameVideoElement.play().catch(() => {});
      }
    }
    window.playCurrentVideo = playCurrentVideo;

    window.nextVideo = function(){
      if (currentIndex < window.videos.length - 1) {
        loadVideo(currentIndex + 1);
        playCurrentVideo();
      }
    };

    window.prevVideo = function(){
      if (currentIndex > 0) {
        loadVideo(currentIndex - 1);
        playCurrentVideo();
      }
    };

    window.closeAr = function(){
      if (history.length > 1) history.back();
      else window.close();
    };

    let noHitFrames = 0;

    function render(timestamp, frame){
      const session = renderer.xr.getSession();
      if (session && hitTestSourceRequested && hitTestSource && frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          noHitFrames = 0;
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = !(gpsMode && boardGroups.length > 0);
          reticle.matrix.fromArray(pose.transform.matrix);

          const s = 1 + Math.sin(timestamp * 0.008) * 0.12;
          reticle.scale.set(s, s, s);
        } else {
          reticle.visible = false;
          noHitFrames++;
          if (noHitFrames > 120) {
            const meta = document.getElementById('video-meta');
            if (meta) meta.textContent = "Déplace ton téléphone : vise un sol contrasté et mieux éclairé.";
          }
        }
      }

      const t = timestamp * 0.001;

      // Neon frame pulse – cyan to purple shift
      if (frameMatGlobal) {
        frameMatGlobal.emissiveIntensity = 1.6 + Math.sin(t * 2.0) * 0.45;
      }

      // Ground glow pulse
      if (groundPlane) {
        groundPlane.material.opacity = 0.22 + Math.abs(Math.sin(t * 1.5)) * 0.16;
        const scale = 1.0 + Math.sin(t * 1.2) * 0.06;
        groundPlane.scale.set(scale, scale, 1);
      }

      // Forcer la mise à jour des textures vidéo à chaque frame (requis sur iOS/Safari)
      if (videoTexture && videoElement && !videoElement.paused) videoTexture.needsUpdate = true;
      if (frameVideoTexture && frameVideoElement && !frameVideoElement.paused) frameVideoTexture.needsUpdate = true;

      // GPS mode: billboard effect + multi-texture update
      if (gpsMode && boardGroups.length > 0) {
        const camPos = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        boardGroups.forEach((bg) => {
          if (!bg) return;
          bg.lookAt(camPos.x, bg.position.y, camPos.z);
        });
        videoTexs.forEach((tex, i) => {
          if (boardGroups[i] && videoEls[i] && !videoEls[i].paused) tex.needsUpdate = true;
        });
      }

      renderer.render(scene, camera);
    }

    if (!('xr' in navigator)) {
      document.getElementById('video-meta').textContent =
        "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
      console.error("navigator.xr non disponible");
    } else {
      init();
    }
  </script>
</body>
</html>
