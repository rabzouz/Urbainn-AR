<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR 3D</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fcor/arjs-gestures@master/dist/gestures.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 12px;
        font-family: sans-serif;
        border-radius: 4px;
      }

      .a-enter-vr, .a-enter-ar { display: none !important; }
    </style>
  </head>
  <body>
    <div id="info">Chargement des vidéos...</div>

    <a-scene
      embedded
      xr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
      gesture-detector
    >
      <a-assets id="assets"></a-assets>
      <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>
    </a-scene>

    <script>
      const info = document.getElementById('info');
      const sceneEl = document.querySelector('a-scene');
      const assetsEl = document.getElementById('assets');

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let videos = [];
      let videoElements = [];

      async function loadVideos() {
        try {
          info.textContent = 'Chargement des vidéos depuis Supabase...';

          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(5);

          if (error) throw error;

          videos = data || [];
          info.textContent = `${videos.length} vidéo(s) chargée(s). Touche les vidéos pour les manipuler.`;

          if (videos.length === 0) {
            info.textContent = 'Aucune vidéo. Utilise l\'app pour poster !';
            return;
          }

          createVideoPanels();
        } catch (err) {
          console.error('Erreur:', err);
          info.textContent = 'Erreur: ' + err.message;
        }
      }

      function createVideoPanels() {
        const spacing = 2.5; // espacement horizontal
        const startX = -(videos.length - 1) * spacing / 2; // centrer

        videos.forEach((video, index) => {
          const videoId = `vid-${video.id}`;
          
          // Créer élément vidéo HTML
          const videoEl = document.createElement('video');
          videoEl.id = videoId;
          videoEl.src = video.video_url;
          videoEl.loop = true;
          videoEl.muted = true;
          videoEl.setAttribute('playsinline', '');
          videoEl.setAttribute('webkit-playsinline', '');
          videoEl.setAttribute('crossorigin', 'anonymous');
          videoEl.play().catch(e => console.log('autoplay:', e));
          
          assetsEl.appendChild(videoEl);
          videoElements.push({ video, element: videoEl });

          // Position reculée (z: -5 au lieu de -3)
          const x = startX + (index * spacing);
          const y = 1.6;
          const z = -5;

          // Container pour grouper vidéo + UI
          const container = document.createElement('a-entity');
          container.setAttribute('position', `${x} ${y} ${z}`);
          container.setAttribute('gesture-handler', 'minScale: 0.3; maxScale: 3');

          // Plane vidéo (ratio 9:16)
          const videoWidth = 0.9;
          const videoHeight = videoWidth * (16 / 9);

          const plane = document.createElement('a-plane');
          plane.setAttribute('width', videoWidth);
          plane.setAttribute('height', videoHeight);
          plane.setAttribute('material', `shader: flat; src: #${videoId}`);
          plane.setAttribute('position', '0 0 0');

          // Clic pour activer le son de CETTE vidéo
          plane.addEventListener('click', () => {
            videoEl.muted = false;
            videoEl.play();
            console.log(`Son activé pour: ${video.title}`);
          });

          container.appendChild(plane);

          // Logo UrbainAR flottant au-dessus (texte 3D)
          const logo = document.createElement('a-text');
          logo.setAttribute('value', 'UrbainAR');
          logo.setAttribute('align', 'center');
          logo.setAttribute('width', 3);
          logo.setAttribute('color', '#00D4FF');
          logo.setAttribute('position', `0 ${videoHeight / 2 + 0.3} 0.01`);
          logo.setAttribute('font', 'roboto');
          container.appendChild(logo);

          // Nom utilisateur
          const username = document.createElement('a-text');
          username.setAttribute('value', video.user_id || 'Anonyme');
          username.setAttribute('align', 'center');
          username.setAttribute('width', 2.5);
          username.setAttribute('color', '#FFFFFF');
          username.setAttribute('position', `0 ${videoHeight / 2 + 0.15} 0.01`);
          container.appendChild(username);

          // Nombre de vues (en bas à gauche)
          const views = document.createElement('a-text');
          views.setAttribute('value', `${video.view_count || 0} vues`);
          views.setAttribute('align', 'left');
          views.setAttribute('width', 1.5);
          views.setAttribute('color', '#FFFFFF');
          views.setAttribute('position', `${-videoWidth / 2 + 0.05} ${-videoHeight / 2 - 0.15} 0.01`);
          container.appendChild(views);

          // Nombre de likes (en bas à droite)
          const likes = document.createElement('a-text');
          likes.setAttribute('value', `❤ ${video.like_count || 0}`);
          likes.setAttribute('align', 'right');
          likes.setAttribute('width', 1.5);
          likes.setAttribute('color', '#FF5A7A');
          likes.setAttribute('position', `${videoWidth / 2 - 0.05} ${-videoHeight / 2 - 0.15} 0.01`);
          container.appendChild(likes);

          // Cadre décoratif autour de la vidéo
          const frame = document.createElement('a-box');
          frame.setAttribute('width', videoWidth + 0.05);
          frame.setAttribute('height', videoHeight + 0.05);
          frame.setAttribute('depth', 0.02);
          frame.setAttribute('color', '#222222');
          frame.setAttribute('position', '0 0 -0.03');
          container.appendChild(frame);

          sceneEl.appendChild(container);
        });
      }

      // Charger au démarrage
      sceneEl.addEventListener('loaded', () => {
        loadVideos();
      });
    </script>
  </body>
</html>
