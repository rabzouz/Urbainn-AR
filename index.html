<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #soundBtn {
        position: fixed; z-index: 10; bottom: 20px; left: 50%;
        transform: translateX(-50%); padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8); color: white;
        border: none; border-radius: 8px; font-size: 16px;
        font-weight: bold; cursor: pointer;
      }

      #navBtns {
        position: fixed; z-index: 10; bottom: 80px; left: 50%;
        transform: translateX(-50%); display: flex; gap: 10px;
      }

      .navBtn {
        padding: 10px 20px; background: rgba(0, 0, 0, 0.7);
        color: white; border: none; border-radius: 6px;
        font-size: 18px; cursor: pointer;
      }

      #videoCounter {
        position: fixed; z-index: 10; top: 10px; right: 10px;
        padding: 8px 16px; background: rgba(0, 0, 0, 0.7);
        color: white; font-size: 14px; font-family: sans-serif;
        border-radius: 20px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="videoCounter">1/1</div>
    <button id="soundBtn">🔊 Activer le son</button>
    
    <div id="navBtns">
      <button class="navBtn" id="prevBtn">◀</button>
      <button class="navBtn" id="nextBtn">▶</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-assets id="assets"></a-assets>
      <a-marker preset="hiro" id="marker" smooth="true" smoothCount="5">
        <a-entity id="container" position="0 0.5 0"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const soundBtn = document.getElementById('soundBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const counter = document.getElementById('videoCounter');
      const container = document.getElementById('container');
      const assets = document.getElementById('assets');

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let videos = [];
      let currentIndex = 0;
      let soundEnabled = false; // Variable pour savoir si le son est activé

      async function load() {
        try {
          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (error) throw error;

          videos = data || [];
          
          if (videos.length === 0) {
            counter.textContent = 'Aucune vidéo';
            return;
          }

          videos.forEach((video, index) => {
            const videoId = `vid-${index}`;
            
            const videoEl = document.createElement('video');
            videoEl.id = videoId;
            videoEl.src = video.video_url;
            videoEl.loop = true;
            videoEl.muted = true; // Toujours mute par défaut
            videoEl.setAttribute('playsinline', '');
            videoEl.setAttribute('webkit-playsinline', '');
            videoEl.setAttribute('crossorigin', 'anonymous');
            
            assets.appendChild(videoEl);
          });

          showVideo(0);

        } catch (e) {
          console.error('Erreur:', e);
          counter.textContent = 'Erreur';
        }
      }

      function showVideo(index) {
        if (!videos[index]) return;

        // MUTE toutes les autres vidéos
        videos.forEach((v, i) => {
          const videoEl = document.getElementById(`vid-${i}`);
          if (i !== index && videoEl) {
            videoEl.muted = true;
            videoEl.pause();
          }
        });

        currentIndex = index;
        const video = videos[index];
        const videoId = `vid-${index}`;
        const videoEl = document.getElementById(videoId);

        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        const videoWidth = 0.9;
        const videoHeight = videoWidth * (16 / 9);

        const plane = document.createElement('a-plane');
        plane.setAttribute('width', videoWidth);
        plane.setAttribute('height', videoHeight);
        plane.setAttribute('material', `shader: flat; src: #${videoId}`);
        plane.setAttribute('rotation', '-90 0 0');
        plane.setAttribute('position', '0 0 0');
        
        plane.addEventListener('click', function() {
          soundEnabled = true;
          videoEl.muted = false;
          videoEl.play();
          soundBtn.style.display = 'none';
        });

        container.appendChild(plane);

        // Logo UrbainAR
        const logo = document.createElement('a-text');
        logo.setAttribute('value', 'UrbainAR');
        logo.setAttribute('align', 'center');
        logo.setAttribute('width', '2.5');
        logo.setAttribute('color', '#00D4FF');
        logo.setAttribute('position', `0 0.02 ${videoHeight / 2 + 0.25}`);
        logo.setAttribute('rotation', '-90 0 0');
        container.appendChild(logo);

        // Titre
        const title = document.createElement('a-text');
        title.setAttribute('value', video.title || 'Sans titre');
        title.setAttribute('align', 'center');
        title.setAttribute('width', '1.8');
        title.setAttribute('color', '#FFFF00');
        title.setAttribute('position', `0 0.02 ${videoHeight / 2 + 0.1}`);
        title.setAttribute('rotation', '-90 0 0');
        container.appendChild(title);

        // Stats
        const stats = document.createElement('a-text');
        stats.setAttribute('value', `👁 ${video.view_count || 0}  ❤ ${video.like_count || 0}`);
        stats.setAttribute('align', 'center');
        stats.setAttribute('width', '1.3');
        stats.setAttribute('color', '#FFFFFF');
        stats.setAttribute('position', `0 0.02 ${-videoHeight / 2 - 0.15}`);
        stats.setAttribute('rotation', '-90 0 0');
        container.appendChild(stats);

        // Si le son était activé, le garder pour la nouvelle vidéo
        videoEl.muted = !soundEnabled;
        videoEl.currentTime = 0;
        videoEl.play().catch(e => console.log('autoplay:', e));

        counter.textContent = `${index + 1}/${videos.length}`;
      }

      prevBtn.addEventListener('click', () => {
        const newIndex = (currentIndex - 1 + videos.length) % videos.length;
        showVideo(newIndex);
      });

      nextBtn.addEventListener('click', () => {
        const newIndex = (currentIndex + 1) % videos.length;
        showVideo(newIndex);
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = true;
        const videoId = `vid-${currentIndex}`;
        const videoEl = document.getElementById(videoId);
        videoEl.muted = false;
        videoEl.play();
        soundBtn.style.display = 'none';
      });

      document.querySelector('a-scene').addEventListener('loaded', load);
    </script>
  </body>
</html>
