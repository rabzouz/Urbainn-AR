<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>UrbainAR WebAR 3D</title>

    <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>

    <style>
      body, html { margin: 0; overflow: hidden; }

      #info {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 11px;
        font-family: sans-serif;
        border-radius: 4px;
        max-width: 85%;
        max-height: 30%;
        overflow-y: auto;
      }

      #soundBtn {
        position: fixed;
        z-index: 10;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      #navBtns {
        position: fixed;
        z-index: 10;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }

      .navBtn {
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="info">Chargement...</div>
    <button id="soundBtn">🔊 Activer le son</button>
    
    <div id="navBtns">
      <button class="navBtn" id="prevBtn">◀</button>
      <button class="navBtn" id="nextBtn">▶</button>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; maxDetectionRate: 60;"
      vr-mode-ui="enabled: false"
    >
      <a-assets id="assets"></a-assets>

      <a-marker preset="hiro" id="marker" smooth="true" smoothCount="5">
        <a-entity id="videoContainer" position="0 0.5 0"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const info = document.getElementById('info');
      const soundBtn = document.getElementById('soundBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const sceneEl = document.querySelector('a-scene');
      const assetsEl = document.getElementById('assets');
      const containerEl = document.getElementById('videoContainer');

      const SUPABASE_URL = 'https://tcsqjgoxeykqmsmqusna.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjc3FqZ294ZXlrcW1zbXF1c25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3OTkxMjgsImV4cCI6MjA3OTM3NTEyOH0.uD_cFBkfpTjCyseyKKh-Dn2xqq1DDVKfLBV40Hhdpf0';

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let videos = [];
      let currentIndex = 0;

      async function loadVideos() {
        try {
          info.textContent = 'Chargement des vidéos depuis Supabase...';

          const { data, error } = await supabaseClient
            .from('videos')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(10);

          if (error) {
            console.error('Erreur Supabase:', error);
            info.textContent = 'Erreur Supabase: ' + error.message;
            throw error;
          }

          videos = data || [];
          
          // DEBUG: afficher toutes les URLs
          console.log('=== VIDÉOS CHARGÉES ===');
          let debugText = `${videos.length} vidéo(s) chargées:\n\n`;
          
          videos.forEach((v, i) => {
            console.log(`Video ${i+1}:`, v.title, v.video_url);
            debugText += `${i+1}. ${v.title || 'Sans titre'}\n`;
            debugText += `   URL: ${v.video_url.substring(0, 60)}...\n`;
            debugText += `   User: ${v.user_id}\n\n`;
          });
          
          info.innerHTML = debugText.replace(/\n/g, '<br>');

          if (videos.length === 0) {
            info.textContent = 'Aucune vidéo dans la table videos.';
            return;
          }

          // Créer toutes les vidéos HTML
          videos.forEach((video, index) => {
            const videoId = `vid-${index}`; // Simplifié pour debug
            
            const videoEl = document.createElement('video');
            videoEl.id = videoId;
            videoEl.src = video.video_url;
            videoEl.loop = true;
            videoEl.muted = true;
            videoEl.setAttribute('playsinline', '');
            videoEl.setAttribute('webkit-playsinline', '');
            videoEl.setAttribute('crossorigin', 'anonymous');
            
            videoEl.addEventListener('loadeddata', () => {
              console.log(`Vidéo ${index} prête:`, video.title);
            });

            videoEl.addEventListener('error', (e) => {
              console.error(`Erreur vidéo ${index}:`, e, video.video_url);
            });
            
            assetsEl.appendChild(videoEl);
          });

          setTimeout(() => {
            showVideo(0);
          }, 500);

        } catch (err) {
          console.error('Erreur:', err);
          info.textContent = 'Erreur: ' + err.message;
        }
      }

      function showVideo(index) {
        if (!videos[index]) {
          console.error('Vidéo inexistante à l\'index', index);
          return;
        }

        currentIndex = index;
        const video = videos[index];
        const videoId = `vid-${index}`;
        const videoEl = document.getElementById(videoId);

        console.log(`=== AFFICHAGE VIDÉO ${index + 1} ===`);
        console.log('Titre:', video.title);
        console.log('URL:', video.video_url);
        console.log('Élément vidéo:', videoEl);

        // Vider le container
        while (containerEl.firstChild) {
          containerEl.removeChild(containerEl.firstChild);
        }

        const videoWidth = 0.9;
        const videoHeight = videoWidth * (16 / 9);

        // Plane vidéo
        const plane = document.createElement('a-plane');
        plane.setAttribute('width', videoWidth);
        plane.setAttribute('height', videoHeight);
        plane.setAttribute('material', `shader: flat; src: #${videoId}`);
        plane.setAttribute('rotation', '-90 0 0');
        plane.setAttribute('position', '0 0 0');
        
        plane.addEventListener('click', function() {
          console.log('Click sur vidéo', index);
          videoEl.muted = false;
          videoEl.play();
          soundBtn.style.display = 'none';
        });

        containerEl.appendChild(plane);

        // Logo
        const logo = document.createElement('a-text');
        logo.setAttribute('value', 'UrbainAR');
        logo.setAttribute('align', 'center');
        logo.setAttribute('width', '2.5');
        logo.setAttribute('color', '#00D4FF');
        logo.setAttribute('position', `0 0.02 ${videoHeight / 2 + 0.25}`);
        logo.setAttribute('rotation', '-90 0 0');
        containerEl.appendChild(logo);

        // Titre
        const title = document.createElement('a-text');
        title.setAttribute('value', video.title || 'Sans titre');
        title.setAttribute('align', 'center');
        title.setAttribute('width', '2');
        title.setAttribute('color', '#FFFF00');
        title.setAttribute('position', `0 0.02 ${videoHeight / 2 + 0.1}`);
        title.setAttribute('rotation', '-90 0 0');
        containerEl.appendChild(title);

        // Username
        const username = document.createElement('a-text');
        username.setAttribute('value', `@${video.user_id || 'anonyme'}`);
        username.setAttribute('align', 'center');
        username.setAttribute('width', '1.5');
        username.setAttribute('color', '#FFFFFF');
        username.setAttribute('position', `0 0.02 ${-videoHeight / 2 - 0.15}`);
        username.setAttribute('rotation', '-90 0 0');
        containerEl.appendChild(username);

        // Vues / Likes
        const stats = document.createElement('a-text');
        stats.setAttribute('value', `👁 ${video.view_count || 0}  ❤ ${video.like_count || 0}`);
        stats.setAttribute('align', 'center');
        stats.setAttribute('width', '1.3');
        stats.setAttribute('color', '#FFFFFF');
        stats.setAttribute('position', `0 0.02 ${-videoHeight / 2 - 0.28}`);
        stats.setAttribute('rotation', '-90 0 0');
        containerEl.appendChild(stats);

        // Play
        videoEl.currentTime = 0;
        videoEl.play().catch(e => console.log('autoplay:', e));

        info.textContent = `Vidéo ${index + 1}/${videos.length}: "${video.title || 'Sans titre'}" - ${video.video_url.substring(video.video_url.lastIndexOf('/') + 1, video.video_url.lastIndexOf('/') + 30)}...`;
      }

      // Navigation
      prevBtn.addEventListener('click', () => {
        const newIndex = (currentIndex - 1 + videos.length) % videos.length;
        console.log('Navigation PREV:', currentIndex, '->', newIndex);
        showVideo(newIndex);
      });

      nextBtn.addEventListener('click', () => {
        const newIndex = (currentIndex + 1) % videos.length;
        console.log('Navigation NEXT:', currentIndex, '->', newIndex);
        showVideo(newIndex);
      });

      soundBtn.addEventListener('click', () => {
        const videoId = `vid-${currentIndex}`;
        const videoEl = document.getElementById(videoId);
        videoEl.muted = false;
        videoEl.play();
        soundBtn.style.display = 'none';
      });

      sceneEl.addEventListener('loaded', () => {
        loadVideos();
      });
    </script>
  </body>
</html>
