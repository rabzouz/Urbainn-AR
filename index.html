<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>UrbainAR - WebXR AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      background: #000;
      color: #fff;
    }

    canvas {
      display: block;
    }

    /* Top bar infos vidéo sélectionnée */
    #video-info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 68px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 10;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    #video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    #video-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    #video-count {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Bouton Fermer */
    #top-right {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #btn-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    #btn-close:active {
      transform: scale(0.95);
    }

    /* Contrôles bas (juste son ON/OFF ici) */
    #video-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #video-nav button {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #xr-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

<!-- UI overlay -->
<div id="video-info">
  <div id="video-title">Chargement de la vidéo...</div>
  <div id="video-meta">WebXR AR : tape pour placer l'écran vidéo sur le sol.</div>
  <div id="video-count">1 vidéo en cours</div>
</div>

<div id="top-right">
  <button id="btn-close" onclick="closeAr()" title="Fermer l'AR">✕</button>
</div>

<div id="video-nav">
  <button id="btn-sound" onclick="toggleSound()" title="Son ON/OFF">🔊</button>
</div>

<!-- Vidéo HTML5 source pour la texture -->
<video
  id="video"
  src=""
  preload="auto"
  loop
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="display:none">
</video>

<div id="xr-button"></div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  let videoElement = null;
  let videoTexture = null;
  let soundEnabled = true;
  let videoPlane = null;

  function init() {
    // --- Three.js de base ---
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Réticule (comme l’exemple officiel three.js) [web:253]
    const ringGeo = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Bouton WebXR
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    });
    document.getElementById('xr-button').appendChild(arButton);

    // Session AR
    renderer.xr.addEventListener('sessionstart', async () => {
      const session = renderer.xr.getSession();
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      hitTestSourceRequested = true;

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      // Geste "tap" = place/maj l'écran vidéo
      session.addEventListener('select', onSelect);
    });

    window.addEventListener('resize', onWindowResize);
    renderer.setAnimationLoop(render);

    // Charger la vidéo depuis ?video=
    parseUrlParamsAndLoadVideo();
    playCurrentVideo();
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function onSelect() {
  if (!reticle.visible || !videoTexture) return;

  if (!videoPlane) {
    // Plane 1080x1920 → ratio 9:16
    const geometry = new THREE.PlaneGeometry(0.9, 1.6);
    const material = new THREE.MeshBasicMaterial({
      map: videoTexture,
      side: THREE.DoubleSide
    });
    videoPlane = new THREE.Mesh(geometry, material);
    scene.add(videoPlane);
  }

  // Placer l’écran à la position du reticle
  videoPlane.position.setFromMatrixPosition(reticle.matrix);

  // Orienter seulement autour de Y (verticale), pour qu’il reste bien droit
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);

  const objPos = new THREE.Vector3();
  videoPlane.getWorldPosition(objPos);

  const dir = new THREE.Vector3().subVectors(camPos, objPos);
  const angleY = Math.atan2(dir.x, dir.z); // rotation dans le plan XZ

  videoPlane.rotation.set(0, angleY, 0); // vertical (rotation sur Y seulement)
}


  function parseUrlParamsAndLoadVideo() {
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('video');

    videoElement = document.getElementById('video');

    if (!videoUrl) {
      document.getElementById('video-title').textContent = "Paramètre vidéo manquant";
      console.error("Paramètre ?video manquant dans l'URL");
      return;
    }

    videoElement.src = videoUrl;
    videoElement.muted = !soundEnabled;
    videoElement.load();

    videoElement.addEventListener('ended', () => {
      videoElement.currentTime = 0;
      videoElement.play().catch(() => {});
    });

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.encoding = THREE.sRGBEncoding;

    document.getElementById('video-title').textContent = 'Vidéo UrbainAR';
    document.getElementById('video-meta').textContent = 'Bouge un peu, attends le réticule vert, puis tape pour placer la vidéo.';
    document.getElementById('video-count').textContent = '1 vidéo en cours';

    console.log('▶️ Vidéo chargée pour WebXR AR');
  }

  function playCurrentVideo() {
    if (!videoElement) return;
    videoElement
      .play()
      .then(() => console.log('▶️ Lecture vidéo'))
      .catch((e) => {
        console.log('⚠️ Autoplay bloqué, mute forcé.', e);
        soundEnabled = false;
        videoElement.muted = true;
        videoElement.play().catch(() => {});
        const btn = document.getElementById('btn-sound');
        if (btn) {
          btn.textContent = '🔇';
          btn.title = 'Son OFF';
        }
      });
  }

  // Toggle son
  window.toggleSound = function () {
    soundEnabled = !soundEnabled;
    if (videoElement) {
      videoElement.muted = !soundEnabled;
    }
    const btn = document.getElementById('btn-sound');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.title = soundEnabled ? 'Son ON' : 'Son OFF';
  };

  // Fermer
  window.closeAr = function () {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  };

  // Fallback : premier tap écran → autoriser play() sur Android
  window.addEventListener('click', () => {
    if (videoElement && videoElement.paused) {
      videoElement.play().catch(() => {});
    }
  }, { once: true });

  function render(timestamp, frame) {
    const session = renderer.xr.getSession();
    if (session && hitTestSourceRequested && hitTestSource && frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  }

  // Démarrage
  if (!('xr' in navigator)) {
    document.getElementById('video-meta').textContent =
      "WebXR AR non supporté sur ce navigateur (ouvre dans Chrome Android).";
    console.error("navigator.xr non disponible");
  } else {
    init();
  }
</script>

</body>
</html>
